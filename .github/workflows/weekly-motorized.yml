name: weekly-motorized
# Stage 1 motorized data pipeline — one job per layer, all through the shared
# normalizer stack (lib/route_common.py):
#   mvum          USFS MVUM roads + trails (+ NFS Trails attr enrichment)
#   roads_context USFS RoadCore full road inventory (grey context, never green)
#   nfs_trails    USFS NFS Trails (tileset only; no client layer in Stage 1)
#   blm_routes    BLM GTLF Public Display motorized layers 0-3
#   nps_roads     NPS Public Roads
# Each job: fetch -> normalize (review queue) -> QA -> tippecanoe -> versioned
# PMTiles upload to R2 + KV alias flip. Runs without secrets too: builds + QA +
# attaches artifacts, skips upload. The worker is layer-name-agnostic — new
# tilesets go live purely by uploading + flipping layer-alias:{layer}.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC (upstream refreshes ~weekly)
  workflow_dispatch:
    inputs:
      layers:
        description: "Comma-separated subset to run: mvum,roads_context,nfs_trails,blm_routes,nps_roads (or 'all')"
        required: false
        default: "all"

# actions: read lets the stability steps `gh run download` a previous run's
# rtecn-ids-* artifact (actions/cache was useless here: its 7-day eviction sat
# exactly on the weekly cron boundary, so the baseline never survived to the
# next run and the gate never armed).
permissions:
  contents: read
  actions: read

env:
  UA: "RuggedRoute-dataops/1.0 (riggs1991@gmail.com)"
  KV_NAMESPACE_ID: f2f28315ee8f43fb8413d1bcddd20684

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test the normalizers
        run: cd lib && python3 -m unittest -v

  # ──────────────────────────────────────────────────────────────── mvum ──
  mvum:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.layers == 'all' || inputs.layers == '' || contains(inputs.layers, 'mvum')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true

      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin

      - name: Cache tippecanoe
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-2.79.0

      - name: Build tippecanoe
        if: steps.tcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin
          cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/

      - name: Install pmtiles CLI
        run: |
          curl -fsSL -o /tmp/pm.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.0/go-pmtiles_1.31.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/pm.tar.gz -C /tmp pmtiles
          sudo mv /tmp/pmtiles /usr/local/bin/

      - name: Fetch MVUM GDBs + NFS Trails GDB (bulk = system of record)
        run: |
          curl -A "$UA" -fSL --retry 3 -o road.gdb.zip https://data.fs.usda.gov/geodata/edw/edw_resources/fc/Trans_MVUM_Road.gdb.zip
          curl -A "$UA" -fSL --retry 3 -o trail.gdb.zip https://data.fs.usda.gov/geodata/edw/edw_resources/fc/Trans_MVUM_Trail.gdb.zip
          # python3 -m zipfile, not unzip: USFS zips can carry a null-byte prefix before the
          # first local header (seen on Trans_Trail_NFS_Publish 2026-08-03, 618 zero bytes).
          # unzip hard-fails on the shifted offsets; zipfile anchors on the central directory.
          python3 -m zipfile -e road.gdb.zip road_gdb && python3 -m zipfile -e trail.gdb.zip trail_gdb
          rm -f road.gdb.zip trail.gdb.zip
          # Enrichment source is best-effort: fetch/unzip failure must not sink the MVUM build
          if curl -A "$UA" -fSL --retry 3 -o nfspub.gdb.zip https://data.fs.usda.gov/geodata/edw/edw_resources/fc/Trans_Trail_NFS_Publish.gdb.zip \
             && python3 -m zipfile -e nfspub.gdb.zip nfspub_gdb; then
            rm -f nfspub.gdb.zip
          else
            echo "::warning::NFS Trails GDB fetch/unzip failed — MVUM trails will build unenriched"
            rm -rf nfspub_gdb nfspub.gdb.zip
          fi

      - name: Normalize
        run: |
          set -euo pipefail
          # Robust GDB discovery: any depth, case-insensitive, plus a flat-extraction
          # fallback (a zip without directory entries can strand gdbtable files at the
          # extract root). Loud diagnostics on failure — never fail silently again.
          locate_gdb() {
            local root="$1" hit
            hit=$(find "$root" -type d -iname '*.gdb' -print 2>/dev/null | head -1) || true
            if [ -z "$hit" ] && compgen -G "$root/a0000000*.gdbtable" > /dev/null; then
              mv "$root" "${root}.gdb" && hit="${root}.gdb"
            fi
            if [ -z "$hit" ]; then
              echo "::error::no FileGDB under $root — listing follows" >&2
              find "$root" -maxdepth 3 2>/dev/null | head -40 >&2
              return 1
            fi
            printf '%s\n' "$hit"
          }
          detect_layer() { # $1=gdb $2=fallback name
            local layer
            layer=$(ogrinfo -ro "$1" 2>/dev/null | sed -n 's/^[0-9][0-9]*: \([^ ]*\).*/\1/p' | head -1) || true
            printf '%s\n' "${layer:-$2}"
          }
          ROAD_GDB=$(locate_gdb road_gdb)
          TRAIL_GDB=$(locate_gdb trail_gdb)
          ROAD_LAYER=$(detect_layer "$ROAD_GDB" Trans_MVUM_Road)
          TRAIL_LAYER=$(detect_layer "$TRAIL_GDB" Trans_MVUM_Trail)
          echo "road: $ROAD_GDB :: $ROAD_LAYER   trail: $TRAIL_GDB :: $TRAIL_LAYER"
          ogrinfo -ro -so "$ROAD_GDB" "$ROAD_LAYER" | sed -n '1,12p'

          # NFS Trails enrichment sidecar (best effort — join failure => warn + unenriched)
          NFS_FLAG=""
          if [ -d nfspub_gdb ]; then
            if NFS_GDB=$(locate_gdb nfspub_gdb) \
               && NFS_LAYER=$(detect_layer "$NFS_GDB" Trans_Trail_NFS_Publish) \
               && ogr2ogr -f GeoJSONSeq /vsistdout/ "$NFS_GDB" "$NFS_LAYER" -t_srs EPSG:4326 -dim XY \
                  | python3 lib/normalize_nfs_trails.py --review-out review_queue_nfs_sidecar.jsonl \
                      --attrs-out nfs_attrs.json > /dev/null \
               && [ -s nfs_attrs.json ]; then
              NFS_FLAG="--nfs-attrs nfs_attrs.json"
              echo "NFS enrichment sidecar ready ($(wc -c < nfs_attrs.json) bytes)"
            else
              echo "::warning::NFS attrs sidecar build failed — proceeding unenriched"
            fi
          fi

          ogr2ogr -f GeoJSONSeq /vsistdout/ "$ROAD_GDB" "$ROAD_LAYER" -t_srs EPSG:4326 -dim XY \
            | python3 lib/normalize_mvum.py --kind road --review-out review_queue_roads.jsonl \
            > mvum_roads.geojsonl
          ogr2ogr -f GeoJSONSeq /vsistdout/ "$TRAIL_GDB" "$TRAIL_LAYER" -t_srs EPSG:4326 -dim XY \
            | python3 lib/normalize_mvum.py --kind trail --review-out review_queue_trails.jsonl $NFS_FLAG \
            > mvum_trails.geojsonl
          wc -l mvum_roads.geojsonl mvum_trails.geojsonl review_queue_*.jsonl || true
          rm -rf road_gdb trail_gdb nfspub_gdb

      - name: QA — golden bbox counts vs live EDW
        run: python3 qa/golden_counts.py --layer mvum --files mvum_roads.geojsonl mvum_trails.geojsonl

      - name: Restore previous source_id list (artifact of last successful run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest successful run of this workflow that is not the current run;
          # artifacts persist 35 days (vs cache's 7-day eviction == the weekly
          # cron boundary). Missing artifact / no previous run => baseline, exit 0.
          PREV_RUN=""
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow weekly-motorized.yml \
              --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then PREV_RUN="$id"; break; fi
          done
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" -R "$GITHUB_REPOSITORY" -n rtecn-ids-mvum -D .idcache || true
          else
            echo "::notice::no previous successful run — baseline run"
          fi

      - name: QA — source_id stability (hard gate, max 5% orphans)
        run: |
          mkdir -p .idcache
          if [ -f .idcache/ids.txt ]; then mv .idcache/ids.txt prev_ids.txt; fi
          python3 qa/rte_cn_stability.py --layer mvum \
            --current mvum_roads.geojsonl mvum_trails.geojsonl \
            --previous prev_ids.txt --ids-out .idcache/ids.txt \
            --max-orphan-pct 5

      - name: Save source_id list for next run
        uses: actions/upload-artifact@v4
        with:
          name: rtecn-ids-mvum
          path: .idcache/ids.txt
          retention-days: 35

      - name: Tile
        run: |
          set -euo pipefail
          export PATH="$HOME/tippecanoe-bin:$PATH"
          tippecanoe -P -o mvum.pmtiles -Z4 -z14 --drop-densest-as-needed \
            --attribution="USDA Forest Service" --name="RuggedRoute MVUM" --force \
            -L mvum_roads:mvum_roads.geojsonl \
            -L mvum_trails:mvum_trails.geojsonl
          ls -lh mvum.pmtiles
          pmtiles show mvum.pmtiles

      - name: Upload to R2 + flip alias (skips until secrets exist)
        env:
          LAYER: mvum
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::R2 secrets not configured — skipping upload (artifact mode)."
            echo "ARTIFACT_MODE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          VERSION="${LAYER}-$(date +%Y%m%d-%H%M).pmtiles"
          pmtiles upload "${LAYER}.pmtiles" "$VERSION" \
            --bucket="s3://rr-tiles?endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com&region=auto"
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            # --remote is REQUIRED: wrangler v4 defaults kv writes to a local simulation
            npx --yes wrangler kv key put --remote --namespace-id "$KV_NAMESPACE_ID" "layer-alias:${LAYER}" "$VERSION"
          fi
          echo "uploaded $VERSION and flipped alias"

      - name: Attach PMTiles as artifact (only in artifact mode)
        if: env.ARTIFACT_MODE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: mvum-pmtiles
          path: mvum.pmtiles
          retention-days: 7

      - name: Attach review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue-mvum
          path: review_queue_*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────── roads_context ──
  roads_context:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.layers == 'all' || inputs.layers == '' || contains(inputs.layers, 'roads_context')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true

      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin

      - name: Cache tippecanoe
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-2.79.0

      - name: Build tippecanoe
        if: steps.tcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin
          cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/

      - name: Install pmtiles CLI
        run: |
          curl -fsSL -o /tmp/pm.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.0/go-pmtiles_1.31.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/pm.tar.gz -C /tmp pmtiles
          sudo mv /tmp/pmtiles /usr/local/bin/

      - name: Fetch RoadCore GDB (239 MB)
        run: |
          curl -A "$UA" -fSL --retry 3 -o roadcore.gdb.zip https://data.fs.usda.gov/geodata/edw/edw_resources/fc/Trans_RoadCore_FS.gdb.zip
          # zipfile (not unzip): USFS zips can carry a null-byte prefix — see mvum job note
          python3 -m zipfile -e roadcore.gdb.zip roadcore_gdb
          rm -f roadcore.gdb.zip

      - name: Normalize
        run: |
          set -euo pipefail
          locate_gdb() {
            local root="$1" hit
            hit=$(find "$root" -type d -iname '*.gdb' -print 2>/dev/null | head -1) || true
            if [ -z "$hit" ] && compgen -G "$root/a0000000*.gdbtable" > /dev/null; then
              mv "$root" "${root}.gdb" && hit="${root}.gdb"
            fi
            if [ -z "$hit" ]; then
              echo "::error::no FileGDB under $root — listing follows" >&2
              find "$root" -maxdepth 3 2>/dev/null | head -40 >&2
              return 1
            fi
            printf '%s\n' "$hit"
          }
          detect_layer() {
            local layer
            layer=$(ogrinfo -ro "$1" 2>/dev/null | sed -n 's/^[0-9][0-9]*: \([^ ]*\).*/\1/p' | head -1) || true
            printf '%s\n' "${layer:-$2}"
          }
          GDB=$(locate_gdb roadcore_gdb)
          LAYER_NAME=$(detect_layer "$GDB" Trans_RoadCore_FS)
          echo "roadcore: $GDB :: $LAYER_NAME"
          ogr2ogr -f GeoJSONSeq /vsistdout/ "$GDB" "$LAYER_NAME" -t_srs EPSG:4326 -dim XY \
            | python3 lib/normalize_roadcore.py --review-out review_queue_roadcore.jsonl \
            > roads_context.geojsonl
          wc -l roads_context.geojsonl review_queue_*.jsonl || true
          rm -rf roadcore_gdb

      - name: QA — golden bbox counts vs live EDW
        run: python3 qa/golden_counts.py --layer roadcore --files roads_context.geojsonl

      - name: Restore previous source_id list (artifact of last successful run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest successful run of this workflow that is not the current run;
          # artifacts persist 35 days (vs cache's 7-day eviction == the weekly
          # cron boundary). Missing artifact / no previous run => baseline, exit 0.
          PREV_RUN=""
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow weekly-motorized.yml \
              --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then PREV_RUN="$id"; break; fi
          done
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" -R "$GITHUB_REPOSITORY" -n rtecn-ids-roads_context -D .idcache || true
          else
            echo "::notice::no previous successful run — baseline run"
          fi

      - name: QA — source_id stability (hard gate, max 5% orphans)
        run: |
          mkdir -p .idcache
          if [ -f .idcache/ids.txt ]; then mv .idcache/ids.txt prev_ids.txt; fi
          python3 qa/rte_cn_stability.py --layer roads_context \
            --current roads_context.geojsonl \
            --previous prev_ids.txt --ids-out .idcache/ids.txt \
            --max-orphan-pct 5

      - name: Save source_id list for next run
        uses: actions/upload-artifact@v4
        with:
          name: rtecn-ids-roads_context
          path: .idcache/ids.txt
          retention-days: 35

      - name: Tile
        run: |
          set -euo pipefail
          export PATH="$HOME/tippecanoe-bin:$PATH"
          # -Z6: the full road inventory is too dense to serve from z4
          tippecanoe -P -o roads_context.pmtiles -Z6 -z14 --drop-densest-as-needed \
            --attribution="USDA Forest Service" --name="RuggedRoute Roads Context" --force \
            -L roads_context:roads_context.geojsonl
          ls -lh roads_context.pmtiles
          pmtiles show roads_context.pmtiles

      - name: Upload to R2 + flip alias (skips until secrets exist)
        env:
          LAYER: roads_context
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::R2 secrets not configured — skipping upload (artifact mode)."
            echo "ARTIFACT_MODE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          VERSION="${LAYER}-$(date +%Y%m%d-%H%M).pmtiles"
          pmtiles upload "${LAYER}.pmtiles" "$VERSION" \
            --bucket="s3://rr-tiles?endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com&region=auto"
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --yes wrangler kv key put --remote --namespace-id "$KV_NAMESPACE_ID" "layer-alias:${LAYER}" "$VERSION"
          fi
          echo "uploaded $VERSION and flipped alias"

      - name: Attach PMTiles as artifact (only in artifact mode)
        if: env.ARTIFACT_MODE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: roads_context-pmtiles
          path: roads_context.pmtiles
          retention-days: 7

      - name: Attach review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue-roads_context
          path: review_queue_*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────── nfs_trails ──
  nfs_trails:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.layers == 'all' || inputs.layers == '' || contains(inputs.layers, 'nfs_trails')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true

      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin

      - name: Cache tippecanoe
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-2.79.0

      - name: Build tippecanoe
        if: steps.tcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin
          cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/

      - name: Install pmtiles CLI
        run: |
          curl -fsSL -o /tmp/pm.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.0/go-pmtiles_1.31.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/pm.tar.gz -C /tmp pmtiles
          sudo mv /tmp/pmtiles /usr/local/bin/

      - name: Fetch NFS Trails GDB (esridump fallback if the bulk zip is corrupt)
        run: |
          # Upstream zip was corrupt at rest 2026-08-03: first 618 bytes zeroed IN PLACE,
          # destroying the local headers of a00000001.* (the GDB system catalog) — the GDB
          # cannot open even after tolerant extraction. zipfile -e fails loudly on it, which
          # is what routes us to the fallback; unzip would fail the same way, python zipfile
          # additionally tolerates the harmless prefixed-archive variant.
          MODE=gdb
          if curl -A "$UA" -fSL --retry 3 -o trailpub.gdb.zip https://data.fs.usda.gov/geodata/edw/edw_resources/fc/Trans_Trail_NFS_Publish.gdb.zip \
             && python3 -m zipfile -e trailpub.gdb.zip trailpub_gdb; then
            rm -f trailpub.gdb.zip
          else
            echo "::warning::NFS Trails bulk GDB fetch/extract failed — falling back to esridump of EDW_TrailNFSPublish_01 (live service, ~86k features)"
            rm -rf trailpub_gdb trailpub.gdb.zip
            MODE=esridump
          fi
          echo "NFS_FETCH_MODE=$MODE" >> "$GITHUB_ENV"

      - name: Normalize
        run: |
          set -euo pipefail
          if [ "$NFS_FETCH_MODE" = "gdb" ]; then
            locate_gdb() {
              local root="$1" hit
              hit=$(find "$root" -type d -iname '*.gdb' -print 2>/dev/null | head -1) || true
              if [ -z "$hit" ] && compgen -G "$root/a0000000*.gdbtable" > /dev/null; then
                mv "$root" "${root}.gdb" && hit="${root}.gdb"
              fi
              if [ -z "$hit" ]; then
                echo "::error::no FileGDB under $root — listing follows" >&2
                find "$root" -maxdepth 3 2>/dev/null | head -40 >&2
                return 1
              fi
              printf '%s\n' "$hit"
            }
            detect_layer() {
              local layer
              layer=$(ogrinfo -ro "$1" 2>/dev/null | sed -n 's/^[0-9][0-9]*: \([^ ]*\).*/\1/p' | head -1) || true
              printf '%s\n' "${layer:-$2}"
            }
            GDB=$(locate_gdb trailpub_gdb)
            LAYER_NAME=$(detect_layer "$GDB" Trans_Trail_NFS_Publish)
            echo "nfs_trails: $GDB :: $LAYER_NAME"
            ogr2ogr -f GeoJSONSeq /vsistdout/ "$GDB" "$LAYER_NAME" -t_srs EPSG:4326 -dim XY \
              | python3 lib/normalize_nfs_trails.py --review-out review_queue_nfs_trails.jsonl \
              > nfs_trails.geojsonl
          else
            python3 -m pip install --user --quiet esridump
            export PATH="$HOME/.local/bin:$PATH"
            esri2geojson --jsonlines \
              https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_TrailNFSPublish_01/MapServer/0 \
              nfs_raw.geojsonl
            python3 lib/normalize_nfs_trails.py --review-out review_queue_nfs_trails.jsonl \
              < nfs_raw.geojsonl > nfs_trails.geojsonl
            rm -f nfs_raw.geojsonl
          fi
          wc -l nfs_trails.geojsonl review_queue_*.jsonl || true
          rm -rf trailpub_gdb

      - name: QA — golden bbox counts vs live EDW
        run: python3 qa/golden_counts.py --layer nfs_trails --files nfs_trails.geojsonl

      - name: Restore previous source_id list (artifact of last successful run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest successful run of this workflow that is not the current run;
          # artifacts persist 35 days (vs cache's 7-day eviction == the weekly
          # cron boundary). Missing artifact / no previous run => baseline, exit 0.
          PREV_RUN=""
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow weekly-motorized.yml \
              --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then PREV_RUN="$id"; break; fi
          done
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" -R "$GITHUB_REPOSITORY" -n rtecn-ids-nfs_trails -D .idcache || true
          else
            echo "::notice::no previous successful run — baseline run"
          fi

      - name: QA — source_id stability (hard gate, max 5% orphans)
        run: |
          mkdir -p .idcache
          if [ -f .idcache/ids.txt ]; then mv .idcache/ids.txt prev_ids.txt; fi
          python3 qa/rte_cn_stability.py --layer nfs_trails \
            --current nfs_trails.geojsonl \
            --previous prev_ids.txt --ids-out .idcache/ids.txt \
            --max-orphan-pct 5

      - name: Save source_id list for next run
        uses: actions/upload-artifact@v4
        with:
          name: rtecn-ids-nfs_trails
          path: .idcache/ids.txt
          retention-days: 35

      - name: Tile
        run: |
          set -euo pipefail
          export PATH="$HOME/tippecanoe-bin:$PATH"
          tippecanoe -P -o nfs_trails.pmtiles -Z4 -z14 --drop-densest-as-needed \
            --attribution="USDA Forest Service" --name="RuggedRoute NFS Trails" --force \
            -L nfs_trails:nfs_trails.geojsonl
          ls -lh nfs_trails.pmtiles
          pmtiles show nfs_trails.pmtiles

      - name: Upload to R2 + flip alias (skips until secrets exist)
        env:
          LAYER: nfs_trails
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
