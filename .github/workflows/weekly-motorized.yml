          name: nfs_trails-pmtiles
          path: nfs_trails.pmtiles
          retention-days: 7

      - name: Attach review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue-nfs_trails
          path: review_queue_*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────── blm_routes ──
  blm_routes:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.layers == 'all' || inputs.layers == '' || contains(inputs.layers, 'blm_routes')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install esridump
        run: pip install --quiet esridump

      - name: Cache tippecanoe
        id: tcache
        uses: actions/cache@v4
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-2.79.0

      - name: Build tippecanoe
        if: steps.tcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin
          cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/

      - name: Install pmtiles CLI
        run: |
          curl -fsSL -o /tmp/pm.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.0/go-pmtiles_1.31.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/pm.tar.gz -C /tmp pmtiles
          sudo mv /tmp/pmtiles /usr/local/bin/

      - name: Dump GTLF Public Display layers 0-3
        run: |
          set -euo pipefail
          BASE="https://gis.blm.gov/arcgis/rest/services/transportation/BLM_Natl_GTLF_Public_Display/MapServer"
          for i in 0 1 2 3; do
            esri2geojson --jsonlines "$BASE/$i" "blm_raw_$i.geojsonl"
            wc -l "blm_raw_$i.geojsonl"
          done

      - name: Normalize (per-layer designation hints)
        run: |
          set -euo pipefail
          # layer 0: roads open · 1: roads limited · 2: trails open · 3: trails limited
          python3 lib/normalize_gtlf.py --kind road  --designation-hint open \
            --review-out review_queue_gtlf_0.jsonl < blm_raw_0.geojsonl > blm_norm_0.geojsonl
          python3 lib/normalize_gtlf.py --kind road  --designation-hint limited \
            --review-out review_queue_gtlf_1.jsonl < blm_raw_1.geojsonl > blm_norm_1.geojsonl
          python3 lib/normalize_gtlf.py --kind trail --designation-hint open \
            --review-out review_queue_gtlf_2.jsonl < blm_raw_2.geojsonl > blm_norm_2.geojsonl
          python3 lib/normalize_gtlf.py --kind trail --designation-hint limited \
            --review-out review_queue_gtlf_3.jsonl < blm_raw_3.geojsonl > blm_norm_3.geojsonl
          cat blm_norm_0.geojsonl blm_norm_1.geojsonl blm_norm_2.geojsonl blm_norm_3.geojsonl \
            > blm_routes.geojsonl
          wc -l blm_routes.geojsonl review_queue_*.jsonl || true
          rm -f blm_raw_*.geojsonl blm_norm_*.geojsonl

      - name: QA — golden bbox counts vs live service
        run: python3 qa/golden_counts.py --layer blm_routes --files blm_routes.geojsonl

      - name: Restore previous source_id list (artifact of last successful run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest successful run of this workflow that is not the current run;
          # artifacts persist 35 days (vs cache's 7-day eviction == the weekly
          # cron boundary). Missing artifact / no previous run => baseline, exit 0.
          PREV_RUN=""
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow weekly-motorized.yml \
              --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then PREV_RUN="$id"; break; fi
          done
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" -R "$GITHUB_REPOSITORY" -n rtecn-ids-blm_routes -D .idcache || true
          else
            echo "::notice::no previous successful run — baseline run"
          fi

      - name: QA — source_id stability (soft gate)
        run: |
          mkdir -p .idcache
          if [ -f .idcache/ids.txt ]; then mv .idcache/ids.txt prev_ids.txt; fi
          # Deliberately SOFT (no --max-orphan-pct): GTLF source_ids fall back to
          # per-layer OBJECTIDs, which churn across BLM republishes — a hard
          # orphan gate would flap. Churn surfaces as a ::warning:: only.
          python3 qa/rte_cn_stability.py --layer blm_routes \
            --current blm_routes.geojsonl \
            --previous prev_ids.txt --ids-out .idcache/ids.txt

      - name: Save source_id list for next run
        uses: actions/upload-artifact@v4
        with:
          name: rtecn-ids-blm_routes
          path: .idcache/ids.txt
          retention-days: 35

      - name: Tile
        run: |
          set -euo pipefail
          export PATH="$HOME/tippecanoe-bin:$PATH"
          tippecanoe -P -o blm_routes.pmtiles -Z4 -z14 --drop-densest-as-needed \
            --attribution="Bureau of Land Management" --name="RuggedRoute BLM Routes" --force \
            -L blm_routes:blm_routes.geojsonl
          ls -lh blm_routes.pmtiles
          pmtiles show blm_routes.pmtiles

      - name: Upload to R2 + flip alias (skips until secrets exist)
        env:
          LAYER: blm_routes
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::R2 secrets not configured — skipping upload (artifact mode)."
            echo "ARTIFACT_MODE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          VERSION="${LAYER}-$(date +%Y%m%d-%H%M).pmtiles"
          pmtiles upload "${LAYER}.pmtiles" "$VERSION" \
            --bucket="s3://rr-tiles?endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com&region=auto"
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --yes wrangler kv key put --remote --namespace-id "$KV_NAMESPACE_ID" "layer-alias:${LAYER}" "$VERSION"
          fi
          echo "uploaded $VERSION and flipped alias"

      - name: Attach PMTiles as artifact (only in artifact mode)
        if: env.ARTIFACT_MODE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: blm_routes-pmtiles
          path: blm_routes.pmtiles
          retention-days: 7

      - name: Attach review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-queue-blm_routes
          path: review_queue_*.jsonl
          retention-days: 30
          if-no-files-found: ignore

