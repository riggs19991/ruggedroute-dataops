name: millwright-kb
# Type-checks and builds the Millwright Knowledge Base app on every change.
# Deploys to a Cloudflare Worker (static assets) when CLOUDFLARE_API_TOKEN exists;
# skips the deploy gracefully otherwise (same pattern as deploy-worker.yml).

on:
  push:
    branches: [main, claude/millwright-knowledge-database-pg5n1c]
    paths: ["millwright-kb/**", ".github/workflows/millwright-kb.yml"]
  pull_request:
    paths: ["millwright-kb/**", ".github/workflows/millwright-kb.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: millwright-kb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: millwright-kb/package-lock.json
      - run: npm ci
      - name: Validate seed content
        run: node scripts/build-seed.mjs
      - name: Type-check and build
        run: npm run build
        env:
          VITE_DONATE_URL: ${{ vars.DONATE_URL }}
      - name: Lint
        run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: millwright-kb-dist
          path: millwright-kb/dist
          retention-days: 7
      - name: Deploy to Cloudflare Workers (static assets)
        # Pushes and manual runs deploy when the token exists; pull requests only build.
        # Uses the same token as deploy-worker.yml (Workers Scripts: Edit is enough).
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured — skipping deploy (dist is attached as an artifact)."
            exit 0
          fi
          set -o pipefail
          npx wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice title=Millwright KB deployed::$url"
          echo "### Millwright KB is live at $url" >> "$GITHUB_STEP_SUMMARY"
