name: millwright-kb
# Type-checks and builds the Millwright Knowledge Base app on every change.
# Deploys to Cloudflare Pages on main when CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID exist;
# skips the deploy gracefully otherwise (same pattern as deploy-worker.yml).

on:
  push:
    branches: [main, claude/millwright-knowledge-database-pg5n1c]
    paths: ["millwright-kb/**", ".github/workflows/millwright-kb.yml"]
  pull_request:
    paths: ["millwright-kb/**", ".github/workflows/millwright-kb.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: millwright-kb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: millwright-kb/package-lock.json
      - run: npm ci
      - name: Validate seed content
        run: node scripts/build-seed.mjs
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: millwright-kb-dist
          path: millwright-kb/dist
          retention-days: 7
      - name: Deploy to Cloudflare Pages
        # pushes and manual runs deploy (when the secrets exist); pull requests only build.
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The R2 account id is the same Cloudflare account id; used when no dedicated secret exists.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured — skipping Pages deploy (dist is attached as an artifact)."
            exit 0
          fi
          npx wrangler@4 pages project create millwright-kb --production-branch main 2>&1 | grep -v "already exists" || true
          npx wrangler@4 pages deploy dist --project-name millwright-kb --branch main --commit-dirty=true
