# rr-tiles worker. Custom domain REQUIRED before the app ships against it
# (workers.dev never edge-caches — every request would be an R2 class-B miss).
name = "rr-tiles"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true
account_id = "c13779e49b48ca2af9a730d4b6b5a4ef"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "rr-tiles"

[[kv_namespaces]]
binding = "ALIASES"
id = "f2f28315ee8f43fb8413d1bcddd20684"

# Custom domain tiles.ruggedroutehq.com is attached via the dashboard (2026-08-03) and
# survives wrangler deploys. Do NOT add a [[routes]] block here — the CI token has no
# zone permissions, so a route in this file would fail every deploy.
