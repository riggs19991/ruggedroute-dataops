name: hq_app
description: "RuggedRoute HQ — private back-office app for Addictive Media Productions LLC."
publish_to: 'none'
version: 0.2.1+26090704

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  http: ^1.6.0
  intl: ^0.20.3
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-SemiBoldItalic.ttf
          weight: 600
          style: italic

flutter_launcher_icons:
  android: true
  image_path: assets/brand/icon_1024.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_foreground.png
  windows:
    generate: true
    image_path: assets/brand/icon_1024.png
    icon_size: 256
