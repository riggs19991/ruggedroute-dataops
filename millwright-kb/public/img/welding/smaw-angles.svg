<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Stick welding angles</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="310" fill="#ffffff"/>
<text x="130" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Side view: travel angle</text>
<rect x="20" y="210" width="220" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="60" y1="236" x2="110" y2="236" stroke="#0b5fa5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="85" y="252" font-size="10.5" text-anchor="middle" fill="#0b5fa5">travel</text>
<g transform="translate(150,206) rotate(15)"><rect x="-4.5" y="-150" width="9" height="130" fill="#c8c0b0" stroke="#8a8070" stroke-width="1.5"/>
<rect x="-2" y="-150" width="4" height="22" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="-2" y="-22" width="4" height="22" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="-8" y="-170" width="16" height="22" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" rx="3"/></g>
<line x1="150" y1="206" x2="150" y2="100" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M150,136 A70,70 0 0 1 168.11733315717646,138.3851921597652" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="160.70314776204424" y="128.70152136734754" font-size="12" text-anchor="middle" fill="#0b5fa5"></text>
<text x="174" y="130" font-size="11" text-anchor="start" fill="#0b5fa5">10-15° drag</text>
<path d="M147,206 q3,-5 6,0" fill="none" stroke="#fff3b0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M110,210 Q130,196 150,206" fill="none" stroke="#f8b878" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="22" y="188" font-size="10" text-anchor="start" fill="#0b5fa5">arc length ≈ rod dia.</text>
<line x1="110" y1="192" x2="146" y2="205" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round"/>
<text x="370" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">End view: work angle (fillet)</text>
<rect x="280" y="210" width="200" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="370" y="100" width="16" height="110" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(388,202) rotate(45)"><rect x="-4.5" y="-140" width="9" height="118" fill="#c8c0b0" stroke="#8a8070" stroke-width="1.5"/>
<rect x="-2" y="-22" width="4" height="22" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="-8" y="-160" width="16" height="22" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" rx="3"/></g>
<line x1="386" y1="210" x2="386" y2="120" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="386" y1="210" x2="470" y2="210" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M386,160 A50,50 0 0 1 421.3553390593274,174.64466094067262" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="409.7263728066356" y="156.71946898430022" font-size="12" text-anchor="middle" fill="#0b5fa5">45°</text>
<path d="M386,210 L404,210 L386,192 Z" fill="#f8b878" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250" y="302" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Tight arc, drag the rod, split the fillet angle. Long arc = spatter.</text>
</svg>