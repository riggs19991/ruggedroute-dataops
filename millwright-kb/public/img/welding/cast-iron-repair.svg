<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 262" width="500" height="262" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Cast iron crack repair</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="262" fill="#ffffff"/>
<text x="125" y="20" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">1. Stop the crack, V it out</text>
<rect x="30" y="40" width="190" height="120" fill="#9aa5b4" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<path d="M60,110 L82,96 L100,104 L124,84 L146,90 L168,70 L190,62" fill="none" stroke="#1a2233" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="60" cy="110" r="6" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="190" cy="62" r="6" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<path d="M66,112 L84,98 L102,106 L126,86 L146,92 L166,74 L184,66" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
<path d="M66,112 L84,98 L102,106 L126,86 L146,92 L166,74 L184,66" fill="none" stroke="#64748b" stroke-width="6" stroke-dasharray="2 3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="60" y="132" font-size="8.8" text-anchor="middle" fill="#1a2233">drill 1/8-3/16 in</text>
<text x="190" y="48" font-size="8.8" text-anchor="middle" fill="#1a2233">drill</text>
<text x="125" y="148" font-size="9" text-anchor="middle" fill="#5b6577">grind a 60-90° V to the root</text>
<text x="375" y="20" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">2. Short stringers, skip, peen</text>
<rect x="280" y="40" width="190" height="120" fill="#9aa5b4" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<path d="M310,110 L334,96 L352,104 L376,84 L398,90 L420,70 L440,62" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
<line x1="310" y1="110" x2="334" y2="96" stroke="#f8b878" stroke-width="9" stroke-linecap="round"/>
<line x1="310" y1="110" x2="334" y2="96" stroke="#b45309" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
<circle cx="322" cy="87" r="7" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="322" y="91" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<line x1="420" y1="70" x2="440" y2="62" stroke="#f8b878" stroke-width="9" stroke-linecap="round"/>
<line x1="420" y1="70" x2="440" y2="62" stroke="#b45309" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
<circle cx="430" cy="50" r="7" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="430" y="54" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<line x1="334" y1="96" x2="352" y2="104" stroke="#f8b878" stroke-width="9" stroke-linecap="round"/>
<line x1="334" y1="96" x2="352" y2="104" stroke="#b45309" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
<circle cx="343" cy="84" r="7" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="343" y="88" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<line x1="398" y1="90" x2="420" y2="70" stroke="#f8b878" stroke-width="9" stroke-linecap="round"/>
<line x1="398" y1="90" x2="420" y2="70" stroke="#b45309" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
<circle cx="409" cy="64" r="7" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="409" y="68" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<line x1="352" y1="104" x2="376" y2="84" stroke="#f8b878" stroke-width="9" stroke-linecap="round"/>
<line x1="352" y1="104" x2="376" y2="84" stroke="#b45309" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
<circle cx="364" cy="78" r="7" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="364" y="82" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<line x1="376" y1="84" x2="398" y2="90" stroke="#f8b878" stroke-width="9" stroke-linecap="round"/>
<line x1="376" y1="84" x2="398" y2="90" stroke="#b45309" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
<circle cx="387" cy="71" r="7" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="387" y="75" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text>
<rect x="440" y="100" width="10" height="34" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="2"/>
<rect x="432" y="92" width="26" height="12" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" rx="2"/>
<text x="445" y="146" font-size="8.8" text-anchor="middle" fill="#1a2233"><tspan x="445" dy="0">peen each bead</tspan><tspan x="445" dy="11">while it is hot</tspan></text>
<text x="250" y="192" font-size="9.5" text-anchor="middle" fill="#5b6577">weld 1 in (25 mm) stringers, jumping end to end so no spot gets hot; peen each one at once</text>
<text x="250" y="210" font-size="9.5" text-anchor="middle" fill="#5b6577">Ni-rod (ENi-CI / ENiFe-CI) with low amps; let each bead cool to hand-warm before the next</text>
<text x="250" y="228" font-size="9.5" text-anchor="middle" fill="#5b6577">hot method: preheat 500-1,200°F and cool slowly · cold method: keep the casting under 150°F</text>
<text x="250" y="254" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Cast iron cracks from heat stress: short beads, peen, cool slowly.</text>
</svg>