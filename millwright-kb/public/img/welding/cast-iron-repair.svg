<circle cx="230" cy="150" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="230" y="154" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="340" cy="130" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="340" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="49" cy="201" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="49" y="205" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="64" y="205" font-size="10.5" text-anchor="start" fill="#1a2233">drill 1/8-3/16 in holes at each crack end (stops it running)</text>
<circle cx="49" cy="216" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="49" y="220" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="64" y="220" font-size="10.5" text-anchor="start" fill="#1a2233">grind or gouge a V, weld 1 in stringers in the numbered order, peen each</text>
<circle cx="49" cy="231" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="49" y="235" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="64" y="235" font-size="10.5" text-anchor="start" fill="#1a2233">hot method: preheat 500-1,200°F; cold method: keep it under 150°F</text>
