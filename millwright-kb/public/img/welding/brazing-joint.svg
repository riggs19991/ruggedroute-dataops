<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Brazing joint</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<text x="250" y="22" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">Capillary joint: heat pulls the filler in; the torch does not push it</text>
<rect x="60" y="90" width="220" height="50" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="60" y="104" width="220" height="22" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="200" y="82" width="200" height="66" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="200" y="90" width="200" height="50" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="200" y="104" width="80" height="22" fill="#b87333" stroke="none" stroke-width="1.5"/>
<rect x="200" y="90" width="80" height="14" fill="#c0c0c0" stroke="#1a2233" stroke-width="1.5"/>
<rect x="200" y="126" width="80" height="14" fill="#c0c0c0" stroke="#1a2233" stroke-width="1.5"/>
<line x1="200" y1="160" x2="280" y2="160" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="240" y="156" font-size="11" text-anchor="middle" fill="#1a2233">overlap 3-4 × wall</text>
<line x1="200" y1="84" x2="200" y2="56" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
<text x="200" y="50" font-size="10.5" text-anchor="middle" fill="#5b6577">gap 0.002-0.005 in per side (silver); 0.003-0.01 bronze</text>
<path d="M330,40 L300,80" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="340" y="40" font-size="10.5" text-anchor="start" fill="#5b6577"><tspan x="340" dy="0">flame on the heavy</tspan><tspan x="340" dy="13.125">section, moving; feed</tspan><tspan x="340" dy="13.125">rod at the joint edge</tspan><tspan x="340" dy="13.125">when the flux runs clear</tspan></text>
<rect x="150" y="92" width="40" height="10" fill="#c0c0c0" stroke="none" stroke-width="1.5"/>
<text x="150" y="76" font-size="10.5" text-anchor="middle" fill="#5b6577">filler flows toward the heat</text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Clean, flux, fit, heat evenly, feed, let it cool, wash off the flux.</text>
</svg>