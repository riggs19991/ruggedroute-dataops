<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Brazing joint</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="250" y="22" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">Section through a socket joint: heat pulls the filler into the gap</text>
<rect x="180" y="90" width="190" height="16" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="180" y="162" width="190" height="16" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="350" y="106" width="20" height="56" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="30" y="110" width="230" height="12" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="30" y="146" width="230" height="12" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="180" y="106" width="80" height="4" fill="#d9d9d9" stroke="#9a9a9a" stroke-width="0.5"/>
<rect x="180" y="158" width="80" height="4" fill="#d9d9d9" stroke="#9a9a9a" stroke-width="0.5"/>
<rect x="260" y="108" width="12" height="4" fill="#d9d9d9" stroke="none" stroke-width="1.5"/>
<rect x="260" y="156" width="12" height="4" fill="#d9d9d9" stroke="none" stroke-width="1.5"/>
<line x1="180" y1="194" x2="260" y2="194" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="220" y="190" font-size="11" text-anchor="middle" fill="#1a2233">overlap 3-4 × wall</text>
<line x1="27" y1="58" x2="220" y2="108" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="30" y="62" font-size="9.8" text-anchor="start" fill="#1a2233"><tspan x="30" dy="0">capillary gap 0.002-0.005 in per side (silver),</tspan><tspan x="30" dy="12.25">0.003-0.010 in (bronze)</tspan></text>
<path d="M430,58 L372,90" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="372" y="108" font-size="9.5" text-anchor="start" fill="#5b6577"><tspan x="372" dy="0">flame on the heavy side,</tspan><tspan x="372" dy="11.875">keep it moving; rod at</tspan><tspan x="372" dy="11.875">the joint edge once</tspan><tspan x="372" dy="11.875">the flux runs clear</tspan></text>
<rect x="150" y="114" width="18" height="4" fill="#c0c0c0" stroke="none" stroke-width="1.5"/>
<line x1="168" y1="116" x2="186" y2="116" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="60" y="136" font-size="10" text-anchor="start" fill="#5b6577">filler flows toward the heat</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Clean, flux, fit, heat evenly, feed, let it cool, wash off the flux.</text>
</svg>