<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 285" width="500" height="285" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>AC balance</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="285" fill="#ffffff"/>
<text x="250" y="22" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a2233">AC square wave: electrode negative (EN) vs electrode positive (EP)</text>
<line x1="40" y1="90" x2="460" y2="90" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
<rect x="40" y="90" width="98" height="40" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5"/>
<rect x="138" y="50" width="42" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="180" y="90" width="98" height="40" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5"/>
<rect x="278" y="50" width="42" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="320" y="90" width="98" height="40" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5"/>
<rect x="418" y="50" width="42" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="46" y="42" font-size="11" text-anchor="start" font-weight="600" fill="#1a2233">70% EN</text>
<line x1="40" y1="200" x2="460" y2="200" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
<rect x="40" y="200" width="70" height="40" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5"/>
<rect x="110" y="160" width="70" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="180" y="200" width="70" height="40" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5"/>
<rect x="250" y="160" width="70" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<rect x="320" y="200" width="70" height="40" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5"/>
<rect x="390" y="160" width="70" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="46" y="152" font-size="11" text-anchor="start" font-weight="600" fill="#1a2233">50% EN</text>
<text x="30" y="70" font-size="10" text-anchor="end" fill="#b91c1c">EP</text>
<text x="30" y="120" font-size="10" text-anchor="end" fill="#0b5fa5">EN</text>
<text x="250" y="148" font-size="10.5" text-anchor="middle" fill="#5b6577">more EN = more penetration, cooler tungsten, narrower cleaning band (start here, 65-75%)</text>
<text x="250" y="256" font-size="10.5" text-anchor="middle" fill="#5b6577">more EP = wider cleaning, hotter tungsten, wider bead (dirty or cast aluminium)</text>
<text x="250" y="277" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Frequency 100-150 Hz tightens the arc; 60-80 Hz widens it.</text>
</svg>