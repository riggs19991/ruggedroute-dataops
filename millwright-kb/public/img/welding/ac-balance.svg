<rect x="135" y="80" width="66.5" height="30" fill="#dbeafe" stroke="none" stroke-width="1.5"/>
<rect x="201.5" y="50" width="28.5" height="30" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<path d="M135,80 L135,110 L201.5,110 L201.5,50 L230,50 L230,80" fill="none" stroke="#1a2233" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="40" y1="80" x2="230" y2="80" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
<text x="135" y="130" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">70% EN</text>
<text x="73.25" y="102" font-size="9.5" text-anchor="middle" font-weight="700" fill="#0b5fa5">EN</text>
<text x="120.75" y="66" font-size="9.5" text-anchor="middle" font-weight="700" fill="#b91c1c">EP</text>
<rect x="270" y="80" width="47.5" height="30" fill="#dbeafe" stroke="none" stroke-width="1.5"/>
<rect x="317.5" y="50" width="47.5" height="30" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<path d="M270,80 L270,110 L317.5,110 L317.5,50 L365,50 L365,80" fill="none" stroke="#1a2233" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="365" y="80" width="47.5" height="30" fill="#dbeafe" stroke="none" stroke-width="1.5"/>
<rect x="412.5" y="50" width="47.5" height="30" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<path d="M365,80 L365,110 L412.5,110 L412.5,50 L460,50 L460,80" fill="none" stroke="#1a2233" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="270" y1="80" x2="460" y2="80" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
<text x="365" y="130" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">50% EN</text>
<text x="293.75" y="102" font-size="9.5" text-anchor="middle" font-weight="700" fill="#0b5fa5">EN</text>
<text x="341.25" y="66" font-size="9.5" text-anchor="middle" font-weight="700" fill="#b91c1c">EP</text>
<rect x="75" y="170" width="120" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M113,170 Q135,188 157,170" fill="#f8b878" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M113,170 Q135,158 157,170" fill="#f8b878" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="105" y="168" width="8" height="2" fill="#e9e9e9" stroke="none" stroke-width="1.5"/>
<rect x="157" y="168" width="8" height="2" fill="#e9e9e9" stroke="none" stroke-width="1.5"/>
<line x1="105" y1="204" x2="165" y2="204" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="135" y="218" font-size="9" text-anchor="middle" fill="#5b6577">deeper, narrow cleaning band</text>
<rect x="305" y="170" width="120" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M343,170 Q365,180 387,170" fill="#f8b878" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M343,170 Q365,158 387,170" fill="#f8b878" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="323" y="168" width="20" height="2" fill="#e9e9e9" stroke="none" stroke-width="1.5"/>
<rect x="387" y="168" width="20" height="2" fill="#e9e9e9" stroke="none" stroke-width="1.5"/>
<line x1="323" y1="204" x2="407" y2="204" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="365" y="218" font-size="9" text-anchor="middle" fill="#5b6577">shallower, wide cleaning band</text>
<text x="250" y="240" font-size="9.5" text-anchor="middle" fill="#5b6577">more EN = more penetration, cooler tungsten, narrower etched band (start at 65-75% EN)</text>
<text x="250" y="256" font-size="9.5" text-anchor="middle" fill="#5b6577">more EP = wider cleaning, hotter tungsten, wider bead (dirty or cast aluminium)</text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Frequency 100-150 Hz tightens the arc; 60-80 Hz widens it.</text>
</svg>