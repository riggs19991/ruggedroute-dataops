<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" width="500" height="440" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Welding process selector</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="440" fill="#ffffff"/>
<path d="M250,10 L310,35 L250,60 L190,35 Z" fill="#fff4d6" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250" y="38.85" font-size="11" text-anchor="middle" fill="#1a2233">Material?</text>
<rect x="20" y="90" width="110" height="44" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="75" y="116.025" font-size="11.5" text-anchor="middle" fill="#1a2233">Aluminium</text>
<rect x="140" y="90" width="110" height="44" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="195" y="108.8375" font-size="11.5" text-anchor="middle" fill="#1a2233"><tspan x="195" dy="0">Stainless, thin,</tspan><tspan x="195" dy="14.375">precision</tspan></text>
<rect x="260" y="90" width="110" height="44" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="315" y="108.8375" font-size="11.5" text-anchor="middle" fill="#1a2233"><tspan x="315" dy="0">Steel outdoors,</tspan><tspan x="315" dy="14.375">rusty, windy</tspan></text>
<rect x="380" y="90" width="110" height="44" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="435" y="116.025" font-size="11.5" text-anchor="middle" fill="#1a2233">Steel, shop</text>
<line x1="250" y1="60" x2="75" y2="90" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="250" y1="60" x2="195" y2="90" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="250" y1="60" x2="315" y2="90" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="250" y1="60" x2="435" y2="90" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="20" y="165" width="110" height="56" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="75" y="182.65" font-size="11.5" text-anchor="middle" fill="#1a2233"><tspan x="75" dy="0">TIG (AC) thin;</tspan><tspan x="75" dy="14.375">MIG spool gun</tspan><tspan x="75" dy="14.375">over 1/8 in</tspan></text>
<rect x="140" y="165" width="110" height="56" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="195" y="189.8375" font-size="11.5" text-anchor="middle" fill="#1a2233"><tspan x="195" dy="0">TIG (DCEN),</tspan><tspan x="195" dy="14.375">back-purge roots</tspan></text>
<rect x="260" y="165" width="110" height="56" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="315" y="189.8375" font-size="11.5" text-anchor="middle" fill="#1a2233"><tspan x="315" dy="0">Stick 6010 / 7018</tspan><tspan x="315" dy="14.375">or E71T-11 / T-8</tspan></text>
<path d="M435,165 L490,193 L435,221 L380,193 Z" fill="#fff4d6" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="435" y="196.85" font-size="11" text-anchor="middle" fill="#1a2233">Thickness?</text>
<line x1="75" y1="134" x2="75" y2="165" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="195" y1="134" x2="195" y2="165" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="315" y1="134" x2="315" y2="165" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="435" y1="134" x2="435" y2="165" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="260" y="260" width="110" height="60" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="315" y="279.65" font-size="11.5" text-anchor="middle" fill="#1a2233"><tspan x="315" dy="0">under 1/4 in:</tspan><tspan x="315" dy="14.375">MIG short-circuit</tspan><tspan x="315" dy="14.375">.030-.035, C25</tspan></text>
<rect x="380" y="260" width="110" height="60" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="435" y="279.65" font-size="11.5" text-anchor="middle" fill="#1a2233"><tspan x="435" dy="0">1/4 in and up:</tspan><tspan x="435" dy="14.375">spray or pulse MIG,</tspan><tspan x="435" dy="14.375">E71T-1 flux-core</tspan></text>
<line x1="410" y1="221" x2="315" y2="260" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="450" y1="221" x2="435" y2="260" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="20" y="260" width="230" height="60" fill="#dcfce7" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="286.8375" font-size="11.5" text-anchor="middle" fill="#1a2233"><tspan x="135" dy="0">Cast iron: nickel stick rods or braze</tspan><tspan x="135" dy="14.375">Hardfacing: stick or open-arc wire</tspan></text>
<rect x="20" y="345" width="470" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="255" y="371.975" font-size="11" text-anchor="middle" fill="#1a2233"><tspan x="255" dy="0">Any process: check code rules (D1.1 needs low-hydrogen), position, fit-up,</tspan><tspan x="255" dy="13.75">preheat for thick or alloy steel, and the duty cycle of the machine you have.</tspan></text>
<text x="250" y="432" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Stick works anywhere; MIG is fastest in the shop; TIG is cleanest.</text>
</svg>