<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Welding symbol anatomy</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<line x1="120" y1="140" x2="380" y2="140" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<line x1="380" y1="140" x2="440" y2="90" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M120,140 L60,110 L60,170 Z" fill="#ffffff" stroke="#1a2233" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240,140 L240,160 L260,160 Z" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="215" y="158" font-size="12" text-anchor="end" fill="#1a2233">1/4</text>
<text x="275" y="158" font-size="12" text-anchor="start" fill="#1a2233">6-12</text>
<path d="M240,140 L240,120 L260,120 Z" fill="none" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="215" y="132" font-size="12" text-anchor="end" fill="#1a2233">5/16</text>
<circle cx="380" cy="140" r="6" fill="none" stroke="#1a2233" stroke-width="1.5"/>
<rect x="374" y="128" width="12" height="6" fill="#1a2233" stroke="none" stroke-width="1.5"/>
<circle cx="440" cy="70" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="440" y="74" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="250" cy="175" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="250" y="179" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="250" cy="105" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="250" y="109" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="60" cy="90" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="60" y="94" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="380" cy="165" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="380" y="169" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<circle cx="300" cy="175" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="179" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text>
<circle cx="200" cy="175" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="200" y="179" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">7</text>
<circle cx="29" cy="196" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="200" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="44" y="200" font-size="10.5" text-anchor="start" fill="#1a2233">arrow points to the joint</text>
<circle cx="29" cy="210" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="214" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="44" y="214" font-size="10.5" text-anchor="start" fill="#1a2233">below the line = arrow side (this fillet 1/4 in)</text>
<circle cx="29" cy="224" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="228" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="44" y="228" font-size="10.5" text-anchor="start" fill="#1a2233">above the line = other side (this fillet 5/16 in)</text>
<circle cx="29" cy="238" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="242" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="44" y="242" font-size="10.5" text-anchor="start" fill="#1a2233">tail: process, spec or note (omit if none)</text>
<circle cx="29" cy="252" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="256" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text><text x="44" y="256" font-size="10.5" text-anchor="start" fill="#1a2233">circle = weld all around; flag = field weld</text>
<circle cx="29" cy="266" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="270" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text><text x="44" y="270" font-size="10.5" text-anchor="start" fill="#1a2233">length-pitch: 6 in welds every 12 in</text>
<circle cx="29" cy="280" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="284" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">7</text><text x="44" y="284" font-size="10.5" text-anchor="start" fill="#1a2233">size to the left of the symbol</text>
<text x="250" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Reference line, arrow, symbols, dimensions</text>
</svg>