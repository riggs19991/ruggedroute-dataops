<text x="90" y="322" font-size="11" text-anchor="start" fill="#1a2233">Mild steel (DCEN)</text>
<path d="M84,247.22222222222223 L108,231.88888888888889 L134.4,219.11111111111111 L160,206.33333333333334 L210.4,185.88888888888889 L260,155.22222222222223 L360,127.11111111111111" fill="none" stroke="#166534" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="70" y="332" width="14" height="4" fill="#166534" stroke="none" stroke-width="1.5"/>
<text x="90" y="338" font-size="11" text-anchor="start" fill="#1a2233">Stainless (DCEN)</text>
<text x="250" y="306" font-size="11" text-anchor="start" fill="#5b6577"><tspan x="250" dy="0">Rule: 1 A per 0.001 in of steel;</tspan><tspan x="250" dy="13.75">aluminium +20-30%; stainless −10-20%</tspan></text>
</svg>