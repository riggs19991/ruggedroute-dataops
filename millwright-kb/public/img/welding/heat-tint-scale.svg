<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Heat tint scale</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="200" fill="#ffffff"/>
<text x="250" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Heat tint on stainless and titanium</text>
<rect x="30" y="50" width="70" height="50" fill="#e8e8e8" stroke="#94a3b8" stroke-width="1.5"/>
<text x="65" y="118" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">silver</text>
<text x="65" y="134" font-size="11" text-anchor="middle" fill="#5b6577">perfect</text>
<rect x="104" y="50" width="70" height="50" fill="#f3e0a0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="139" y="118" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">straw</text>
<text x="139" y="134" font-size="11" text-anchor="middle" fill="#5b6577">good</text>
<rect x="178" y="50" width="70" height="50" fill="#d8a24a" stroke="#94a3b8" stroke-width="1.5"/>
<text x="213" y="118" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">gold</text>
<text x="213" y="134" font-size="11" text-anchor="middle" fill="#5b6577">acceptable</text>
<rect x="252" y="50" width="70" height="50" fill="#8a5a2a" stroke="#94a3b8" stroke-width="1.5"/>
<text x="287" y="118" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">brown</text>
<text x="287" y="134" font-size="11" text-anchor="middle" fill="#5b6577">marginal</text>
<rect x="326" y="50" width="70" height="50" fill="#3b5fa8" stroke="#94a3b8" stroke-width="1.5"/>
<text x="361" y="118" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">blue</text>
<text x="361" y="134" font-size="11" text-anchor="middle" fill="#b91c1c">poor</text>
<rect x="400" y="50" width="70" height="50" fill="#4a4a4a" stroke="#94a3b8" stroke-width="1.5"/>
<text x="435" y="118" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">grey / black</text>
<text x="435" y="134" font-size="11" text-anchor="middle" fill="#b91c1c">reject</text>
<line x1="30" y1="150" x2="470" y2="150" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="250" y="166" font-size="10.5" text-anchor="middle" fill="#5b6577">more oxygen reached the hot metal: gas flow, post-flow, purge, cup size, draughts →</text>
<text x="250" y="192" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Titanium: silver only. Corrosive service: remove blue and darker.</text>
</svg>