<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 365" width="500" height="365" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>MIG transfer modes</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="365" fill="#ffffff"/>
<text x="70" y="24" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a2233">Short-circuit</text>
<rect x="30" y="118" width="80" height="10" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="70" y1="50" x2="70" y2="114" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<path d="M48,118 Q70,104 92,118" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="70" y="160" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="70" dy="0">wire touches the puddle</tspan><tspan x="70" dy="13.125">20-100 times per second</tspan></text>
<text x="70" y="198" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">16-22 V</text>
<text x="70" y="214" font-size="11" text-anchor="middle" fill="#1a2233">thin, all positions</text>
<text x="190" y="24" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a2233">Globular</text>
<rect x="150" y="118" width="80" height="10" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="190" y1="50" x2="190" y2="80" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<circle cx="190" cy="90" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<circle cx="202" cy="106" r="4" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<path d="M168,118 Q190,106 212,118" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="190" y="160" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="190" dy="0">big drops fall by</tspan><tspan x="190" dy="13.125">gravity, spatter</tspan></text>
<text x="190" y="198" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">22-26 V (CO2)</text>
<text x="190" y="214" font-size="11" text-anchor="middle" fill="#1a2233">flat only, avoid</text>
<text x="310" y="24" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a2233">Spray</text>
<rect x="270" y="118" width="80" height="10" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="310" y1="50" x2="310" y2="74" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<path d="M307,74 L313,74 L326,110 L294,110 Z" fill="#fff4d6" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="304" cy="80" r="1.8" fill="#b45309" stroke="none" stroke-width="1.5"/>
<circle cx="311" cy="87" r="1.8" fill="#b45309" stroke="none" stroke-width="1.5"/>
<circle cx="304" cy="94" r="1.8" fill="#b45309" stroke="none" stroke-width="1.5"/>
<circle cx="311" cy="101" r="1.8" fill="#b45309" stroke="none" stroke-width="1.5"/>
<circle cx="304" cy="108" r="1.8" fill="#b45309" stroke="none" stroke-width="1.5"/>
<path d="M286,118 Q310,108 334,118" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="310" y="160" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="310" dy="0">fine droplets in a</tspan><tspan x="310" dy="13.125">cone, no contact</tspan></text>
<text x="310" y="198" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">24-32 V, ≥ 80% Ar</text>
<text x="310" y="214" font-size="11" text-anchor="middle" fill="#1a2233">flat/horizontal, thick</text>
<text x="430" y="24" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a2233">Pulsed spray</text>
<rect x="390" y="118" width="80" height="10" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="430" y1="50" x2="430" y2="74" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<circle cx="430" cy="88" r="4" fill="#b45309" stroke="none" stroke-width="1.5"/>
<path d="M406,118 Q430,108 454,118" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M408,140 l6,0 l0,-12 l6,0 l0,12 l8,0 l0,-12 l6,0 l0,12 l8,0" fill="none" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="430" y="160" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="430" dy="0">one drop per pulse,</tspan><tspan x="430" dy="13.125">lower average heat</tspan></text>
<text x="430" y="198" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">pulse program</text>
<text x="430" y="214" font-size="11" text-anchor="middle" fill="#1a2233">all positions</text>
<rect x="70" y="255" width="400" height="70" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="70" y="339" font-size="11" text-anchor="middle" fill="#5b6577">0</text>
<text x="170" y="339" font-size="11" text-anchor="middle" fill="#5b6577">100</text>
<text x="270" y="339" font-size="11" text-anchor="middle" fill="#5b6577">200</text>
<text x="370" y="339" font-size="11" text-anchor="middle" fill="#5b6577">300</text>
<text x="470" y="339" font-size="11" text-anchor="middle" fill="#5b6577">400</text>
<text x="270" y="355" font-size="12" text-anchor="middle" fill="#5b6577">Amperage (.035 wire, 90/10 Ar-CO2)</text>
<rect x="110" y="258" width="120" height="64" fill="#dbeafe" stroke="none" stroke-width="1.5"/>
<text x="170" y="294" font-size="11" text-anchor="middle" fill="#1a2233">short-circuit</text>
<rect x="230" y="258" width="55" height="64" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<text x="257.5" y="294" font-size="11" text-anchor="middle" fill="#1a2233">globular</text>
<rect x="285" y="258" width="185" height="64" fill="#fff4d6" stroke="none" stroke-width="1.5"/>
<text x="377.5" y="294" font-size="11" text-anchor="middle" fill="#1a2233">spray</text>
<line x1="235" y1="258" x2="235" y2="322" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="250" y="245" font-size="10.5" text-anchor="middle" fill="#b91c1c">transition to spray ≈ 165-170 A for .035, ≈ 220 A for .045 (needs ≥ 80% argon)</text>
</svg>