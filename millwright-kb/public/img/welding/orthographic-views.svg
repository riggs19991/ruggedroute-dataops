<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Orthographic views</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="250" y="22" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a2233">Third-angle projection (US): what you see from each side</text>
<rect x="80" y="40" width="140" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="190" cy="70" r="14" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="150" y="118" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">TOP</text>
<path d="M80,150 L220,150 L220,240 L150,240 L150,200 L80,200 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="176" y1="150" x2="176" y2="240" stroke="#1a2233" stroke-width="1" stroke-dasharray="5 3" stroke-linecap="round"/>
<line x1="204" y1="150" x2="204" y2="240" stroke="#1a2233" stroke-width="1" stroke-dasharray="5 3" stroke-linecap="round"/>
<text x="150" y="258" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">FRONT</text>
<path d="M260,150 L320,150 L320,240 L300,240 L300,200 L260,200 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="290" y="258" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">RIGHT SIDE</text>
<line x1="80" y1="110" x2="80" y2="145" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="220" y1="110" x2="220" y2="145" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="230" y1="150" x2="255" y2="150" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="230" y1="240" x2="255" y2="240" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="340" y="40" width="160" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="346" y="54.96" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Line</text>
<text x="421" y="54.96" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Means</text>
<rect x="340" y="62" width="160" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="346" y="76.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">solid thick</text>
<text x="421" y="76.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">visible edge</text>
<rect x="340" y="84" width="160" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="346" y="98.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">dashed</text>
<text x="421" y="98.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">hidden edge</text>
<rect x="340" y="106" width="160" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="346" y="120.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">thin chain</text>
<text x="421" y="120.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">centre line</text>
<rect x="340" y="128" width="160" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="346" y="142.96" font-size="10.5" text-anchor="start" fill="#1a2233">thin + arrows</text>
<text x="421" y="142.96" font-size="10.5" text-anchor="start" fill="#1a2233">dimension</text>
<rect x="340" y="150" width="160" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="346" y="164.96" font-size="10.5" text-anchor="start" fill="#1a2233">zigzag</text>
<text x="421" y="164.96" font-size="10.5" text-anchor="start" fill="#1a2233">break</text>
<rect x="340" y="172" width="160" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="346" y="186.96" font-size="10.5" text-anchor="start" fill="#1a2233">thick chain</text>
<text x="421" y="186.96" font-size="10.5" text-anchor="start" fill="#1a2233">cutting plane</text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">First-angle (ISO) puts the top view below the front view: check the symbol.</text>
</svg>