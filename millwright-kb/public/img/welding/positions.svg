<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="500" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Welding positions</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="330" fill="#ffffff"/>
<text x="250" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Plate: groove (G) and fillet (F)</text>
<rect x="25" y="100" width="80" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M55,100 Q65,90 75,100" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="65" y1="55" x2="65" y2="85" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<text x="65" y="150" font-size="11.5" text-anchor="middle" fill="#1a2233">1G / 1F flat</text>
<rect x="182" y="55" width="12" height="80" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M194,90 Q204,100 194,110" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="233" y1="100" x2="204" y2="100" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<text x="188" y="150" font-size="11.5" text-anchor="middle" fill="#1a2233">2G / 2F horizontal</text>
<rect x="305" y="55" width="12" height="80" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M317,65 L317,130" fill="none" stroke="#f8b878" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="351" y1="120" x2="325" y2="95" stroke="#1a2233" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="337" y="134" font-size="10" text-anchor="start" fill="#5b6577">up</text>
<text x="311" y="150" font-size="11.5" text-anchor="middle" fill="#1a2233">3G / 3F vertical</text>
<rect x="394" y="60" width="80" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M424,72 Q434,82 444,72" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="434" y1="120" x2="434" y2="88" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<text x="434" y="150" font-size="11.5" text-anchor="middle" fill="#1a2233">4G / 4F overhead</text>
<text x="250" y="185" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Pipe</text>
<g transform="translate(65,240) rotate(0)"><rect x="-40" y="-14" width="80" height="28" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<line x1="0" y1="-14" x2="0" y2="14" stroke="#f8b878" stroke-width="5" stroke-linecap="round"/></g>
<path d="M46.20614758428184,209.1595971334866 A20,20 0 0 1 83.79385241571816,209.1595971334866" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="65" y="300" font-size="11" text-anchor="middle" fill="#1a2233">1G rolled</text>
<text x="65" y="314" font-size="10" text-anchor="middle" fill="#5b6577"> weld at top</text>
<g transform="translate(188,240) rotate(90)"><rect x="-40" y="-14" width="80" height="28" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<line x1="0" y1="-14" x2="0" y2="14" stroke="#f8b878" stroke-width="5" stroke-linecap="round"/></g>

<text x="188" y="300" font-size="11" text-anchor="middle" fill="#1a2233">2G axis vertical</text>
<text x="188" y="314" font-size="10" text-anchor="middle" fill="#5b6577"> weld horizontal</text>
<g transform="translate(311,240) rotate(0)"><rect x="-40" y="-14" width="80" height="28" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<line x1="0" y1="-14" x2="0" y2="14" stroke="#f8b878" stroke-width="5" stroke-linecap="round"/></g>

<text x="311" y="300" font-size="11" text-anchor="middle" fill="#1a2233">5G axis horizontal</text>
<text x="311" y="314" font-size="10" text-anchor="middle" fill="#5b6577"> fixed</text>
<g transform="translate(434,240) rotate(45)"><rect x="-40" y="-14" width="80" height="28" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<line x1="0" y1="-14" x2="0" y2="14" stroke="#f8b878" stroke-width="5" stroke-linecap="round"/></g>

<text x="434" y="300" font-size="11" text-anchor="middle" fill="#1a2233">6G axis at 45°</text>
<text x="434" y="314" font-size="10" text-anchor="middle" fill="#5b6577"> fixed</text>
</svg>