<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 215" width="500" height="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>MIG gun parts</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="215" fill="#ffffff"/>
<rect x="20" y="80" width="150" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="10"/>
<text x="95" y="72" font-size="11" text-anchor="middle" fill="#1a2233">gun neck</text>
<rect x="170" y="88" width="70" height="24" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<rect x="240" y="84" width="60" height="32" fill="#b87333" stroke="#b45309" stroke-width="1.5" rx="3"/>
<rect x="300" y="92" width="60" height="16" fill="#d4a017" stroke="#b45309" stroke-width="1.5"/>
<rect x="365" y="76" width="110" height="48" fill="#b87333" stroke="#b45309" stroke-width="1.5" rx="6"/>
<line x1="20" y1="100" x2="480" y2="100" stroke="#1a2233" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round"/>
<circle cx="60" cy="60" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="60" y="64" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="205" cy="60" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="205" y="64" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="270" cy="60" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="270" y="64" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="330" cy="60" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="330" y="64" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="420" cy="60" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="420" y="64" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<circle cx="29" cy="136" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="140" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="44" y="140" font-size="10.5" text-anchor="start" fill="#1a2233">liner: sized to the wire, cut square, replace when feeding drags</text>
<circle cx="29" cy="150" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="154" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="44" y="154" font-size="10.5" text-anchor="start" fill="#1a2233">diffuser / retaining head: gas ports clear, threads tight</text>
<circle cx="29" cy="164" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="168" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="44" y="168" font-size="10.5" text-anchor="start" fill="#1a2233">contact tip: replace when oval, burnt or feeding stutters</text>
<circle cx="29" cy="178" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="182" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="44" y="182" font-size="10.5" text-anchor="start" fill="#1a2233">nozzle: 1/2-5/8 in ID, anti-spatter, tip recessed for spray</text>
<circle cx="29" cy="192" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="196" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text><text x="44" y="196" font-size="10.5" text-anchor="start" fill="#1a2233">wire path: kinks, dirt or a worn liner cause bird-nests</text>
</svg>