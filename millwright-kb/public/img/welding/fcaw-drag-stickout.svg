<text x="400" y="150" font-size="11" text-anchor="middle" fill="#5b6577"><tspan x="400" dy="0">"Drag if slag":</tspan><tspan x="400" dy="13.75">the arc rides the</tspan><tspan x="400" dy="13.75">leading edge of</tspan><tspan x="400" dy="13.75">the puddle, slag</tspan><tspan x="400" dy="13.75">follows behind</tspan></text>
