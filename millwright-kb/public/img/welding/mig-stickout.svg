<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="500" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>MIG stickout and gun angle</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="330" fill="#ffffff"/>
<rect x="30" y="200" width="300" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="180" y="232" font-size="12" text-anchor="middle" fill="#5b6577">travel direction →</text>
<g transform="translate(200,196) rotate(-12)"><rect x="-26" y="-170" width="52" height="120" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="8"/>
<rect x="-20" y="-60" width="40" height="50" fill="#b87333" stroke="#b45309" stroke-width="1.5" rx="4"/>
<rect x="-5" y="-70" width="10" height="40" fill="#d4a017" stroke="#b45309" stroke-width="1.5"/>
<line x1="0" y1="-30" x2="0" y2="0" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/></g>
<line x1="200" y1="196" x2="200" y2="40" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M200,46 A150,150 0 0 0 168.81324637733613,49.27785988992915" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150" y="40" font-size="12" text-anchor="end" fill="#0b5fa5">10-15° push</text>
<circle cx="200" cy="196" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<path d="M162,202 Q182,184 200,196" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="300" y1="196" x2="300" y2="148" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="306" y="176" font-size="12" text-anchor="start" fill="#1a2233">CTWD</text>
<circle cx="232" cy="128" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="232" y="132" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="226" cy="160" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="226" y="164" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="212" cy="178" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="212" y="182" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="175" cy="60" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="175" y="64" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="344" cy="36" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="40" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="359" y="40" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="359" dy="0">nozzle: 1/2-5/8 in ID,</tspan><tspan x="359" dy="13.125">keep spatter out</tspan></text>
<circle cx="344" cy="93.125" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="97.125" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="359" y="97.125" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="359" dy="0">contact tip sized to the</tspan><tspan x="359" dy="13.125">wire; recessed 1/8 in</tspan><tspan x="359" dy="13.125">for spray, flush for</tspan><tspan x="359" dy="13.125">short-circuit</tspan></text>
<circle cx="344" cy="176.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="180.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="359" y="180.5" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="359" dy="0">stickout (wire past tip)</tspan><tspan x="359" dy="13.125">3/8-1/2 in short-circuit</tspan><tspan x="359" dy="13.125">3/4-1 in spray or FCAW</tspan></text>
<circle cx="344" cy="246.75" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="250.75" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="359" y="250.75" font-size="10.5" text-anchor="start" fill="#1a2233">gun body and liner</text>
<text x="180" y="275" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="180" dy="0">CTWD = contact tip to work distance.</tspan><tspan x="180" dy="13.125">Longer = less current, more spatter; shorter = hotter.</tspan></text>
<text x="250" y="322" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Push 10-15° on steel short-circuit and spray; drag on flux-core.</text>
</svg>