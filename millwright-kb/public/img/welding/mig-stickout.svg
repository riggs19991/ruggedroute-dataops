<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="500" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>MIG stickout and gun angle</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="330" fill="#ffffff"/>
<rect x="30" y="210" width="300" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="60" y1="236" x2="110" y2="236" stroke="#0b5fa5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="85" y="252" font-size="10.5" text-anchor="middle" fill="#0b5fa5">travel</text>
<g transform="translate(200,206) rotate(-12)"><path d="M-40,-190 L-40,-150 Q-40,-120 -18,-104 L-8,-98" fill="none" stroke="#f1f5f9" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M-40,-190 L-40,-150 Q-40,-120 -18,-104 L-8,-98" fill="none" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="-20" y="-104" width="40" height="74" fill="#b87333" stroke="#b45309" stroke-width="1.5" rx="5"/>
<rect x="-5" y="-60" width="10" height="42" fill="#d4a017" stroke="#b45309" stroke-width="1.5"/>
<line x1="0" y1="-18" x2="0" y2="0" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/></g>
<line x1="200" y1="206" x2="200" y2="60" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M200,86 A120,120 0 0 0 175.0505971018689,88.62228791194332" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="170" y="78" font-size="11" text-anchor="end" fill="#0b5fa5">10-15° push</text>
<circle cx="200" cy="206" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<path d="M160,212 Q180,194 200,206" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="262" y1="206" x2="262" y2="150" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="268" y="182" font-size="11" text-anchor="start" fill="#1a2233">CTWD</text>
<circle cx="236" cy="128" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="236" y="132" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="224" cy="166" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="224" y="170" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="214" cy="190" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="214" y="194" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="155" cy="40" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="155" y="44" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="344" cy="36" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="40" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="359" y="40" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="359" dy="0">nozzle: 1/2-5/8 in ID,</tspan><tspan x="359" dy="13.125">keep spatter out</tspan></text>
<circle cx="344" cy="93.125" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="97.125" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="359" y="97.125" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="359" dy="0">contact tip sized to the</tspan><tspan x="359" dy="13.125">wire; recessed 1/8 in</tspan><tspan x="359" dy="13.125">for spray, flush for</tspan><tspan x="359" dy="13.125">short-circuit</tspan></text>
<circle cx="344" cy="176.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="180.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="359" y="180.5" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="359" dy="0">stickout (wire past tip)</tspan><tspan x="359" dy="13.125">3/8-1/2 in short-circuit</tspan><tspan x="359" dy="13.125">3/4-1 in spray or FCAW</tspan></text>
<circle cx="344" cy="246.75" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="344" y="250.75" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="359" y="250.75" font-size="10.5" text-anchor="start" fill="#1a2233">gun body and liner</text>
<text x="180" y="282" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="180" dy="0">CTWD = contact tip to work distance.</tspan><tspan x="180" dy="13.125">Longer = less current, more spatter; shorter = hotter.</tspan></text>
<text x="250" y="322" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Push 10-15° on steel short-circuit and spray; drag on flux-core.</text>
</svg>