<text x="180" y="186" font-size="12" text-anchor="middle" fill="#1a2233">work</text>
<line x1="190" y1="86" x2="190" y2="150" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<rect x="182" y="70" width="16" height="22" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="190" y="60" font-size="11" text-anchor="middle" fill="#1a2233">electrode</text>
<path d="M48,98 C48,135 190,45 190,70" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M92,98 C92,178 130,188 134,172" fill="none" stroke="#1a2233" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="130" y="204" font-size="11" text-anchor="middle" fill="#5b6577">electrode +, work −</text>
<text x="130" y="218" font-size="11" text-anchor="middle" fill="#5b6577">about 2/3 of the heat at the electrode</text>
<text x="370" y="32" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2233">DCEN (straight polarity)</text>
<rect x="260" y="40" width="100" height="64" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<text x="310" y="64.7" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2233"><tspan x="310" dy="0">Welding</tspan><tspan x="310" dy="15">machine</tspan></text>
<circle cx="288" cy="92" r="6" fill="#b91c1c" stroke="#1a2233" stroke-width="1.5"/>
<text x="288" y="96" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">+</text>
<circle cx="332" cy="92" r="6" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<text x="332" y="96" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">−</text>
