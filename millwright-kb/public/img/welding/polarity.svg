<text x="70" y="64.7" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2233"><tspan x="70" dy="0">Welding</tspan><tspan x="70" dy="15">machine</tspan></text>
<circle cx="48" cy="92" r="6" fill="#b91c1c" stroke="#1a2233" stroke-width="1.5"/>
