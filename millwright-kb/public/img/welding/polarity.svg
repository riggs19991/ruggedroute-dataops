<rect x="422" y="70" width="16" height="22" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="430" y="60" font-size="11" text-anchor="middle" fill="#1a2233">electrode</text>
<path d="M332,98 C332,135 430,45 430,70" fill="none" stroke="#1a2233" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288,98 C288,178 370,188 374,172" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="370" y="204" font-size="11" text-anchor="middle" fill="#5b6577">electrode −, work +</text>
<text x="370" y="218" font-size="11" text-anchor="middle" fill="#5b6577">about 2/3 of the heat in the work</text>
<rect x="20" y="240" width="460" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="254.96" font-size="11.5" text-anchor="start" font-weight="600" fill="#1a2233">Process</text>
<text x="356" y="254.96" font-size="11.5" text-anchor="start" font-weight="600" fill="#1a2233">Polarity</text>
<rect x="20" y="262" width="460" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="276.96" font-size="11.5" text-anchor="start" fill="#1a2233">Stick 7018 / 6010, MIG, gas-shielded flux-core</text>
<text x="356" y="276.96" font-size="11.5" text-anchor="start" fill="#1a2233">DCEP</text>
<rect x="20" y="284" width="460" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="298.96" font-size="11.5" text-anchor="start" fill="#1a2233">TIG on steel, stainless, copper, titanium</text>
<text x="356" y="298.96" font-size="11.5" text-anchor="start" fill="#1a2233">DCEN</text>
<rect x="20" y="306" width="460" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="320.96" font-size="11.5" text-anchor="start" fill="#1a2233">Self-shielded flux-core (E71T-11, T-8)</text>
<text x="356" y="320.96" font-size="11.5" text-anchor="start" fill="#1a2233">DCEN</text>
<rect x="20" y="328" width="460" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="342.96" font-size="11.5" text-anchor="start" fill="#1a2233">TIG aluminium; stick when arc blow is bad</text>
<text x="356" y="342.96" font-size="11.5" text-anchor="start" fill="#1a2233">AC</text>
<text x="250" y="392" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Wrong polarity is the first check on a spattery, porous weld.</text>
</svg>