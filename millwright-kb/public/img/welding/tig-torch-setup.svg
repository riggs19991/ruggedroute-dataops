<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>TIG torch setup</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="360" fill="#ffffff"/>
<text x="110" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Tungsten grind (DC)</text>
<path d="M30,50 L150,50 L150,66 L30,66 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150,50 L200,57 L200,59 L150,66 Z" fill="#64748b" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="150" y1="74" x2="200" y2="74" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="175" y="70" font-size="11" text-anchor="middle" fill="#1a2233">2-2.5 × d</text>
<line x1="24" y1="50" x2="24" y2="66" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="18" y="62" font-size="11" text-anchor="end" fill="#1a2233">d</text>
<line x1="152" y1="52" x2="190" y2="55.5" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round"/>
<line x1="162" y1="53.5" x2="190" y2="56" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round"/>
<line x1="172" y1="55" x2="190" y2="56.5" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round"/>
<line x1="182" y1="56.5" x2="190" y2="57" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round"/>
<line x1="192" y1="58" x2="190" y2="57.5" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round"/>
<text x="20" y="100" font-size="11" text-anchor="start" fill="#5b6577"><tspan x="20" dy="0">grind marks lengthwise, tiny flat on the tip;</tspan><tspan x="20" dy="13.75">AC inverter: same or truncated; transformer: ball</tspan></text>
<text x="360" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Torch and filler</text>
<rect x="230" y="250" width="250" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="355" y="282" font-size="12" text-anchor="middle" fill="#5b6577">travel direction ←</text>
<g transform="translate(380,246) rotate(12)"><rect x="-22" y="-190" width="44" height="120" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="8"/>
<path d="M-16,-70 L16,-70 L13,-14 L-13,-14 Z" fill="#f5d0a9" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="0" y1="-70" x2="0" y2="0" stroke="#64748b" stroke-width="3" stroke-linecap="round"/></g>
<line x1="380" y1="246" x2="380" y2="110" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M380,156 A90,90 0 0 1 398.71205217359835,157.96671593395752" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="390.66190325330064" y="148.55876667243612" font-size="12" text-anchor="middle" fill="#0b5fa5">10-15°</text>
<g transform="translate(372,242) rotate(-17)"><line x1="0" y1="0" x2="130" y2="0" stroke="#b87333" stroke-width="3" stroke-linecap="round"/></g>
<line x1="372" y1="242" x2="240" y2="242" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M312,242 A60,60 0 0 0 314.62171464221785,259.5423022833642" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="296" y="228" font-size="12" text-anchor="end" fill="#0b5fa5">15-20°</text>
<circle cx="380" cy="246" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<path d="M380,246 Q405,230 430,248" fill="none" stroke="#f8b878" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="395" cy="215" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="395" y="219" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="383" cy="190" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="383" y="194" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="300" cy="218" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="222" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="366" cy="110" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="366" y="114" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="29" cy="136" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="140" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="44" y="140" font-size="11" text-anchor="start" fill="#1a2233">stickout ≈ cup diameter (2× with a gas lens)</text>
<circle cx="29" cy="153" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="157" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="44" y="157" font-size="11" text-anchor="start" fill="#1a2233">arc length ≈ tungsten diameter</text>
<circle cx="29" cy="170" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="174" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="44" y="174" font-size="11" text-anchor="start" fill="#1a2233">filler into the front edge of the puddle</text>
<circle cx="29" cy="187" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="191" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="44" y="191" font-size="11" text-anchor="start" fill="#1a2233">ceramic cup #6-#8, gas lens for stainless</text>
<text x="250" y="352" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Never touch the tungsten to the puddle or rod: regrind if you do.</text>
</svg>