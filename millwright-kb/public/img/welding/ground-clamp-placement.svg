<rect x="20" y="225" width="210" height="40" fill="#dcfce7" stroke="#166534" stroke-width="1.5" rx="6"/><text x="125" y="242.25" font-size="10" text-anchor="middle" fill="#1a2233"><tspan x="125" dy="0">clamp on the bracket being welded:</tspan><tspan x="125" dy="12.5">current stays in the part</tspan></text>
