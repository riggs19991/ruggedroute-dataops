<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Plasma pierce sequence</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="280" fill="#ffffff"/>
<rect x="30" y="160" width="120" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(90,150) rotate(-45)"><rect x="-14" y="-110" width="28" height="90" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<rect x="-10" y="-22" width="20" height="22" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<line x1="0" y1="0" x2="0" y2="20" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/></g>
<path d="M94,162 q20,-18 40,-30" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2" stroke-linejoin="round" stroke-linecap="round"/>

<text x="90" y="210" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">1. Tilt 45°</text>
<text x="90" y="226" font-size="10.5" text-anchor="middle" fill="#5b6577"> pierce</text>
<rect x="190" y="160" width="120" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(250,150) rotate(-20)"><rect x="-14" y="-110" width="28" height="90" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<rect x="-10" y="-22" width="20" height="22" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<line x1="0" y1="0" x2="0" y2="20" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/></g>
<path d="M254,162 q20,-18 40,-30" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2" stroke-linejoin="round" stroke-linecap="round"/>

<text x="250" y="210" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">2. Rotate upright as it blows through</text>
<text x="250" y="226" font-size="10.5" text-anchor="middle" fill="#5b6577"></text>
<rect x="350" y="160" width="120" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(410,150) rotate(0)"><rect x="-14" y="-110" width="28" height="90" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<rect x="-10" y="-22" width="20" height="22" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<line x1="0" y1="0" x2="0" y2="20" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/></g>
<line x1="410" y1="166" x2="410" y2="176" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/>
<line x1="380" y1="186" x2="440" y2="186" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="410" y="210" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">3. Square</text>
<text x="410" y="226" font-size="10.5" text-anchor="middle" fill="#5b6577"> move into the cut</text>
<text x="250" y="22" font-size="10.5" text-anchor="middle" fill="#5b6577">Pierce height 1.5-2 × cut height; pierce limit ≈ half the severance rating</text>
<text x="250" y="250" font-size="10.5" text-anchor="middle" fill="#5b6577">Thick plate: start at the plate edge or a drilled hole instead of piercing</text>
<text x="250" y="272" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Molten metal splashes back up the kerf until the pierce breaks through.</text>
</svg>