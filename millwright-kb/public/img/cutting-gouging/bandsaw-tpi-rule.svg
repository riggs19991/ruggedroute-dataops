<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Band saw TPI rule</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<text x="250" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Teeth per inch (TPI) versus material thickness</text>
<text x="105" y="50" font-size="11.5" text-anchor="middle" font-weight="600" fill="#b91c1c">Too coarse</text>
<path d="M40,140 L40,120 L50,110 L60,120 L70,110 L80,120 L90,110 L100,120 L110,110 L120,120 L130,110 L140,120 L150,110 L160,120 L170,140 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="80" y="86" width="50" height="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="105" y="165" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="105" dy="0">teeth straddle the work,</tspan><tspan x="105" dy="12.5">strip teeth</tspan></text>
<text x="260" y="50" font-size="11.5" text-anchor="middle" font-weight="600" fill="#166534">Right: 3-24 teeth in the cut</text>
<path d="M195,140 L195,120 L202,110 L209,120 L216,110 L223,120 L230,110 L237,120 L244,110 L251,120 L258,110 L265,120 L272,110 L279,120 L286,110 L293,120 L300,110 L307,120 L314,110 L321,120 L325,140 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="235" y="86" width="50" height="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="260" y="165" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="260" dy="0">6-10 TPI for 1/2-1 in steel;</tspan><tspan x="260" dy="12.5">14 for 1/4; 4-6 for 2 in+</tspan></text>
<text x="415" y="50" font-size="11.5" text-anchor="middle" font-weight="600" fill="#b91c1c">Too fine</text>
<path d="M350,140 L350,120 L353,110 L356,120 L359,110 L362,120 L365,110 L368,120 L371,110 L374,120 L377,110 L380,120 L383,110 L386,120 L389,110 L392,120 L395,110 L398,120 L401,110 L404,120 L407,110 L410,120 L413,110 L416,120 L419,110 L422,120 L425,110 L428,120 L431,110 L434,120 L437,110 L440,120 L443,110 L446,120 L449,110 L452,120 L455,110 L458,120 L461,110 L464,120 L467,110 L470,120 L473,110 L476,120 L480,140 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="390" y="86" width="50" height="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="415" y="165" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="415" dy="0">gullets clog,</tspan><tspan x="415" dy="12.5">slow and hot</tspan></text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Speed: 150-250 fpm mild steel, 60-100 stainless, 1,000+ aluminium.</text>
</svg>