<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Annular cutter vs twist drill</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="260" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Annular cutter</text>
<text x="370" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Twist drill</text>
<rect x="40" y="150" width="180" height="30" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="100" y="60" width="60" height="90" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="112" y="60" width="36" height="100" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="100" y="60" width="12" height="90" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="148" y="60" width="12" height="90" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<line x1="130" y1="50" x2="130" y2="168" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<circle cx="130" cy="168" r="3" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<text x="130" y="200" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">removes only the ring (fast, low</tspan><tspan x="130" dy="13.125">feed force); pilot centres and</tspan><tspan x="130" dy="13.125">ejects the slug: keep feet clear</tspan></text>
<rect x="280" y="150" width="180" height="30" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M350,60 L390,60 L390,140 L370,165 L350,140 Z" fill="#64748b" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="370" y="200" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="370" dy="0">removes the whole hole as chips;</tspan><tspan x="370" dy="13.125">3-4 × the feed force; step</tspan><tspan x="370" dy="13.125">drill for holes over 1/2 in</tspan></text>
<text x="250" y="252" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Magnet needs flat, clean, thick steel: strap the drill on verticals.</text>
</svg>