<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Carbon-arc gouging</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="280" fill="#ffffff"/>
<rect x="30" y="210" width="440" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M120,210 Q200,238 300,212" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(364,93) rotate(-35)"><rect x="-70" y="-14" width="140" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<rect x="-90" y="-8" width="20" height="16" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<line x1="-90" y1="0" x2="-200" y2="0" stroke="#333" stroke-width="8" stroke-linecap="butt"/>
<circle cx="-84" cy="10" r="3" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<circle cx="-76" cy="10" r="3" fill="#0b5fa5" stroke="none" stroke-width="1.5"/></g>
<path d="M292,150 l-50,32" fill="none" stroke="#0b5fa5" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.8" marker-end="url(#arr)"/>
<path d="M286,156 l-50,32" fill="none" stroke="#0b5fa5" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.8" marker-end="url(#arr)"/>
<path d="M280,162 l-50,32" fill="none" stroke="#0b5fa5" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.8" marker-end="url(#arr)"/>
<line x1="200" y1="210" x2="340" y2="210" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M257.34064310022944,169.84964945542677 A70,70 0 0 1 270,210" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="282" y="196" font-size="12" text-anchor="start" fill="#0b5fa5">35-45°</text>
<circle cx="200" cy="208" r="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<circle cx="262" cy="150" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="262" y="154" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="300" cy="110" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="114" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="372" cy="70" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="372" y="74" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="29" cy="26" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="30" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="44" y="30" font-size="10.5" text-anchor="start" fill="#1a2233">air jet (80-100 psi) comes out UNDER the electrode, behind the arc</text>
<circle cx="29" cy="39" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="43" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="44" y="43" font-size="10.5" text-anchor="start" fill="#1a2233">electrode extension 5-7 in max (more = it burns off and wanders)</text>
<circle cx="29" cy="52" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="56" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="44" y="56" font-size="10.5" text-anchor="start" fill="#1a2233">holder: DCEP for copper-clad DC electrodes</text>
<circle cx="29" cy="65" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="69" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="44" y="69" font-size="10.5" text-anchor="start" fill="#1a2233">steeper angle = deeper groove; push along, away from you</text>
<line x1="60" y1="190" x2="120" y2="190" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="60" y="180" font-size="11" text-anchor="start" fill="#5b6577">travel</text>
<text x="250" y="272" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Muffs plus plugs, full leathers, shade 12-14: the loudest job in the shop.</text>
</svg>