<text x="234" y="145" font-size="9.6" text-anchor="start" fill="#5b6577"><tspan x="234" dy="0">swirl ring (ceramic): spins the</tspan><tspan x="234" dy="12">gas around the electrode</tspan></text>
<line x1="190" y1="176" x2="210" y2="176" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
