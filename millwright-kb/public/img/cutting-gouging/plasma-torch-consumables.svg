<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Plasma consumables</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="360" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Consumable stack (in order)</text>
<rect x="80" y="40" width="100" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<rect x="90" y="72" width="80" height="26" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="112" y="100" width="36" height="30" fill="#e6c98a" stroke="#b45309" stroke-width="1.5"/>
<rect x="96" y="132" width="68" height="26" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<rect x="88" y="160" width="84" height="22" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="100" y="184" width="60" height="16" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<circle cx="200" cy="55" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="200" y="59" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="200" cy="85" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="200" y="89" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="200" cy="115" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="200" y="119" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="200" cy="145" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="200" y="149" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="200" cy="171" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="200" y="175" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<circle cx="200" cy="192" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="200" y="196" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text>
<circle cx="29" cy="258" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="262" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="44" y="262" font-size="10.5" text-anchor="start" fill="#1a2233">torch head</text>
<circle cx="29" cy="271" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="275" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="44" y="275" font-size="10.5" text-anchor="start" fill="#1a2233">electrode (hafnium insert: replace when pit &gt; 1/16 in)</text>
<circle cx="29" cy="284" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="288" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="44" y="288" font-size="10.5" text-anchor="start" fill="#1a2233">swirl ring</text>
<circle cx="29" cy="297" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="301" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="44" y="301" font-size="10.5" text-anchor="start" fill="#1a2233">nozzle (orifice sized to amps: replace when oval)</text>
<circle cx="29" cy="310" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="314" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text><text x="44" y="314" font-size="10.5" text-anchor="start" fill="#1a2233">retaining cap</text>
<circle cx="29" cy="323" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="327" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text><text x="44" y="327" font-size="10.5" text-anchor="start" fill="#1a2233">shield (drag shield lets the torch touch the plate)</text>
<text x="370" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Standoff and angle</text>
<rect x="280" y="200" width="200" height="16" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(380,190) rotate(0)"><rect x="-18" y="-140" width="36" height="110" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<rect x="-14" y="-30" width="28" height="30" fill="#b87333" stroke="#b45309" stroke-width="1.5"/></g>
<line x1="380" y1="190" x2="380" y2="200" stroke="#0b5fa5" stroke-width="3" stroke-linecap="round"/>
<path d="M380,200 L380,216" fill="none" stroke="#0b5fa5" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
<line x1="345" y1="190" x2="345" y2="200" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="338" y="198" font-size="10.5" text-anchor="end" fill="#0b5fa5">standoff 1/16-1/8 in</text>
<text x="338" y="212" font-size="10" text-anchor="end" fill="#5b6577">(0 with a drag shield)</text>
<line x1="380" y1="60" x2="380" y2="190" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="380" y="236" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="380" dy="0">torch square to the plate for straight cuts;</tspan><tspan x="380" dy="12.5">tilt 45° only for bevels</tspan></text>
<text x="250" y="352" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Clean dry air at the chart pressure. Check the stack at start-up.</text>
</svg>