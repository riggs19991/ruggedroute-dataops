<line x1="250" y1="376" x2="250" y2="394" stroke="rgba(70,130,255,0.6)" stroke-width="4" stroke-linecap="round"/>
<line x1="300" y1="376" x2="300" y2="382" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="306" y="383" font-size="10" text-anchor="start" fill="#1a2233">1/16-1/8 in</text>
<text x="330" y="372" font-size="9.5" text-anchor="start" fill="#5b6577">(0 with a drag shield)</text>
<text x="250" y="402" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Clean dry air at the chart pressure; check the stack every start-up.</text>
