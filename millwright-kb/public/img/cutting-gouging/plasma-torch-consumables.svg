<line x1="190" y1="274" x2="210" y2="274" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
<circle cx="220" cy="274" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="220" y="278" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text>
<text x="234" y="278" font-size="9.6" text-anchor="start" fill="#5b6577"><tspan x="234" dy="0">shield: takes the spatter; a drag</tspan><tspan x="234" dy="12">shield can touch the plate</tspan></text>
<text x="250" y="322" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Standoff</text>
<rect x="150" y="382" width="200" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(250,376)"><rect x="-10" y="-50" width="20" height="34" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
