<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 345" width="500" height="345" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Oxy-fuel cutting technique</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="345" fill="#ffffff"/>
<text x="30" y="22" font-size="13" text-anchor="start" font-weight="700" fill="#1a2233">Straight cut</text>
<rect x="30" y="180" width="180" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="118" y="180" width="5" height="26" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<g transform="translate(120,176) rotate(0)"><rect x="-9" y="-170" width="18" height="70" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="5"/>
<rect x="-7" y="-100" width="14" height="40" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<rect x="-24" y="-96" width="48" height="12" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<rect x="-8" y="-84" width="16" height="58" fill="#b87333" stroke="#b45309" stroke-width="1.5" rx="2"/>
<path d="M-7.5,-26 L-2.5,-26 L-5,-4 Z" fill="#eaf6ff" stroke="#8ec5ff" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M-2.5,-26 L2.5,-26 L0,-4 Z" fill="#eaf6ff" stroke="#8ec5ff" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M2.5,-26 L7.5,-26 L5,-4 Z" fill="#eaf6ff" stroke="#8ec5ff" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="0" y1="-26" x2="0" y2="26" stroke="rgba(70,130,255,0.55)" stroke-width="5" stroke-linecap="round"/></g>
<line x1="150" y1="154" x2="150" y2="176" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="156" y="169" font-size="10.5" text-anchor="start" fill="#1a2233">1/8 in</text>
<line x1="50" y1="160" x2="90" y2="160" stroke="#0b5fa5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="70" y="152" font-size="10" text-anchor="middle" fill="#0b5fa5">travel</text>
<text x="120" y="228" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="120" dy="0">tip square, preheat cones 1/8 in above the</tspan><tspan x="120" dy="12.5">plate; edge cherry red, then cutting oxygen</tspan></text>
<text x="470" y="22" font-size="13" text-anchor="end" font-weight="700" fill="#1a2233">Bevel cut</text>
<rect x="280" y="180" width="190" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(372,176) rotate(-30)"><rect x="-9" y="-170" width="18" height="70" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="5"/>
<rect x="-7" y="-100" width="14" height="40" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<rect x="-24" y="-96" width="48" height="12" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<rect x="-8" y="-84" width="16" height="58" fill="#b87333" stroke="#b45309" stroke-width="1.5" rx="2"/>
<path d="M-7.5,-26 L-2.5,-26 L-5,-4 Z" fill="#eaf6ff" stroke="#8ec5ff" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M-2.5,-26 L2.5,-26 L0,-4 Z" fill="#eaf6ff" stroke="#8ec5ff" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M2.5,-26 L7.5,-26 L5,-4 Z" fill="#eaf6ff" stroke="#8ec5ff" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="0" y1="-26" x2="0" y2="26" stroke="rgba(70,130,255,0.55)" stroke-width="5" stroke-linecap="round"/></g>
<line x1="372" y1="176" x2="372" y2="96" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M372,130 A46,46 0 0 0 349,136.1628314259158" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="356.9884953840538" y="123.97630207523403" font-size="12" text-anchor="middle" fill="#0b5fa5">30°</text>
<text x="372" y="228" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="372" dy="0">tilt the whole torch on a guide bar or</tspan><tspan x="372" dy="12.5">angle attachment; larger tip, slower</tspan></text>
<text x="250" y="262" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Reading the cut face (drag lines)</text>
<rect x="60" y="272" width="90" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="72" y1="274" x2="72" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="88" y1="274" x2="88" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="104" y1="274" x2="104" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="274" x2="120" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="136" y1="274" x2="136" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<text x="105" y="312" font-size="9.5" text-anchor="middle" fill="#5b6577">straight and fine: right speed</text>
<rect x="200" y="272" width="90" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="212" y1="274" x2="230" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="228" y1="274" x2="246" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="244" y1="274" x2="262" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="260" y1="274" x2="278" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="276" y1="274" x2="294" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<text x="245" y="312" font-size="9.5" text-anchor="middle" fill="#5b6577">swept back: too fast</text>
<rect x="340" y="272" width="90" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="352" y1="274" x2="344" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="368" y1="274" x2="360" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="384" y1="274" x2="376" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="400" y1="274" x2="392" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="416" y1="274" x2="408" y2="296" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<text x="385" y="312" font-size="9.5" text-anchor="middle" fill="#5b6577">gouged, top edge melted: too slow</text>
<text x="250" y="337" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">A clean kerf needs a clean tip: ream the orifices when the cones go crooked.</text>
</svg>