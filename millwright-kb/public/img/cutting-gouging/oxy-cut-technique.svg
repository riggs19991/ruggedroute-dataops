<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Oxy-fuel cutting technique</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="120" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Straight cut</text>
<rect x="30" y="150" width="180" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(120,140)"><rect x="-10" y="-110" width="20" height="90" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="-6" y="-22" width="12" height="22" fill="#b87333" stroke="#b45309" stroke-width="1.5"/></g>
<line x1="120" y1="140" x2="120" y2="178" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/>
<path d="M112,140 q8,-10 16,0" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="150" y1="140" x2="150" y2="150" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="156" y="149" font-size="10.5" text-anchor="start" fill="#1a2233">1/8-1/4 in</text>
<line x1="60" y1="130" x2="100" y2="130" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="60" y="122" font-size="11" text-anchor="start" fill="#5b6577">travel</text>
<text x="120" y="200" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="120" dy="0">tip square, preheat cones 1/8 in above</tspan><tspan x="120" dy="12.5">the plate; edge cherry red, then oxygen</tspan></text>
<text x="370" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Bevel cut</text>
<rect x="280" y="150" width="190" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(370,140) rotate(-30)"><rect x="-10" y="-110" width="20" height="90" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="-6" y="-22" width="12" height="22" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<line x1="0" y1="0" x2="0" y2="44" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/></g>
<line x1="370" y1="140" x2="370" y2="60" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<path d="M370,90 A50,50 0 0 0 345,96.69872981077806" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="353.9532192036437" y="84.11259877007777" font-size="12" text-anchor="middle" fill="#0b5fa5">30°</text>
<text x="375" y="200" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="375" dy="0">tilt the whole torch on a guide bar or</tspan><tspan x="375" dy="12.5">angle attachment; larger tip, slower</tspan></text>
<text x="250" y="240" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Reading the cut face (drag lines)</text>
<rect x="60" y="250" width="90" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="72" y1="252" x2="72" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="88" y1="252" x2="88" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="104" y1="252" x2="104" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="252" x2="120" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="136" y1="252" x2="136" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<text x="105" y="290" font-size="9.5" text-anchor="middle" fill="#5b6577">straight, fine: right</text>
<rect x="200" y="250" width="90" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="212" y1="252" x2="230" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="228" y1="252" x2="246" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="244" y1="252" x2="262" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="260" y1="252" x2="278" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="276" y1="252" x2="294" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<text x="245" y="290" font-size="9.5" text-anchor="middle" fill="#5b6577">swept back: too fast</text>
<rect x="340" y="250" width="90" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="352" y1="252" x2="344" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="368" y1="252" x2="360" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="384" y1="252" x2="376" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="400" y1="252" x2="392" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="416" y1="252" x2="408" y2="274" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<text x="385" y="290" font-size="9.5" text-anchor="middle" fill="#5b6577">gouged, top melted: too slow</text>
</svg>