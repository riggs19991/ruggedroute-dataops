<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Miter elbow layout</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="400" fill="#ffffff"/>
<text x="120" y="24" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">2-piece 90°: one weld, 45° cut</text>
<path d="M20,228 L178,228 L122,172 L20,172 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M178,228 L178,60 L122,60 L122,172 Z" fill="#b9c4d2" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M20,200 L150,200 L150,60" fill="none" stroke="#5b6577" stroke-width="1" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M110,200 A40,40 0 0 1 121.7157287525381,171.7157287525381" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="101.95826430941308" y="184.10046151701536" font-size="12" text-anchor="middle" fill="#0b5fa5">45°</text>
<text x="100" y="258" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="100" dy="0">cut both legs at 45°;</tspan><tspan x="100" dy="12.5">the joint runs corner to corner</tspan></text>
<text x="390" y="24" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">3-piece 90° (two welds)</text>
<path d="M290,228 L383.59797974644664,228 L360.40202025355336,172 L290,172 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M383.59797974644664,228 L448,163.59797974644664 L392,140.40202025355336 L360.40202025355336,172 Z" fill="#b9c4d2" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M448,163.59797974644667 L448,60 L392,60 L392,140.40202025355333 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M290,200 L372,200 L420,152 L420,60" fill="none" stroke="#5b6577" stroke-width="1" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M338,200 A34,34 0 0 1 340.58809589461623,186.98876329958696" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="326.8838771014514" y="195.0258451872581" font-size="10.5" text-anchor="middle" fill="#0b5fa5">22.5°</text>
<line x1="303" y1="114" x2="396" y2="176" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="300" y="118" font-size="10.5" text-anchor="end" fill="#1a2233"><tspan x="300" dy="0">gore: 45° included</tspan><tspan x="300" dy="13.125">(22.5° each end)</tspan></text>
<rect x="60" y="272" width="400" height="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="284.92" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Elbow</text>
<text x="126" y="284.92" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Pieces</text>
<text x="186" y="284.92" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Welds</text>
<text x="246" y="284.92" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">End cut</text>
<text x="326" y="284.92" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Gore (middle) angle</text>
<rect x="60" y="291" width="400" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="303.92" font-size="10.5" text-anchor="start" fill="#1a2233">90°</text>
<text x="126" y="303.92" font-size="10.5" text-anchor="start" fill="#1a2233">2</text>
<text x="186" y="303.92" font-size="10.5" text-anchor="start" fill="#1a2233">1</text>
<text x="246" y="303.92" font-size="10.5" text-anchor="start" fill="#1a2233">45°</text>
<text x="326" y="303.92" font-size="10.5" text-anchor="start" fill="#1a2233">-</text>
<rect x="60" y="310" width="400" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="322.92" font-size="10.5" text-anchor="start" fill="#1a2233">90°</text>
<text x="126" y="322.92" font-size="10.5" text-anchor="start" fill="#1a2233">3</text>
<text x="186" y="322.92" font-size="10.5" text-anchor="start" fill="#1a2233">2</text>
<text x="246" y="322.92" font-size="10.5" text-anchor="start" fill="#1a2233">22.5°</text>
<text x="326" y="322.92" font-size="10.5" text-anchor="start" fill="#1a2233">45°</text>
<rect x="60" y="329" width="400" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="341.92" font-size="10.5" text-anchor="start" fill="#1a2233">90°</text>
<text x="126" y="341.92" font-size="10.5" text-anchor="start" fill="#1a2233">4</text>
<text x="186" y="341.92" font-size="10.5" text-anchor="start" fill="#1a2233">3</text>
<text x="246" y="341.92" font-size="10.5" text-anchor="start" fill="#1a2233">15°</text>
<text x="326" y="341.92" font-size="10.5" text-anchor="start" fill="#1a2233">30°</text>
<rect x="60" y="348" width="400" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="360.92" font-size="10.5" text-anchor="start" fill="#1a2233">45°</text>
<text x="126" y="360.92" font-size="10.5" text-anchor="start" fill="#1a2233">2</text>
<text x="186" y="360.92" font-size="10.5" text-anchor="start" fill="#1a2233">1</text>
<text x="246" y="360.92" font-size="10.5" text-anchor="start" fill="#1a2233">22.5°</text>
<text x="326" y="360.92" font-size="10.5" text-anchor="start" fill="#1a2233">-</text>
<text x="250" y="380" font-size="11" text-anchor="middle" fill="#5b6577">end cut = elbow angle ÷ (2 × welds); gore = elbow angle ÷ welds</text>
<text x="250" y="392" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">More pieces: smoother flow, less pressure drop, more welds.</text>
</svg>