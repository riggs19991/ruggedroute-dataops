<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 365" width="500" height="365" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Miter elbow layout</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="365" fill="#ffffff"/>
<text x="120" y="24" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">2-piece 90° (one weld)</text>
<path d="M30,120 L130,120 L130,220 L90,220 L90,160 L30,160 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="90" y1="160" x2="130" y2="120" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<path d="M130,150 A30,30 0 0 1 108.78679656440357,141.21320343559643" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="113.92729584066623" y="162.80294036547406" font-size="12" text-anchor="middle" fill="#0b5fa5">45°</text>
<text x="360" y="24" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">3-piece 90° (two welds)</text>
<path d="M270,120 L370,120 L370,220 L330,220 L330,160 L270,160 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330,160 L340,132 L370,120" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330,160 L338,141 L354,127 L370,120" fill="none" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="370" y="100" font-size="10.5" text-anchor="middle" fill="#5b6577">end cuts 22.5°, middle piece 45°</text>
<rect x="60" y="232" width="390" height="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="244.92000000000002" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Elbow</text>
<text x="136" y="244.92000000000002" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Pieces</text>
<text x="206" y="244.92000000000002" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Welds</text>
<text x="276" y="244.92000000000002" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">End cut</text>
<text x="356" y="244.92000000000002" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">Middle cuts</text>
<rect x="60" y="251" width="390" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="263.92" font-size="10.5" text-anchor="start" fill="#1a2233">90°</text>
<text x="136" y="263.92" font-size="10.5" text-anchor="start" fill="#1a2233">2</text>
<text x="206" y="263.92" font-size="10.5" text-anchor="start" fill="#1a2233">1</text>
<text x="276" y="263.92" font-size="10.5" text-anchor="start" fill="#1a2233">45°</text>
<text x="356" y="263.92" font-size="10.5" text-anchor="start" fill="#1a2233">-</text>
<rect x="60" y="270" width="390" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="282.92" font-size="10.5" text-anchor="start" fill="#1a2233">90°</text>
<text x="136" y="282.92" font-size="10.5" text-anchor="start" fill="#1a2233">3</text>
<text x="206" y="282.92" font-size="10.5" text-anchor="start" fill="#1a2233">2</text>
<text x="276" y="282.92" font-size="10.5" text-anchor="start" fill="#1a2233">22.5°</text>
<text x="356" y="282.92" font-size="10.5" text-anchor="start" fill="#1a2233">45°</text>
<rect x="60" y="289" width="390" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="301.92" font-size="10.5" text-anchor="start" fill="#1a2233">90°</text>
<text x="136" y="301.92" font-size="10.5" text-anchor="start" fill="#1a2233">4</text>
<text x="206" y="301.92" font-size="10.5" text-anchor="start" fill="#1a2233">3</text>
<text x="276" y="301.92" font-size="10.5" text-anchor="start" fill="#1a2233">15°</text>
<text x="356" y="301.92" font-size="10.5" text-anchor="start" fill="#1a2233">30°</text>
<rect x="60" y="308" width="390" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="66" y="320.92" font-size="10.5" text-anchor="start" fill="#1a2233">45°</text>
<text x="136" y="320.92" font-size="10.5" text-anchor="start" fill="#1a2233">2</text>
<text x="206" y="320.92" font-size="10.5" text-anchor="start" fill="#1a2233">1</text>
<text x="276" y="320.92" font-size="10.5" text-anchor="start" fill="#1a2233">22.5°</text>
<text x="356" y="320.92" font-size="10.5" text-anchor="start" fill="#1a2233">-</text>
<text x="250" y="344" font-size="11" text-anchor="middle" fill="#5b6577">end cut = elbow angle ÷ (2 × welds); middle cut = elbow angle ÷ welds</text>
<text x="250" y="357" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">More pieces = smoother flow, less pressure drop, more welds.</text>
</svg>