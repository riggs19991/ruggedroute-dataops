<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Story pole</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="220" fill="#ffffff"/>
<rect x="40" y="60" width="420" height="22" fill="#e8d3a3" stroke="#b45309" stroke-width="1.5"/>
<line x1="60" y1="60" x2="60" y2="82" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="100" font-size="10.5" text-anchor="middle" fill="#1a2233">datum</text>
<line x1="130" y1="60" x2="130" y2="82" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="130" y="100" font-size="10.5" text-anchor="middle" fill="#1a2233">bolt 1</text>
<line x1="200" y1="60" x2="200" y2="82" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="200" y="100" font-size="10.5" text-anchor="middle" fill="#1a2233">bolt 2</text>
<line x1="290" y1="60" x2="290" y2="82" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="290" y="100" font-size="10.5" text-anchor="middle" fill="#1a2233">bolt 3</text>
<line x1="380" y1="60" x2="380" y2="82" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="380" y="100" font-size="10.5" text-anchor="middle" fill="#1a2233">bolt 4</text>
<line x1="440" y1="60" x2="440" y2="82" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="440" y="100" font-size="10.5" text-anchor="middle" fill="#1a2233">end</text>
<text x="60" y="52" font-size="10" text-anchor="middle" fill="#5b6577">0</text>
<text x="130" y="52" font-size="10" text-anchor="middle" fill="#5b6577">3.500</text>
<text x="200" y="52" font-size="10" text-anchor="middle" fill="#5b6577">7.000</text>
<text x="290" y="52" font-size="10" text-anchor="middle" fill="#5b6577">11.500</text>
<text x="380" y="52" font-size="10" text-anchor="middle" fill="#5b6577">16.000</text>
<text x="250" y="130" font-size="10.5" text-anchor="middle" fill="#5b6577">lay the pole on each part with the datum mark on the datum edge; transfer with a square</text>
<text x="250" y="150" font-size="10.5" text-anchor="middle" fill="#5b6577">no adding up of tape readings, no accumulated error, every part identical</text>
<text x="250" y="212" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Label it with the job, the datum and the date; keep it with the drawing.</text>
</svg>