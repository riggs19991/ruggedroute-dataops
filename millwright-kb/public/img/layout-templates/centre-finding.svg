<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Finding centre of round stock</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="260" fill="#ffffff"/>
<text x="125" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Centre head</text>
<circle cx="125" cy="120" r="66" fill="#cbd5e1" stroke="#1a2233" stroke-width="2"/>
<g transform="translate(125,120) rotate(-30) translate(0,-93)"><path d="M0,0 L-70,70 L-58,82 L0,24 L58,82 L70,70 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="-9" y="-24" width="18" height="114" fill="#e9d9a8" stroke="#b45309" stroke-width="1.5"/>
<line x1="-9" y1="-20" x2="-1" y2="-20" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="-10" x2="-4" y2="-10" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="0" x2="-1" y2="0" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="10" x2="-4" y2="10" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="20" x2="-1" y2="20" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="30" x2="-4" y2="30" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="40" x2="-1" y2="40" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="50" x2="-4" y2="50" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="60" x2="-1" y2="60" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="70" x2="-4" y2="70" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<line x1="-9" y1="80" x2="-1" y2="80" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/></g>
<g transform="translate(125,120) rotate(-30)"><line x1="0" y1="-80" x2="0" y2="80" stroke="#b91c1c" stroke-width="1.2" stroke-linecap="round"/></g>
<g transform="translate(125,120) rotate(60)"><line x1="0" y1="-80" x2="0" y2="80" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="5 3" stroke-linecap="round"/></g>
<circle cx="125" cy="120" r="3" fill="#b91c1c" stroke="none" stroke-width="1.5"/>
<text x="125" y="212" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="125" dy="0">V on the rim, scribe along the rule;</tspan><tspan x="125" dy="11.875">turn 90°, scribe again: they cross at centre</tspan></text>
<text x="375" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Surface gauge on V-blocks</text>
<rect x="280" y="190" width="190" height="10" fill="#b9c4d2" stroke="#1a2233" stroke-width="1.5"/>
<path d="M300,190 L300,150 L330,150 L356,176 L382,150 L412,150 L412,190 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="356" cy="128" r="44" fill="#cbd5e1" stroke="#1a2233" stroke-width="2"/>
<rect x="430" y="178" width="40" height="12" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="2"/>
<line x1="450" y1="178" x2="450" y2="110" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<line x1="450" y1="128" x2="402" y2="128" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="450" cy="128" r="4" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(356,132) rotate(0)"><line x1="-46" y1="0" x2="46" y2="0" stroke="#b91c1c" stroke-width="1.2" stroke-linecap="round"/></g>
<g transform="translate(356,132) rotate(120)"><line x1="-46" y1="0" x2="46" y2="0" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="5 3" stroke-linecap="round"/></g>
<g transform="translate(356,132) rotate(240)"><line x1="-46" y1="0" x2="46" y2="0" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="5 3" stroke-linecap="round"/></g>
<text x="375" y="212" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="375" dy="0">scriber at half height, turn the bar 120°,</tspan><tspan x="375" dy="11.875">twice: the small triangle is the centre</tspan></text>
<text x="250" y="252" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Punch the centre lightly, then check it with dividers before drilling.</text>
</svg>