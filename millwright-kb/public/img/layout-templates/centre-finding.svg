<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Finding centre of round stock</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="120" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Centre head</text>
<circle cx="120" cy="140" r="60" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="77.57359312880715" y1="97.57359312880715" x2="162.42640687119285" y2="182.42640687119285" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="162.42640687119285" y1="97.57359312880715" x2="77.57359312880715" y2="182.42640687119285" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<path d="M120,82 L56,50 L120,50 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
<circle cx="120" cy="140" r="3" fill="#b91c1c" stroke="none" stroke-width="1.5"/>
<text x="120" y="218" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="120" dy="0">head on the rim: scribe,</tspan><tspan x="120" dy="12.5">turn 90°, scribe again</tspan></text>
<text x="370" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Surface gauge on V-blocks</text>
<path d="M300,200 L440,200 L440,170 L370,110 L300,170 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="370" cy="130" r="45" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="325" y1="130" x2="415" y2="130" stroke="#b91c1c" stroke-width="1.2" stroke-linecap="round"/>
<line x1="392.5" y1="91.02885682970026" x2="347.5" y2="168.97114317029974" stroke="#b91c1c" stroke-width="1.2" stroke-linecap="round"/>
<line x1="392.5" y1="168.97114317029974" x2="347.5" y2="91.02885682970026" stroke="#b91c1c" stroke-width="1.2" stroke-linecap="round"/>
<line x1="470" y1="130" x2="300" y2="130" stroke="#0b5fa5" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="370" y="218" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="370" dy="0">scribe at half height, turn 120°,</tspan><tspan x="370" dy="12.5">twice: centre = the small triangle</tspan></text>
</svg>