<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Shim stacking rules</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<text x="120" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#166534">Right</text>
<text x="370" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#b91c1c">Wrong</text>
<rect x="40" y="150" width="170" height="14" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="80" y="60" width="90" height="60" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="125" y1="60" x2="125" y2="175" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<rect x="290" y="150" width="170" height="14" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="330" y="60" width="90" height="60" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="375" y1="60" x2="375" y2="175" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<rect x="80" y="136" width="90" height="10" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="80" y="128" width="90" height="8" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="80" y="123" width="90" height="5" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="80" y="120" width="90" height="3" fill="#94a3b8" stroke="#1a2233" stroke-width="1.5"/>
<text x="125" y="190" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="125" dy="0">0.125 + 0.050 + 0.020 + 0.005</tspan><tspan x="125" dy="12.5">four shims, thick to thin, full contact</tspan></text>
<rect x="330" y="143" width="80" height="3" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="336" y="139.8" width="74" height="3" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="330" y="136.6" width="68" height="3" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="336" y="133.4" width="80" height="3" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="330" y="130.2" width="74" height="3" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="336" y="127" width="68" height="3" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="330" y="123.8" width="80" height="3" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="336" y="120.6" width="74" height="3" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="375" y="190" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="375" dy="0">eight thin shims, misaligned, rust between:</tspan><tspan x="375" dy="12.5">they squash and the foot goes soft</tspan></text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Burrs off, shims clean and dry, slot centred on the bolt, no overhang.</text>
</svg>