<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Cone development</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="110" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Elevation</text>
<path d="M40,200 L180,200 L140,90 L80,90 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="40" y1="200" x2="110" y2="8" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="180" y1="200" x2="110" y2="8" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="40" y1="215" x2="180" y2="215" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="110" y="211" font-size="11" text-anchor="middle" fill="#1a2233">base dia. D</text>
<line x1="80" y1="80" x2="140" y2="80" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="110" y="76" font-size="11" text-anchor="middle" fill="#1a2233">top dia. d</text>
<line x1="200" y1="90" x2="200" y2="200" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="206" y="149" font-size="11" text-anchor="start" fill="#1a2233">h</text>
<line x1="180" y1="200" x2="140" y2="90" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="150" y="150" font-size="12" text-anchor="end" font-weight="700" fill="#b91c1c">S</text>
<text x="370" y="24" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Pattern (sector)</text>
<path d="M370,60 L285.73511125691243,130.70663706551932 A110,110 0 0 0 454.26488874308757,130.70663706551932 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M335.528000059646,88.92544243589427 A45,45 0 0 0 404.471999940354,88.92544243589427" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="370" y="200" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="370" dy="0">outer radius = S (full cone slant)</tspan><tspan x="370" dy="13.125">inner radius = S − slant of the frustum</tspan><tspan x="370" dy="13.125">sector angle = 360 × (D ÷ 2) ÷ S</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Add a seam lap; check the pattern by rolling paper first.</text>
</svg>