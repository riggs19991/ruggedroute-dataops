<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Lube point tags</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="200" fill="#ffffff"/>
<circle cx="70" cy="70" r="18" fill="#b91c1c" stroke="none" stroke-width="1.5"/>
<text x="70" y="112" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">red circle</text>
<text x="70" y="128" font-size="10" text-anchor="middle" fill="#5b6577">lithium complex EP2</text>
<rect x="169" y="54" width="32" height="32" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<text x="185" y="112" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">blue square</text>
<text x="185" y="128" font-size="10" text-anchor="middle" fill="#5b6577">polyurea (motors)</text>
<path d="M300,52 L318,86 L282,86 Z" fill="#166534" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="112" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">green triangle</text>
<text x="300" y="128" font-size="10" text-anchor="middle" fill="#5b6577">ISO VG 220 gear oil</text>
<path d="M415,50 L435,70 L415,90 L395,70 Z" fill="#f59e0b" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="415" y="112" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">yellow diamond</text>
<text x="415" y="128" font-size="10" text-anchor="middle" fill="#5b6577">food-grade H1</text>
<text x="250" y="160" font-size="10.5" text-anchor="middle" fill="#5b6577">tag reads: point ID · lubricant · quantity (g or strokes) · interval · last done</text>
<text x="250" y="192" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Grease guns labelled to match; one gun per grease.</text>
</svg>