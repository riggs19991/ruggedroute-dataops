<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Regrease quantity</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="220" fill="#ffffff"/>
<rect x="60" y="60" width="80" height="110" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<rect x="60" y="95" width="80" height="40" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="60" y="60" width="80" height="110" fill="none" stroke="#1a2233" stroke-width="1.5"/>
<line x1="150" y1="60" x2="150" y2="170" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="156" y="119" font-size="11" text-anchor="start" fill="#1a2233">D (OD)</text>
<line x1="60" y1="185" x2="140" y2="185" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="100" y="181" font-size="11" text-anchor="middle" fill="#1a2233">B (width)</text>
<text x="215" y="60" font-size="13" text-anchor="start" font-weight="700" fill="#1a2233">G = 0.005 × D × B  (grams, mm)</text>
<text x="215" y="84" font-size="13" text-anchor="start" font-weight="700" fill="#1a2233">G = 0.114 × D × B  (ounces, inches)</text>
<text x="215" y="115" font-size="10.5" text-anchor="start" fill="#5b6577"><tspan x="215" dy="0">example: 6310 (D = 110 mm, B = 27 mm)</tspan><tspan x="215" dy="13.125">G = 0.005 × 110 × 27 = 15 g ≈ 10-12 gun strokes</tspan></text>
<text x="215" y="160" font-size="10" text-anchor="start" fill="#5b6577"><tspan x="215" dy="0">weigh 10 strokes of your gun once to learn</tspan><tspan x="215" dy="12.5">the grams per stroke; relief plug out on motors</tspan></text>
<text x="250" y="212" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Over-greasing kills more motor bearings than under-greasing.</text>
</svg>