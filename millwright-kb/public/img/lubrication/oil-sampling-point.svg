<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Oil sampling point</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="220" fill="#ffffff"/>
<rect x="120" y="50" width="260" height="130" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="8"/>
<rect x="130" y="100" width="240" height="75" fill="#fff4d6" stroke="none" stroke-width="1.5"/>
<circle cx="250" cy="110" r="30" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4 4"/>
<rect x="140" y="170" width="20" height="14" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="150" y="200" font-size="10" text-anchor="middle" fill="#b91c1c">drain: sludge and water</text>
<line x1="150" y1="168" x2="150" y2="150" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<rect x="330" y="120" width="40" height="8" fill="#0b5fa5" stroke="#1a2233" stroke-width="1.5"/>
<line x1="370" y1="124" x2="420" y2="124" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round"/>
<circle cx="432" cy="124" r="8" fill="#ffffff" stroke="#0b5fa5" stroke-width="1.5"/>
<text x="435" y="150" font-size="10" text-anchor="middle" fill="#0b5fa5"><tspan x="435" dy="0">sample valve:</tspan><tspan x="435" dy="12.5">mid-level, live</tspan><tspan x="435" dy="12.5">zone, flush first</tspan></text>
<text x="250" y="40" font-size="10" text-anchor="middle" fill="#5b6577">gearbox or reservoir</text>
<text x="250" y="212" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Clean bottle, label with asset, hours, date; send the same day.</text>
</svg>