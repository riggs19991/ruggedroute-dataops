<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Shaft torsion and key shear</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="220" fill="#ffffff"/>
<rect x="40" y="90" width="240" height="40" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<path d="M295,84.01923788646684 A30,30 0 0 1 295,135.98076211353316" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="320" y="114" font-size="14" text-anchor="start" font-weight="700" fill="#b91c1c">T</text>
<line x1="30" y1="90" x2="30" y2="130" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="24" y="114" font-size="11" text-anchor="end" fill="#1a2233">d</text>
<text x="160" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">τ = 16 T ÷ (π d³)</text>
<text x="160" y="160" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="160" dy="0">T in in-lb, d in inches, τ in psi;</tspan><tspan x="160" dy="12.5">keep τ under about 6,000-8,000 psi for 1045 shafting</tspan></text>
<rect x="380" y="80" width="80" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="410" y="70" width="20" height="20" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<line x1="400" y1="60" x2="440" y2="60" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="420" y="52" font-size="11" text-anchor="middle" font-weight="700" fill="#b91c1c">F = 2 T ÷ d</text>
<text x="420" y="160" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="420" dy="0">key shear area = W × L;</tspan><tspan x="420" dy="12.5">τ = F ÷ (W × L)</tspan></text>
<text x="250" y="212" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Double the diameter: eight times the torque capacity.</text>
</svg>