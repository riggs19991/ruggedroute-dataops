<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Right triangle and offset</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<path d="M60,180 L260,180 L260,60 Z" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="246" y="166" width="14" height="14" fill="none" stroke="#0b5fa5" stroke-width="1"/>
<path d="M94.2866920280845,159.39847700359783 A40,40 0 0 1 100,180" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="110.10878356684839" y="170.10360444393064" font-size="12" text-anchor="middle" fill="#0b5fa5">θ</text>
<text x="160" y="198" font-size="11" text-anchor="middle" fill="#1a2233">adjacent (run)</text>
<text x="268" y="124" font-size="11" text-anchor="start" fill="#1a2233"><tspan x="268" dy="0">opposite</tspan><tspan x="268" dy="13.75">(rise)</tspan></text>
<text x="140" y="108" font-size="11" text-anchor="middle" fill="#1a2233" transform="rotate(-31 140 108)">hypotenuse (travel)</text>
<text x="400" y="70" font-size="11" text-anchor="middle" fill="#1a2233"><tspan x="400" dy="0">sin θ = opp ÷ hyp</tspan><tspan x="400" dy="13.75">cos θ = adj ÷ hyp</tspan><tspan x="400" dy="13.75">tan θ = opp ÷ adj</tspan><tspan x="400" dy="13.75">hyp² = adj² + opp²</tspan></text>
<text x="400" y="160" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="400" dy="0">45° offset: travel = offset × 1.414</tspan><tspan x="400" dy="12.5">30° offset: travel = offset × 2.0</tspan><tspan x="400" dy="12.5">22.5°: × 2.613  ·  60°: × 1.155</tspan></text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Offset 12 in at 45°: travel 16.97 in, run 12 in.</text>
</svg>