<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 170" width="500" height="170" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Task workflow</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="170" fill="#ffffff"/>
<rect x="20" y="40" width="108" height="60" fill="#fee2e2" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="74" y="67.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="74" dy="0">1 Safety</tspan><tspan x="74" dy="11.875">lockout, permit, PPE</tspan></text>
<rect x="138" y="40" width="108" height="60" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="192" y="67.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="192" dy="0">2 Setup data</tspan><tspan x="192" dy="11.875">charts, torque</tspan></text>
<rect x="256" y="40" width="108" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="310" y="67.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="310" dy="0">3 Procedure</tspan><tspan x="310" dy="11.875">step by step</tspan></text>
<rect x="374" y="40" width="108" height="60" fill="#dcfce7" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="428" y="67.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="428" dy="0">4 Check + record</tspan><tspan x="428" dy="11.875">readings, W/O</tspan></text>
<line x1="128" y1="70" x2="138" y2="70" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="246" y1="70" x2="256" y2="70" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="364" y1="70" x2="374" y2="70" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="250" y="162" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">The task index lists the articles for each step of the common jobs.</text>
</svg>