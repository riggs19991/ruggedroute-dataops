<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Tramming and keyway</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Tramming the head</text>
<rect x="30" y="170" width="200" height="16" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="100" y="60" width="60" height="60" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<line x1="130" y1="120" x2="130" y2="150" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<path d="M130,150 L180,150 L180,168" fill="none" stroke="#1a2233" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="180" cy="158" r="8" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<path d="M80,170 A50,50 0 0 1 180,170" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="130" y="205" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">sweep 180° front-back and side-side;</tspan><tspan x="130" dy="11.875">adjust the head until the reading repeats</tspan></text>
<text x="370" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Shaft keyway</text>
<circle cx="370" cy="120" r="55" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="352" y="65" width="36" height="30" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="352" y1="58" x2="388" y2="58" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="370" y="54" font-size="10" text-anchor="middle" fill="#1a2233">W</text>
<line x1="400" y1="65" x2="400" y2="95" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="406" y="84" font-size="10" text-anchor="start" fill="#1a2233">W/2 + a hair</text>
<path d="M370,20 L376,30 L364,30 Z" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="370" y="205" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="370" dy="0">edge-find both sides, centre = half the shaft</tspan><tspan x="370" dy="11.875">diameter; cut in 2-3 passes; deburr</tspan></text>
</svg>