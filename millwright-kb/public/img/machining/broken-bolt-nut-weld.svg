<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Broken bolt removal</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<rect x="40" y="120" width="420" height="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="120" y="120" width="30" height="80" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="120" y="110" width="30" height="14" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<path d="M100,70 L170,70 L170,112 L100,112 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="120" y="60" width="30" height="52" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="120" y="70" width="30" height="42" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<path d="M122,80 q13,-14 26,0 q-13,10 -26,0" fill="#f8b878" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="135" y="52" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="135" dy="0">MIG or 7018 fill</tspan><tspan x="135" dy="12.5">inside the nut</tspan></text>
<rect x="280" y="130" width="40" height="70" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<path d="M300,40 L312,46 L300,130 L288,46 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="30" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="300" dy="0">left-hand drill:</tspan><tspan x="300" dy="12.5">cuts and unscrews</tspan></text>
<path d="M271.8092213764227,89.73939570022993 A30,30 0 0 1 328.1907786235773,89.73939570022995" fill="none" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="420" y="80" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="420" dy="0">penetrant, heat the</tspan><tspan x="420" dy="12.5">boss (not the bolt),</tspan><tspan x="420" dy="12.5">shock it, then turn</tspan></text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Extractors snap: use them last, and only in a straight, centred hole.</text>
</svg>