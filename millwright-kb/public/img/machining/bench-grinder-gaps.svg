<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 255" width="500" height="255" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Bench grinder gaps</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="255" fill="#ffffff"/>
<circle cx="200" cy="120" r="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="200" cy="120" r="15" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<path d="M247.5,202.27241335952166 A95,95 0 1 1 282.27241335952164,72.49999999999996" fill="none" stroke="#1a2233" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="280" y="116" width="70" height="10" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<line x1="280" y1="116" x2="280" y2="100" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="292" y="100" font-size="10" text-anchor="start" fill="#b91c1c">1/8 in max</text>
<path d="M200,40 L260,40 L262,52" fill="none" stroke="#64748b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="262" y1="52" x2="262" y2="62" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="272" y="60" font-size="10" text-anchor="start" fill="#b91c1c">1/4 in max</text>
<text x="250" y="242" font-size="10" text-anchor="middle" fill="#5b6577">readjust the rest and tongue guard as the wheel wears; ring-test wheels first</text>
<text x="410" y="150" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="410" dy="0">exposure: 90° max</tspan><tspan x="410" dy="12.5">(65° above the</tspan><tspan x="410" dy="12.5">horizontal)</tspan></text>
