<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>V-belt wear patterns</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="220" fill="#ffffff"/>
<text x="60" y="40" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">Glazed sidewalls</text>
<path d="M38,74 L82,74 L74,106 L46,106 Z" fill="#8a8a8a" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="40" y1="78" x2="47" y2="102" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
<text x="60" y="140" font-size="9.5" text-anchor="middle" fill="#5b6577">slipping: tension</text>
<text x="155" y="40" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">Bottoming</text>
<path d="M125,70 L185,70 L185,112 L125,112 Z" fill="#64748b" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M135,84 L175,84 L167,110 L143,110 Z" fill="#333" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="155" y="140" font-size="9.5" text-anchor="middle" fill="#5b6577">worn groove: sheave</text>
<text x="250" y="40" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">One side worn</text>
<path d="M228,74 L272,74 L264,106 L244,106 Z" fill="#333" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250" y="140" font-size="9.5" text-anchor="middle" fill="#5b6577">misalignment</text>
<text x="345" y="40" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">Cracked base</text>
<path d="M323,74 L367,74 L359,106 L331,106 Z" fill="#333" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="337" y1="106" x2="337" y2="96" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="345" y1="106" x2="345" y2="96" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="353" y1="106" x2="353" y2="96" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<text x="345" y="140" font-size="9.5" text-anchor="middle" fill="#5b6577">heat, small sheaves</text>
<text x="440" y="40" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1a2233">Turned over</text>
<g transform="translate(440,90) rotate(180)"><path d="M-22,-16 L22,-16 L14,16 L-14,16 Z" fill="#333" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="440" y="140" font-size="9.5" text-anchor="middle" fill="#5b6577">loose, pried on</text>
<text x="250" y="212" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Check the sheaves with a groove gauge before fitting the new set.</text>
</svg>