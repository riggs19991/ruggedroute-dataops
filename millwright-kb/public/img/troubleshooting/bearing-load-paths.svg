<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Bearing load paths</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="220" fill="#ffffff"/>
<text x="65" y="30" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">Normal</text>
<rect x="20" y="60" width="90" height="70" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="20" y="70" width="90" height="50" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
<rect x="25" y="88" width="80" height="16" fill="#0b5fa5" stroke="none" stroke-width="1.5" opacity="0.7"/>
<text x="65" y="150" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="65" dy="0">centred band, about</tspan><tspan x="65" dy="11.875">1/3 of the race width</tspan></text>
<text x="187" y="30" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">Misaligned</text>
<rect x="142" y="60" width="90" height="70" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="142" y="70" width="90" height="50" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
<path d="M147,100 L227,78 L227,94 L147,116 Z" fill="#b91c1c" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
<text x="187" y="150" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="187" dy="0">diagonal band on the</tspan><tspan x="187" dy="11.875">outer race, opposite</tspan><tspan x="187" dy="11.875">on the inner</tspan></text>
<text x="309" y="30" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">Preloaded</text>
<rect x="264" y="60" width="90" height="70" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="264" y="70" width="90" height="50" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
<rect x="269" y="70" width="80" height="50" fill="#b45309" stroke="none" stroke-width="1.5" opacity="0.6"/>
<text x="309" y="150" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="309" dy="0">full 360° full-width</tspan><tspan x="309" dy="11.875">band on both races</tspan></text>
<text x="431" y="30" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">Axial load</text>
<rect x="386" y="60" width="90" height="70" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="386" y="70" width="90" height="50" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
<rect x="391" y="72" width="80" height="16" fill="#166534" stroke="none" stroke-width="1.5" opacity="0.7"/>
<text x="431" y="150" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="431" dy="0">band pushed to one</tspan><tspan x="431" dy="11.875">side of the race</tspan></text>
<text x="250" y="212" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Race unrolled: the band shows where the load ran; then look for damage.</text>
</svg>