<path d="M350,178 L390,178 L384,152 L356,152 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="220" y="80" width="60" height="110" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<rect x="40" y="76" width="22" height="118" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="62" y="76" width="6" height="118" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
