<text x="40" y="250" font-size="11" text-anchor="start" fill="#1a2233">rotate the shaft while pushing to seat the rollers; check both directions</text>
<text x="250" y="262" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Thick shims mid-pack, thin outside; keep each pack with its cap.</text>
