<line x1="383" y1="36" x2="415" y2="80" stroke="#b45309" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="380" y="40" font-size="11" text-anchor="end" fill="#b45309">shim pack</text>
<rect x="446" y="128" width="22" height="14" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="440" y1="135" x2="446" y2="135" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<line x1="457" y1="128" x2="457" y2="112" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<text x="462" y="122" font-size="9" text-anchor="middle" fill="#5b6577">indicator</text>
<line x1="392" y1="102" x2="410" y2="102" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
