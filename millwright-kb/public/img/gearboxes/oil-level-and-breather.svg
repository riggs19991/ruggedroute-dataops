<circle cx="210" cy="34" r="8" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="140" y="188" width="20" height="14" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="250" cy="120" r="40" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4 4"/>
<circle cx="250" cy="120" r="6" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="300" cy="110" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="114" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="210" cy="20" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="210" y="24" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="150" cy="215" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="150" y="219" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="250" cy="170" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="250" y="174" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="401" cy="56" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="401" y="60" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="416" y="60" font-size="10" text-anchor="start" fill="#1a2233"><tspan x="416" dy="0">sight glass:</tspan><tspan x="416" dy="12.5">level at line</tspan></text>
<circle cx="401" cy="83.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="401" y="87.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="416" y="87.5" font-size="10" text-anchor="start" fill="#1a2233"><tspan x="416" dy="0">breather:</tspan><tspan x="416" dy="12.5">clean, open</tspan></text>
<circle cx="401" cy="111" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="401" y="115" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="416" y="115" font-size="10" text-anchor="start" fill="#1a2233"><tspan x="416" dy="0">magnetic plug:</tspan><tspan x="416" dy="12.5">check swarf</tspan></text>
<circle cx="401" cy="138.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="401" y="142.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="416" y="142.5" font-size="10" text-anchor="start" fill="#1a2233"><tspan x="416" dy="0">gear dips 1-2</tspan><tspan x="416" dy="12.5">teeth in oil</tspan></text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Overfilled = churning heat and leaks; underfilled = starved bearings.</text>
