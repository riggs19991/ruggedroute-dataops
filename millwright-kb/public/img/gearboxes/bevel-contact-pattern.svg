<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Bevel contact pattern</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="250" y="22" font-size="11" text-anchor="middle" fill="#5b6577">Marking compound on the gear teeth, pinion rolled through under light load</text>
<rect x="30" y="40" width="120" height="50" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="38" y="52" font-size="9" text-anchor="start" fill="#5b6577">toe</text>
<text x="142" y="52" font-size="9" text-anchor="end" fill="#5b6577">heel</text>
<rect x="54" y="54" width="70" height="22" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5" rx="6" opacity="0.9"/>
<text x="90" y="106" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">correct</text>
<text x="90" y="120" font-size="10" text-anchor="middle" fill="#0b5fa5">centred, 60 to 80% of face</text>
<rect x="190" y="40" width="120" height="50" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="198" y="52" font-size="9" text-anchor="start" fill="#5b6577">toe</text>
<text x="302" y="52" font-size="9" text-anchor="end" fill="#5b6577">heel</text>
<rect x="194" y="54" width="60" height="22" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5" rx="6" opacity="0.9"/>
<text x="250" y="106" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">toward toe</text>
<text x="250" y="120" font-size="10" text-anchor="middle" fill="#0b5fa5">move gear away</text>
<rect x="350" y="40" width="120" height="50" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="358" y="52" font-size="9" text-anchor="start" fill="#5b6577">toe</text>
<text x="462" y="52" font-size="9" text-anchor="end" fill="#5b6577">heel</text>
<rect x="406" y="54" width="60" height="22" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5" rx="6" opacity="0.9"/>
<text x="410" y="106" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">toward heel</text>
<text x="410" y="120" font-size="10" text-anchor="middle" fill="#0b5fa5">move gear in</text>
<rect x="30" y="150" width="120" height="50" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="38" y="162" font-size="9" text-anchor="start" fill="#5b6577">toe</text>
<text x="142" y="162" font-size="9" text-anchor="end" fill="#5b6577">heel</text>
<rect x="54" y="154" width="70" height="18" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5" rx="6" opacity="0.9"/>
<text x="90" y="216" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">high (tip)</text>
<text x="90" y="230" font-size="10" text-anchor="middle" fill="#0b5fa5">pinion in (deeper)</text>
<rect x="190" y="150" width="120" height="50" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="198" y="162" font-size="9" text-anchor="start" fill="#5b6577">toe</text>
<text x="302" y="162" font-size="9" text-anchor="end" fill="#5b6577">heel</text>
<rect x="214" y="178" width="70" height="18" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5" rx="6" opacity="0.9"/>
<text x="250" y="216" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">low (root)</text>
<text x="250" y="230" font-size="10" text-anchor="middle" fill="#0b5fa5">pinion out</text>
<rect x="350" y="150" width="120" height="50" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="358" y="162" font-size="9" text-anchor="start" fill="#5b6577">toe</text>
<text x="462" y="162" font-size="9" text-anchor="end" fill="#5b6577">heel</text>
<rect x="360" y="158" width="100" height="34" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5" rx="6" opacity="0.9"/>
<text x="410" y="216" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">crossed (bias)</text>
<text x="410" y="230" font-size="10" text-anchor="middle" fill="#0b5fa5">check housing bores</text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Each move changes backlash and preload: re-check both after every shim.</text>
</svg>