<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Belt tracking rules</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="250" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Top view of the carrying side</text>
<rect x="60" y="60" width="380" height="90" fill="#fff4d6" stroke="#b45309" stroke-width="1.5"/>
<line x1="60" y1="105" x2="440" y2="105" stroke="#5b6577" stroke-width="1" stroke-dasharray="6 4" stroke-linecap="round"/>
<line x1="200" y1="40" x2="300" y2="40" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="250" y="34" font-size="10" text-anchor="middle" fill="#5b6577">belt travel</text>
<rect x="116" y="55" width="8" height="100" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="196" y="55" width="8" height="100" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="356" y="55" width="8" height="100" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(280,105) rotate(8)"><rect x="-4" y="-50" width="8" height="100" fill="#b91c1c" stroke="#1a2233" stroke-width="1.5"/></g>
<line x1="284" y1="150" x2="330" y2="172" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="335" y="170" font-size="10" text-anchor="start" fill="#b91c1c"><tspan x="335" dy="0">idler end moved forward</tspan><tspan x="335" dy="12.5">on the side the belt</tspan><tspan x="335" dy="12.5">runs toward</tspan></text>
<path d="M60,105 Q200,105 300,80 Q380,64 440,70" fill="none" stroke="#0b5fa5" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="60" y="172" font-size="10" text-anchor="start" fill="#0b5fa5">belt steers back to centre</text>
<text x="250" y="205" font-size="10" text-anchor="middle" fill="#5b6577">rule 1: an idler end moved forward (in the travel direction) steers the belt away</text>
<text x="250" y="222" font-size="10" text-anchor="middle" fill="#5b6577">rule 2: fix the cause first: square pulleys, level structure, build-up, loading off-centre</text>
<text x="250" y="239" font-size="10" text-anchor="middle" fill="#5b6577">adjust one idler a little, run 5 minutes, look again; work from tail to head</text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Never adjust more than 1/8 in at a time; return idlers steer the return side.</text>
</svg>