<path d="M50,88 L100,100 L180,100 L230,88" fill="none" stroke="#b45309" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M200,120 A40,40 0 0 1 207.2339182284403,97.05694254595817" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="190.4067185610922" y="108.3632984257778" font-size="12" text-anchor="middle" fill="#0b5fa5"></text>
<text x="200" y="150" font-size="10" text-anchor="start" fill="#0b5fa5">35° trough</text>
<text x="140" y="175" font-size="10" text-anchor="middle" fill="#5b6577">return idler: single flat roll under the return belt</text>
