<g transform="translate(184,152) rotate(-35)"><rect x="0" y="-10" width="74" height="20" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="10"/></g>
<g transform="translate(96,152) rotate(35)"><rect x="-74" y="-10" width="74" height="20" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="10"/></g>
