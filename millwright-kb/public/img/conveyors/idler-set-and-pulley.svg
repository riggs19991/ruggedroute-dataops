<circle cx="380" cy="120" r="60" fill="none" stroke="#333" stroke-width="8"/>
<line x1="320" y1="120" x2="440" y2="120" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="337.57359312880715" y1="77.57359312880715" x2="422.42640687119285" y2="162.42640687119285" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="380" y1="60" x2="380" y2="180" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<line x1="422.42640687119285" y1="77.57359312880715" x2="337.57359312880715" y2="162.42640687119285" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round"/>
<circle cx="380" cy="120" r="10" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="380" y="200" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="380" dy="0">rubber or ceramic lagging; crowned tail</tspan><tspan x="380" dy="11.875">pulley for tracking; worn smooth = slip</tspan></text>
