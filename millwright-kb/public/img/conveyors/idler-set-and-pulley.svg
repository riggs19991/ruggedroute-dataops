<text x="140" y="204" font-size="9.5" text-anchor="middle" fill="#5b6577">centre roll + two wing rolls; the belt troughs</text>
<text x="140" y="232" font-size="9.5" text-anchor="middle" fill="#5b6577">return idler: single flat roll under the return belt</text>
