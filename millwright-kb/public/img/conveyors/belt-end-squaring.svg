<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Belt end squaring</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<rect x="40" y="60" width="420" height="120" fill="#fff4d6" stroke="#b45309" stroke-width="1.5"/>
<line x1="40" y1="120" x2="460" y2="120" stroke="#0b5fa5" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
<text x="250" y="112" font-size="10" text-anchor="middle" fill="#0b5fa5">centreline from 5 width measurements</text>
<line x1="100" y1="60" x2="100" y2="180" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<circle cx="100" cy="120" r="2.5" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<line x1="180" y1="60" x2="180" y2="180" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<circle cx="180" cy="120" r="2.5" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<line x1="260" y1="60" x2="260" y2="180" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<circle cx="260" cy="120" r="2.5" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<line x1="340" y1="60" x2="340" y2="180" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<circle cx="340" cy="120" r="2.5" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<line x1="420" y1="60" x2="420" y2="180" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<circle cx="420" cy="120" r="2.5" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<line x1="400" y1="58" x2="400" y2="182" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="400" y="200" font-size="10" text-anchor="middle" fill="#b91c1c">cut line square to the centreline</text>
<rect x="388" y="100" width="60" height="40" fill="none" stroke="#1a2233" stroke-width="1.5"/>
<text x="418" y="152" font-size="9" text-anchor="middle" fill="#5b6577">square</text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Edges are never straight: a splice squared from an edge mistracks forever.</text>
</svg>