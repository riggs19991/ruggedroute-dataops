<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Conveyor nip points</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<circle cx="80" cy="120" r="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="420" cy="120" r="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="80" y1="80" x2="420" y2="80" stroke="#1a2233" stroke-width="6" stroke-linecap="round"/>
<line x1="80" y1="160" x2="420" y2="160" stroke="#1a2233" stroke-width="6" stroke-linecap="round"/>
<circle cx="180" cy="168" r="8" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="250" cy="168" r="8" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="320" cy="168" r="8" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="140" cy="150" r="12" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="68" cy="82" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="432" cy="82" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="68" cy="158" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="432" cy="158" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="140" cy="162" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="180" cy="162" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="250" cy="162" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="320" cy="162" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<text x="80" y="200" font-size="10" text-anchor="middle" fill="#5b6577">tail pulley</text>
<text x="420" y="200" font-size="10" text-anchor="middle" fill="#5b6577">head pulley</text>
<text x="140" y="214" font-size="10" text-anchor="middle" fill="#5b6577">snub</text>
<text x="250" y="214" font-size="10" text-anchor="middle" fill="#5b6577">return idlers</text>
<line x1="200" y1="60" x2="300" y2="60" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="250" y="52" font-size="10" text-anchor="middle" fill="#5b6577">travel</text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Red = in-running nip: guard it or fence it; pull cord along the whole run.</text>
</svg>