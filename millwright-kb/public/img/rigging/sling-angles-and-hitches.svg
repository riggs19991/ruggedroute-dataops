<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Sling angles and hitches</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="130" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Sling angle (from horizontal)</text>
<rect x="40" y="150" width="180" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="70" y1="150" x2="130" y2="46.07695154586739" stroke="#166534" stroke-width="2" stroke-linecap="round"/>
<line x1="190" y1="150" x2="130" y2="46.07695154586739" stroke="#166534" stroke-width="2" stroke-linecap="round"/>
<text x="196" y="50.07695154586739" font-size="10" text-anchor="start" fill="#166534">60°: × 1.15</text>
<line x1="70" y1="150" x2="130" y2="90" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
<line x1="190" y1="150" x2="130" y2="90" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
<text x="196" y="94" font-size="10" text-anchor="start" fill="#b45309">45°: × 1.41</text>
<line x1="70" y1="150" x2="130" y2="115.35898384862246" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<line x1="190" y1="150" x2="130" y2="115.35898384862246" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="196" y="119.35898384862246" font-size="10" text-anchor="start" fill="#b91c1c">30°: × 2.00</text>
<line x1="40" y1="150" x2="220" y2="150" stroke="#5b6577" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="130" y="200" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">leg tension = (load ÷ legs) × factor</tspan><tspan x="130" dy="12.5">2,000 lb on two legs at 30° = 2,000 lb per leg</tspan></text>
<text x="370" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Hitches</text>
<line x1="300" y1="50" x2="300" y2="110" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<rect x="280" y="110" width="40" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="300" y="170" font-size="10" text-anchor="middle" font-weight="600" fill="#1a2233"><tspan x="300" dy="0">Vertical</tspan><tspan x="300" dy="12.5">100%</tspan></text>
<line x1="376" y1="50" x2="376" y2="100" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<path d="M376,100 L348,112 L348,140 L392,140 L392,112 L376,100" fill="none" stroke="#1a2233" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="350" y="110" width="40" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="370" y="170" font-size="10" text-anchor="middle" font-weight="600" fill="#1a2233"><tspan x="370" dy="0">Choker</tspan><tspan x="370" dy="12.5">80%</tspan></text>
<line x1="426" y1="50" x2="426" y2="140" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<line x1="454" y1="50" x2="454" y2="140" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<line x1="426" y1="140" x2="454" y2="140" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<rect x="420" y="110" width="40" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="440" y="170" font-size="10" text-anchor="middle" font-weight="600" fill="#1a2233"><tspan x="440" dy="0">Basket</tspan><tspan x="440" dy="12.5">200%</tspan></text>
<text x="370" y="215" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="370" dy="0">choker angle under 120° derates further;</tspan><tspan x="370" dy="11.875">basket needs D/d ≥ 25 for full rating</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Nothing is rated below 30°. Read the tag for the hitch you are using.</text>
</svg>