<circle cx="29" cy="115.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="119.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="44" y="119.5" font-size="10" text-anchor="start" fill="#1a2233"><tspan x="44" dy="0">hand chain and gears</tspan><tspan x="44" dy="12.5">run free both ways</tspan></text>
<circle cx="29" cy="142" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="146" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text><text x="44" y="146" font-size="10" text-anchor="start" fill="#1a2233"><tspan x="44" dy="0">bottom hook throat:</tspan><tspan x="44" dy="12.5">scrap if opened &gt; 5%</tspan></text>
<circle cx="29" cy="168.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="172.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text><text x="44" y="172.5" font-size="10" text-anchor="start" fill="#1a2233"><tspan x="44" dy="0">brake: lift, stop,</tspan><tspan x="44" dy="12.5">no creep</tspan></text>
<text x="250" y="312" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Two-fall hoists: check the bottom block is not capsized (chain twisted).</text>
