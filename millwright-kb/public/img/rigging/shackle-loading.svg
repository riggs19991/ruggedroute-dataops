<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Shackle loading</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<path d="M65,140 L65,110 A25,25 0 0 1 115,110 L115,140" fill="none" stroke="#64748b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="58" y="136" width="64" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(90,90) rotate(0)"><line x1="0" y1="0" x2="0" y2="-70" stroke="#166534" stroke-width="4" stroke-linecap="round"/></g>
<text x="90" y="190" font-size="10.5" text-anchor="middle" font-weight="600" fill="#166534">Right</text>
<path d="M225,140 L225,110 A25,25 0 0 1 275,110 L275,140" fill="none" stroke="#64748b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="218" y="136" width="64" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(250,90) rotate(-45)"><line x1="0" y1="0" x2="0" y2="-70" stroke="#b45309" stroke-width="4" stroke-linecap="round"/></g>
<text x="250" y="190" font-size="10.5" text-anchor="middle" font-weight="600" fill="#b45309">Side load 45°: 70%</text>
<path d="M385,140 L385,110 A25,25 0 0 1 435,110 L435,140" fill="none" stroke="#64748b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="378" y="136" width="64" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(410,90) rotate(-90)"><line x1="0" y1="0" x2="0" y2="-70" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/></g>
<text x="410" y="190" font-size="10.5" text-anchor="middle" font-weight="600" fill="#b91c1c">Side load 90°: 50%</text>
<text x="250" y="40" font-size="10" text-anchor="middle" fill="#5b6577">sling bears on the bow, load pulls along the shackle axis</text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">WLL forged on the bow; two slings in one bow: 120° included angle max.</text>
