<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Box crib</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<text x="110" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">2 × 2 crib (top view)</text>
<rect x="40" y="50" width="140" height="24" fill="#c9a46b" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="40" y="150" width="140" height="24" fill="#c9a46b" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="50" y="40" width="24" height="140" fill="#e8d3a3" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="150" y="40" width="24" height="140" fill="#e8d3a3" stroke="#8b5a2b" stroke-width="1.5"/>
<text x="110" y="200" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="110" dy="0">4 crossing points</tspan><tspan x="110" dy="12.5">4x4: 24,000 lb · 6x6: 60,000 lb</tspan></text>
<text x="300" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">3 × 3 crib</text>
<rect x="230" y="50" width="140" height="24" fill="#c9a46b" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="230" y="100" width="140" height="24" fill="#c9a46b" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="230" y="150" width="140" height="24" fill="#c9a46b" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="240" y="40" width="24" height="140" fill="#e8d3a3" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="290" y="40" width="24" height="140" fill="#e8d3a3" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="340" y="40" width="24" height="140" fill="#e8d3a3" stroke="#8b5a2b" stroke-width="1.5"/>
<text x="300" y="200" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="300" dy="0">9 crossing points</tspan><tspan x="300" dy="12.5">4x4: 55,000 lb · 6x6: 136,000 lb</tspan></text>
<text x="440" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Side</text>
<rect x="410" y="160" width="60" height="18" fill="#e8d3a3" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="410" y="140" width="60" height="18" fill="#c9a46b" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="410" y="120" width="60" height="18" fill="#e8d3a3" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="410" y="100" width="60" height="18" fill="#c9a46b" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="410" y="80" width="60" height="18" fill="#e8d3a3" stroke="#8b5a2b" stroke-width="1.5"/>
<rect x="410" y="60" width="60" height="18" fill="#c9a46b" stroke="#8b5a2b" stroke-width="1.5"/>
<line x1="478" y1="40" x2="478" y2="178" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="472" y="113" font-size="9.5" text-anchor="end" fill="#1a2233">H ≤ 3W</text>
<line x1="410" y1="190" x2="470" y2="190" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="440" y="186" font-size="10" text-anchor="middle" fill="#1a2233">W</text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Timbers at the edges, full contact, no overhang, wedges in pairs on top.</text>
</svg>