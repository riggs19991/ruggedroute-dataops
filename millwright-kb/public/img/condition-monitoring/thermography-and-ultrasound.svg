<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Thermography and ultrasound</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Thermal image</text>
<rect x="30" y="40" width="200" height="120" fill="#1a1a4a" stroke="#1a2233" stroke-width="1.5"/>
<rect x="50" y="90" width="160" height="30" fill="#3a3a9a" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="80" cy="105" r="26" fill="#e8b400" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="80" cy="105" r="12" fill="#ff2a00" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="180" cy="105" r="26" fill="#6a5acd" stroke="#1a2233" stroke-width="1.5"/>
<text x="80" y="150" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">198°F</text>
<text x="180" y="150" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">126°F</text>
<text x="130" y="180" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">DE bearing 72°F hotter than the NDE:</tspan><tspan x="130" dy="12.5">lubrication or damage, act now</tspan></text>
<text x="370" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Ultrasound trend (dB)</text>
<rect x="280" y="40" width="190" height="120" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M290,140 L330,138 L370,135 L400,125 L430,105 L460,70" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="280" y1="132" x2="470" y2="132" stroke="#166534" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="280" y1="116" x2="470" y2="116" stroke="#b45309" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="465" y="128" font-size="9" text-anchor="end" fill="#166534">baseline</text>
<text x="300" y="112" font-size="9" text-anchor="start" fill="#b45309">+8 dB: lubricate</text>
<text x="440" y="60" font-size="9" text-anchor="end" fill="#b91c1c">+16 dB: failing</text>
<text x="375" y="180" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="375" dy="0">grease while listening: dB drops then</tspan><tspan x="375" dy="12.5">settles = right amount</tspan></text>
</svg>