<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Vibration signatures</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="280" fill="#ffffff"/>
<text x="130" y="42" font-size="11.5" text-anchor="middle" font-weight="600" fill="#0b5fa5">Unbalance</text>
<rect x="30" y="50" width="200" height="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="30" y1="110" x2="230" y2="110" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<line x1="48" y1="110" x2="48" y2="58" stroke="#0b5fa5" stroke-width="3" stroke-linecap="round"/>

<text x="48" y="122" font-size="8" text-anchor="middle" fill="#5b6577">1×</text>
<text x="66" y="122" font-size="8" text-anchor="middle" fill="#5b6577">2×</text>
<text x="84" y="122" font-size="8" text-anchor="middle" fill="#5b6577">3×</text>
<text x="102" y="122" font-size="8" text-anchor="middle" fill="#5b6577">4×</text>
<text x="120" y="122" font-size="8" text-anchor="middle" fill="#5b6577">5×</text>
<text x="130" y="138" font-size="9.5" text-anchor="middle" fill="#5b6577">high 1×, radial</text>
<text x="370" y="42" font-size="11.5" text-anchor="middle" font-weight="600" fill="#b45309">Misalignment</text>
<rect x="270" y="50" width="200" height="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="270" y1="110" x2="470" y2="110" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<line x1="288" y1="110" x2="288" y2="78.8" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
<line x1="306" y1="110" x2="306" y2="58" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
<line x1="324" y1="110" x2="324" y2="94.4" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

<text x="288" y="122" font-size="8" text-anchor="middle" fill="#5b6577">1×</text>
<text x="306" y="122" font-size="8" text-anchor="middle" fill="#5b6577">2×</text>
<text x="324" y="122" font-size="8" text-anchor="middle" fill="#5b6577">3×</text>
<text x="342" y="122" font-size="8" text-anchor="middle" fill="#5b6577">4×</text>
<text x="360" y="122" font-size="8" text-anchor="middle" fill="#5b6577">5×</text>
<text x="370" y="138" font-size="9.5" text-anchor="middle" fill="#5b6577">2× (and 3×), axial high</text>
<text x="130" y="157" font-size="11.5" text-anchor="middle" font-weight="600" fill="#b91c1c">Looseness</text>
<rect x="30" y="165" width="200" height="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="30" y1="225" x2="230" y2="225" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<line x1="39" y1="225" x2="39" y2="209.4" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<line x1="48" y1="225" x2="48" y2="173" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<line x1="57" y1="225" x2="57" y2="209.4" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<line x1="66" y1="225" x2="66" y2="188.6" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<line x1="75" y1="225" x2="75" y2="212" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<line x1="84" y1="225" x2="84" y2="193.8" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<line x1="102" y1="225" x2="102" y2="199" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
<line x1="120" y1="225" x2="120" y2="204.2" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>

<text x="48" y="237" font-size="8" text-anchor="middle" fill="#5b6577">1×</text>
<text x="66" y="237" font-size="8" text-anchor="middle" fill="#5b6577">2×</text>
<text x="84" y="237" font-size="8" text-anchor="middle" fill="#5b6577">3×</text>
<text x="102" y="237" font-size="8" text-anchor="middle" fill="#5b6577">4×</text>
<text x="120" y="237" font-size="8" text-anchor="middle" fill="#5b6577">5×</text>
<text x="130" y="253" font-size="9.5" text-anchor="middle" fill="#5b6577">many harmonics, 0.5× orders</text>
<text x="370" y="157" font-size="11.5" text-anchor="middle" font-weight="600" fill="#166534">Bearing defect</text>
<rect x="270" y="165" width="200" height="60" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="270" y1="225" x2="470" y2="225" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<line x1="288" y1="225" x2="288" y2="204.2" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
<line x1="327.6" y1="225" x2="327.6" y2="193.8" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
<line x1="385.2" y1="225" x2="385.2" y2="199" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
<line x1="442.79999999999995" y1="225" x2="442.79999999999995" y2="206.8" stroke="#166534" stroke-width="3" stroke-linecap="round"/>
<path d="M310,225 q30,-20 60,-6 q30,-8 60,6" fill="none" stroke="#166534" stroke-width="1" stroke-dasharray="2 2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="288" y="237" font-size="8" text-anchor="middle" fill="#5b6577">1×</text>
<text x="306" y="237" font-size="8" text-anchor="middle" fill="#5b6577">2×</text>
<text x="324" y="237" font-size="8" text-anchor="middle" fill="#5b6577">3×</text>
<text x="342" y="237" font-size="8" text-anchor="middle" fill="#5b6577">4×</text>
<text x="360" y="237" font-size="8" text-anchor="middle" fill="#5b6577">5×</text>
<text x="370" y="253" font-size="9.5" text-anchor="middle" fill="#5b6577">non-integer orders, haystack</text>
<text x="250" y="272" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Orders = multiples of shaft speed. Compare radial and axial, both bearings.</text>
</svg>