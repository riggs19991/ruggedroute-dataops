<line x1="197" y1="124" x2="110" y2="163" stroke="#b45309" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="200" y="128" font-size="11" text-anchor="start" fill="#b45309">FTF cage</text>
<rect x="230" y="140" width="260" height="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="236" y="152.92000000000002" font-size="10" text-anchor="start" font-weight="600" fill="#1a2233">fault</text>
<text x="286" y="152.92000000000002" font-size="10" text-anchor="start" font-weight="600" fill="#1a2233">rule of thumb (n balls)</text>
<text x="416" y="152.92000000000002" font-size="10" text-anchor="start" font-weight="600" fill="#1a2233">sidebands</text>
