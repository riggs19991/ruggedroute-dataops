<line x1="126" y1="270" x2="126" y2="262" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<line x1="160" y1="270" x2="160" y2="266" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<line x1="194" y1="270" x2="194" y2="270" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="160" y="226" font-size="9" text-anchor="middle" fill="#b91c1c">BPFO harmonics</text>
<text x="250" y="250" font-size="10" text-anchor="start" fill="#5b6577"><tspan x="250" dy="0">defect frequencies are not whole</tspan><tspan x="250" dy="12.5">multiples of shaft speed: that is</tspan><tspan x="250" dy="12.5">how you tell them from looseness</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Use the bearing number and the analyzer database for exact values.</text>
</svg>