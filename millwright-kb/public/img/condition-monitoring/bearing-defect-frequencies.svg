<text x="286" y="171.92000000000002" font-size="10" text-anchor="start" fill="#1a2233">n × rpm × 0.4</text>
<text x="416" y="171.92000000000002" font-size="10" text-anchor="start" fill="#1a2233">none</text>
<rect x="230" y="178" width="260" height="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="236" y="190.92000000000002" font-size="10" text-anchor="start" fill="#1a2233">BPFI</text>
