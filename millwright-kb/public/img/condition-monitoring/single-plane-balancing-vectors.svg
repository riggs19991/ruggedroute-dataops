<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Single-plane balancing vectors</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<circle cx="115" cy="155" r="98" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<line x1="13" y1="155" x2="217" y2="155" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
<line x1="115" y1="53" x2="115" y2="257" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
<text x="220" y="159" font-size="10" text-anchor="start" fill="#5b6577">0°</text>
<text x="123" y="51" font-size="10" text-anchor="start" fill="#5b6577">90°</text>
<line x1="115" y1="155" x2="164.02684435961459" y2="113.86159298006149" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="98.02684435961459" y="133.8615929800615" font-size="11" text-anchor="start" font-weight="700" fill="#1a2233">O = 8 at 40°</text>
<line x1="115" y1="155" x2="99.71896036531014" y2="68.33691773492569" stroke="#0b5fa5" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="14" y="30" font-size="11" text-anchor="start" font-weight="700" fill="#0b5fa5">O+T = 11 mils at 100°</text>
<line x1="164.02684435961459" y1="113.86159298006149" x2="99.71896036531014" y2="68.33691773492569" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="139.87290236246236" y="93.09925535749359" font-size="13" text-anchor="start" font-weight="700" fill="#b91c1c">T</text>
<text x="240" y="50" font-size="10.5" text-anchor="start" fill="#1a2233">1. Run: read O (amplitude, phase)</text>
<text x="240" y="68" font-size="10.5" text-anchor="start" fill="#1a2233">2. Add trial weight W at 0°, run: read O+T</text>
<text x="240" y="86" font-size="10.5" text-anchor="start" fill="#1a2233">3. Draw both from centre; T joins O to O+T</text>
<text x="240" y="112" font-size="12" text-anchor="start" font-weight="700" fill="#1a2233">correction weight = W × O ÷ T</text>
<text x="240" y="130" font-size="10.5" text-anchor="start" fill="#1a2233">move it from the trial position by the</text>
<text x="240" y="146" font-size="10.5" text-anchor="start" fill="#1a2233">angle that turns T to point opposite O</text>
<text x="240" y="176" font-size="10.5" text-anchor="start" fill="#5b6577">example: W = 10 g, O = 8, T = 11.6</text>
<text x="240" y="192" font-size="10.5" text-anchor="start" fill="#5b6577">→ 6.9 g, shifted 108° against rotation</text>
<text x="240" y="222" font-size="10" text-anchor="start" fill="#5b6577"><tspan x="240" dy="0">same phase reference (tape mark and</tspan><tspan x="240" dy="12.5">tach) for every run; remove the trial</tspan><tspan x="240" dy="12.5">weight before fitting the correction</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Angles are measured against rotation on most analyzers; check yours.</text>
</svg>