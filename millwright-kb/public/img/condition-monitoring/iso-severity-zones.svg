<text x="228.39999999999998" y="162" font-size="9.5" text-anchor="middle" fill="#5b6577">2.8</text>
<rect x="228.39999999999998" y="110" width="47.60000000000002" height="40" fill="#fff4d6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="252.2" y="135" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">C</text>
