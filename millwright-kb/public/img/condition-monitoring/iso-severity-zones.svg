<text x="150" y="102" font-size="9.5" text-anchor="middle" fill="#5b6577">0</text>
<text x="140" y="138" font-size="10" text-anchor="end" fill="#1a2233">Group 2 (15-300 kW)</text>
<rect x="150" y="110" width="39.19999999999999" height="40" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/>
