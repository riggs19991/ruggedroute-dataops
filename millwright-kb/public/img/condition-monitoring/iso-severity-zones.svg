<text x="250" y="185" font-size="10" text-anchor="middle" fill="#5b6577">A new · B unrestricted long-term · C restricted, plan a repair · D damage likely</text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Flexible mounts allow about 1.5× these values. 1 in/s pk ≈ 18 mm/s RMS.</text>
</svg>