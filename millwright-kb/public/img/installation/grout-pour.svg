<circle cx="430" cy="130" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="430" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="300" cy="170" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="174" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text>

<text x="20" y="18" font-size="10" text-anchor="start" fill="#5b6577">1 head box: pour from one side only  ·  2 jack bolts wrapped or waxed, removed after cure</text>
<text x="20" y="33" font-size="9.5" text-anchor="start" fill="#5b6577">3 anchor bolts sleeved · 4 chamfered forms above the plate underside · 5 grout 1-2 in</text>
<text x="250" y="282" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Vent holes in the plate; strap the flow, never vibrate epoxy; cure first.</text>
