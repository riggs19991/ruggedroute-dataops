<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 305" width="500" height="305" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Pipe strain check</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="305" fill="#ffffff"/>
<rect x="60" y="120" width="120" height="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<rect x="180" y="150" width="70" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="250" y="130" width="20" height="60" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="280" y="130" width="20" height="60" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="300" y="145" width="160" height="30" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="265" y1="130" x2="295" y2="130" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<line x1="265" y1="190" x2="295" y2="190" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<line x1="215" y1="150" x2="215" y2="100" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="215" cy="88" r="12" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="215" y1="88" x2="219" y2="80" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<text x="215" y="68" font-size="10" text-anchor="middle" fill="#5b6577">vertical</text>
<line x1="215" y1="170" x2="215" y2="210" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="215" cy="222" r="12" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="215" y1="222" x2="220" y2="215" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<text x="215" y="248" font-size="10" text-anchor="middle" fill="#5b6577">horizontal</text>
<text x="120" y="110" font-size="11" text-anchor="middle" fill="#5b6577">pump</text>
<text x="380" y="135" font-size="11" text-anchor="middle" fill="#5b6577">piping</text>
<text x="285" y="118" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="285" dy="0">flange bolts</tspan><tspan x="285" dy="11.875">loosened</tspan></text>
<line x1="275" y1="205" x2="285" y2="205" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="280" y="201" font-size="9.5" text-anchor="middle" fill="#1a2233">gap</text>
<text x="390" y="232" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="390" dy="0">limits before bolting: faces parallel</tspan><tspan x="390" dy="11.875">within 0.010 in, offset 0.030 in,</tspan><tspan x="390" dy="11.875">gap within the gasket thickness</tspan></text>
<text x="250" y="297" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Fix the pipe, not the pump: never pull a flange in with the bolts.</text>
