<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Centre of gravity on skates</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<rect x="80" y="60" width="300" height="120" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="80" y="60" width="140" height="120" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="170" cy="130" r="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
<text x="170" y="134" font-size="9" text-anchor="middle" font-weight="700" fill="#b91c1c">CG</text>
<rect x="80" y="180" width="60" height="16" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<circle cx="92" cy="200" r="5" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="128" cy="200" r="5" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<rect x="320" y="180" width="60" height="16" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<circle cx="332" cy="200" r="5" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="368" cy="200" r="5" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="80" y1="210" x2="380" y2="210" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="230" y="226" font-size="10.5" text-anchor="middle" fill="#0b5fa5">skate footprint: CG must stay inside it, on slopes too</text>
<line x1="170" y1="60" x2="170" y2="180" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="400" y1="170" x2="460" y2="170" stroke="#1a2233" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="430" y="160" font-size="10" text-anchor="middle" fill="#5b6577">push low</text>
<text x="170" y="48" font-size="10" text-anchor="middle" fill="#5b6577">heavy end: motor, gearbox, castings</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Chock before anyone puts a hand near; never ride a skate; watch the toes.</text>
</svg>