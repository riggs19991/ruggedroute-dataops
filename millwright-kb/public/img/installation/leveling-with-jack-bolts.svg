<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 285" width="500" height="285" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Leveling with jack bolts</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="285" fill="#ffffff"/>
<rect x="20" y="190" width="460" height="50" fill="#d9d4c7" stroke="#1a2233" stroke-width="1.5"/>
<rect x="20" y="190" width="460" height="50" fill="url(#dots)" stroke="#64748b" stroke-width="1.5"/>
<rect x="80" y="120" width="340" height="18" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="120" y="100" width="100" height="20" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="280" y="100" width="100" height="20" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="100" y1="138" x2="100" y2="190" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/>
<rect x="90" y="176" width="20" height="14" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="86" y="120" width="28" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="400" y1="138" x2="400" y2="190" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/>
<rect x="390" y="176" width="20" height="14" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="386" y="120" width="28" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<rect x="150" y="80" width="40" height="20" fill="#2b6cb0" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<rect x="160" y="84" width="20" height="8" fill="#cfe8ff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="170" cy="88" r="3" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="150" y1="70" x2="250" y2="70" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="250" y="60" font-size="9.5" text-anchor="start" fill="#5b6577">level each pad, both directions, then diagonally</text>
<line x1="80" y1="160" x2="420" y2="160" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="250" y="156" font-size="10.5" text-anchor="middle" fill="#1a2233">target: 0.001-0.002 in/ft (0.005 in/ft ok for general machines)</text>
<circle cx="100" cy="205" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="100" y="209" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="170" cy="50" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="170" y="54" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="29" cy="254" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="258" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="44" y="258" font-size="10" text-anchor="start" fill="#1a2233">jack bolts on a landing plate; back them out after the grout cures</text>
<circle cx="29" cy="267" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="271" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="44" y="271" font-size="10" text-anchor="start" fill="#1a2233">precision level (0.0005 in/ft per division) on a clean machined pad</text>
</svg>