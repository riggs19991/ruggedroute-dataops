<text x="46" y="248.96" font-size="11" text-anchor="start" fill="#1a2233">15-1/2 to 17-1/2 in</text>
<text x="226" y="248.96" font-size="11" text-anchor="start" fill="#1a2233">1-7/8 in</text>
<rect x="40" y="256" width="290" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="270.96" font-size="11" text-anchor="start" fill="#1a2233">17-1/2 to 31-1/2 in</text>
<text x="226" y="270.96" font-size="11" text-anchor="start" fill="#1a2233">2-1/8 in</text>
<rect x="350" y="60" width="120" height="100" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<rect x="360" y="70" width="18" height="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="388" y="70" width="18" height="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="416" y="70" width="18" height="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="444" y="70" width="18" height="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="410" cy="200" r="25" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="350" y1="165" x2="470" y2="165" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="478" y1="160" x2="478" y2="200" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="472" y="184" font-size="10" text-anchor="end" fill="#1a2233">dist.</text>
<text x="410" y="250" font-size="10" text-anchor="middle" fill="#5b6577">opening</text>
<text x="250" y="312" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Rule of thumb: a finger reaches 1/2 in; a hand 4 in; an arm 30 in.</text>
</svg>