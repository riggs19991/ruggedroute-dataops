<text x="46" y="94.96000000000001" font-size="11" text-anchor="start" fill="#1a2233">1-1/2 to 2-1/2 in</text>
<text x="226" y="94.96000000000001" font-size="11" text-anchor="start" fill="#1a2233">3/8 in</text>
<rect x="40" y="102" width="290" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="116.96000000000001" font-size="11" text-anchor="start" fill="#1a2233">2-1/2 to 3-1/2 in</text>
<text x="226" y="116.96000000000001" font-size="11" text-anchor="start" fill="#1a2233">1/2 in</text>
<rect x="40" y="124" width="290" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="138.96" font-size="11" text-anchor="start" fill="#1a2233">3-1/2 to 5-1/2 in</text>
<text x="226" y="138.96" font-size="11" text-anchor="start" fill="#1a2233">5/8 in</text>
<rect x="40" y="146" width="290" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="160.96" font-size="11" text-anchor="start" fill="#1a2233">5-1/2 to 6-1/2 in</text>
<text x="226" y="160.96" font-size="11" text-anchor="start" fill="#1a2233">3/4 in</text>
<rect x="40" y="168" width="290" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="182.96" font-size="11" text-anchor="start" fill="#1a2233">6-1/2 to 7-1/2 in</text>
<text x="226" y="182.96" font-size="11" text-anchor="start" fill="#1a2233">7/8 in</text>
<rect x="40" y="190" width="290" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="204.96" font-size="11" text-anchor="start" fill="#1a2233">7-1/2 to 12-1/2 in</text>
<text x="226" y="204.96" font-size="11" text-anchor="start" fill="#1a2233">1-1/4 in</text>
<rect x="40" y="212" width="290" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="226.96" font-size="11" text-anchor="start" fill="#1a2233">12-1/2 to 15-1/2 in</text>
<text x="226" y="226.96" font-size="11" text-anchor="start" fill="#1a2233">1-1/2 in</text>
