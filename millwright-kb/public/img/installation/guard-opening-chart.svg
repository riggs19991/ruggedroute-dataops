<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Guard opening chart</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="320" fill="#ffffff"/>
<text x="250" y="22" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a2233">Maximum guard opening by distance from the hazard</text>
<rect x="40" y="36" width="290" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="50.96" font-size="11" text-anchor="start" font-weight="600" fill="#1a2233">Distance from nip point</text>
<text x="226" y="50.96" font-size="11" text-anchor="start" font-weight="600" fill="#1a2233">Max opening</text>
<rect x="40" y="58" width="290" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="72.96000000000001" font-size="11" text-anchor="start" fill="#1a2233">1/2 to 1-1/2 in</text>
<text x="226" y="72.96000000000001" font-size="11" text-anchor="start" fill="#1a2233">1/4 in</text>
