<text x="250" y="250" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="250" dy="0">jaw: cheap, dusts when misaligned · grid: shock loads, greased</tspan><tspan x="250" dy="11.875">gear: high torque, greased · disc: no lube, needs exact DBSE</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Heat or press hubs on; never hammer them (bearings brinell).</text>
