<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>V-belt deflection</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="260" fill="#ffffff"/>
<circle cx="90" cy="130" r="50" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="390" cy="130" r="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="90" y1="80" x2="390" y2="50" stroke="#1a2233" stroke-width="6" stroke-linecap="round"/>
<line x1="90" y1="180" x2="390" y2="210" stroke="#1a2233" stroke-width="6" stroke-linecap="round"/>
<line x1="90" y1="80" x2="390" y2="50" stroke="#5b6577" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="240" y1="65" x2="240" y2="80" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<circle cx="240" cy="80" r="4" fill="#b91c1c" stroke="none" stroke-width="1.5"/>
<line x1="90" y1="40" x2="390" y2="40" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="240" y="36" font-size="11" text-anchor="middle" fill="#1a2233">span</text>
<text x="240" y="105" font-size="10.5" text-anchor="middle" fill="#b91c1c">deflection = span ÷ 64</text>
<text x="240" y="120" font-size="10" text-anchor="middle" fill="#5b6577">(32 in span → 1/2 in)</text>
<line x1="40" y1="232" x2="470" y2="232" stroke="#0b5fa5" stroke-width="1.5" stroke-dasharray="5 3" stroke-linecap="round"/>
<text x="250" y="250" font-size="10" text-anchor="middle" fill="#5b6577">straightedge on both sheave faces: touches at four points; 1/16 in per foot max</text>
<text x="90" y="200" font-size="10" text-anchor="middle" fill="#5b6577">motor</text>
<text x="390" y="235" font-size="11" text-anchor="middle" fill="#5b6577"></text>
</svg>