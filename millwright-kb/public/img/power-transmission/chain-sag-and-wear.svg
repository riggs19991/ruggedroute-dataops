<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Chain sag and wear</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="260" fill="#ffffff"/>
<circle cx="80" cy="110" r="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="400" cy="110" r="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="80" y1="70" x2="400" y2="50" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<path d="M80,150 Q240,190 400,170" fill="none" stroke="#1a2233" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="240" y1="176" x2="240" y2="160" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="240" y="200" font-size="10.5" text-anchor="middle" fill="#5b6577">sag = 2-4% of span (10 in span → 1/4 in)</text>
<line x1="80" y1="44" x2="400" y2="24" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3" stroke-linecap="round"/>
<text x="240" y="16" font-size="10" text-anchor="middle" fill="#b91c1c">straightedge across both sprocket faces</text>
<text x="80" y="175" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="80" dy="0">tight side on top</tspan><tspan x="80" dy="12.5">for horizontal drives</tspan></text>
<text x="250" y="232" font-size="9.5" text-anchor="middle" fill="#5b6577">wear: 12 pitches of #40 = 6.000 in new; replace at 3% (6.180 in), 1.5% on big sprockets</text>
</svg>