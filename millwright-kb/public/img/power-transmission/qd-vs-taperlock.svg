<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>QD vs Taper-Lock</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<text x="130" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">QD (JA, SH, SDS, SK, SF, E)</text>
<rect x="40" y="60" width="180" height="100" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<path d="M110,60 L150,60 L140,160 L120,160 Z" fill="#64748b" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="80" y="60" width="100" height="14" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<line x1="92" y1="60" x2="92" y2="100" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<line x1="168" y1="60" x2="168" y2="100" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<text x="130" y="185" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">flange with 3 holes; pull-up screws</tspan><tspan x="130" dy="12.5">from the flange side; split through</tspan></text>
<text x="370" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Taper-Lock (1108, 1610, 2517...)</text>
<rect x="280" y="60" width="180" height="100" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<path d="M350,60 L390,60 L380,160 L360,160 Z" fill="#64748b" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="344" y1="60" x2="344" y2="95" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<line x1="396" y1="60" x2="396" y2="95" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<text x="370" y="185" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="370" dy="0">no flange; 2-3 screws in half-holes;</tspan><tspan x="370" dy="12.5">removal screw in the third hole</tspan></text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Torque screws in stages to the table; dry taper; recheck after run-in.</text>
</svg>