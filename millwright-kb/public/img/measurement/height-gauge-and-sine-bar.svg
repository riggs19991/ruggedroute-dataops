<path d="M160,106 L176,111 L160,116 Z" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="150" y="150" width="60" height="50" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
