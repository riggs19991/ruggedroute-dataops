<line x1="80" y1="160" x2="90" y2="160" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<line x1="80" y1="170" x2="86" y2="170" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<line x1="80" y1="180" x2="86" y2="180" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
