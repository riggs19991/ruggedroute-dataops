<line x1="176" y1="200" x2="196" y2="200" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="176" y1="111" x2="196" y2="111" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="192" y1="200" x2="192" y2="111" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="198" y="159.5" font-size="11" text-anchor="start" fill="#0b5fa5">H</text>
<text x="100" y="36" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Height gauge</text>
<text x="180" y="60" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="180" dy="0">zero on the plate,</tspan><tspan x="180" dy="12.5">then scribe or read H</tspan></text>
<text x="380" y="36" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Sine bar</text>
<circle cx="290" cy="190" r="10" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="430" y="120" width="40" height="80" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<circle cx="450" cy="110" r="10" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="rotate(-26.6 290 190)"><rect x="280" y="160" width="180" height="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="2"/></g>
<path d="M325.76616947357473,172.08963648644922 A40,40 0 0 1 330,190" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="340.60530138440856" y="182.03741366621858" font-size="12" text-anchor="middle" fill="#0b5fa5">θ</text>
<line x1="430" y1="200" x2="412" y2="200" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="430" y1="120" x2="412" y2="120" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="416" y1="200" x2="416" y2="120" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="422" y="164" font-size="11" text-anchor="start" fill="#0b5fa5">h</text>
<text x="400" y="240" font-size="10" text-anchor="middle" fill="#0b5fa5">gauge blocks, height h</text>
<text x="260" y="70" font-size="12" text-anchor="start" font-weight="700" fill="#1a2233">sin θ = h ÷ L  (L = 5 or 10 in)</text>
<text x="260" y="88" font-size="11" text-anchor="start" fill="#1a2233">30°, 5 in bar: h = 5 × 0.5 = 2.500 in</text>
<text x="250" y="262" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Everything on the plate is measured from one flat reference.</text>
</svg>