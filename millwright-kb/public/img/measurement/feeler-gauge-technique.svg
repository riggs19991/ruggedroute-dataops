<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Feeler gauge technique</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<rect x="40" y="60" width="200" height="40" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="40" y="112" width="200" height="40" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="100" y="100" width="200" height="12" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5" rx="2"/>
<rect x="280" y="92" width="40" height="28" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<line x1="220" y1="106" x2="260" y2="106" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="240" y="132" font-size="10" text-anchor="middle" fill="#0b5fa5">light drag both ways</text>
<line x1="140" y1="58" x2="140" y2="98" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="140" y="50" font-size="11" text-anchor="middle" fill="#0b5fa5">gap 0.012 in (0.30 mm)</text>
<text x="140" y="175" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="140" dy="0">too tight: blade bends or scrapes</tspan><tspan x="140" dy="12.5">too loose: falls out, no drag</tspan></text>
<text x="410" y="50" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Stacking</text>
<rect x="370" y="62" width="80" height="8" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="370" y="72" width="80" height="6" fill="#b45309" stroke="#1a2233" stroke-width="1.5"/>
<text x="410" y="96" font-size="11" text-anchor="middle" fill="#1a2233">0.010 + 0.006 = 0.016</text>
<text x="410" y="150" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="410" dy="0">thickest blade first, thin</tspan><tspan x="410" dy="12.5">one next to it; wipe clean</tspan></text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Insert flat and square; a blade at an angle reads a bigger gap.</text>
</svg>