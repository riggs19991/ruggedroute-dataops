<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Dial indicator runout</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Shaft runout (TIR)</text>
<rect x="30" y="120" width="200" height="30" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="130" cy="60" r="24" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="130" y1="84" x2="130" y2="120" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<line x1="130" y1="60" x2="140" y2="46" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<rect x="60" y="40" width="12" height="80" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<path d="M72,50 L118,50" fill="none" stroke="#1a2233" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M92.41229516856366,121.31919426697326 A40,40 0 0 1 167.58770483143633,121.31919426697326" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="130" y="175" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">zero at the high spot, turn 360°;</tspan><tspan x="130" dy="12.5">TIR = total needle travel</tspan></text>
<text x="370" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Cosine error (test indicator)</text>
<rect x="290" y="120" width="180" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(320,118) rotate(0)"><line x1="0" y1="0" x2="40" y2="0" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<circle cx="40" cy="0" r="3" fill="#b91c1c" stroke="#1a2233" stroke-width="1.5"/></g>
<text x="340" y="160" font-size="10" text-anchor="middle" fill="#5b6577">0°: reads true</text>
<g transform="translate(400,118) rotate(-30)"><line x1="0" y1="0" x2="40" y2="0" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<circle cx="40" cy="0" r="3" fill="#b91c1c" stroke="#1a2233" stroke-width="1.5"/></g>
<text x="420" y="160" font-size="10" text-anchor="middle" fill="#5b6577">30°: ×0.87</text>
<text x="380" y="190" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="380" dy="0">over 15° tilt, multiply by cos(angle),</tspan><tspan x="380" dy="12.5">or keep the lever nearly parallel</tspan></text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Rigid mount, no overhang, plunger square, read the same graduation each turn.</text>
</svg>