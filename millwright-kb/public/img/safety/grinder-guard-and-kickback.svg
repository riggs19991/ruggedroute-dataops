<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Grinder guard and kickback</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<rect x="60" y="90" width="180" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="12"/>
<rect x="40" y="96" width="30" height="28" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<circle cx="280" cy="110" r="45" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
<path d="M235,110 A45,45 0 0 1 325,110" fill="none" stroke="#1a2233" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="150" y="60" width="10" height="30" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="280" y="40" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="280" dy="0">guard covers the top half,</tspan><tspan x="280" dy="12.5">rotated toward you</tspan></text>
<text x="155" y="50" font-size="10" text-anchor="middle" fill="#5b6577">side handle</text>
<path d="M331.68309414322493,128.81110788291178 A55,55 0 0 1 252.5,157.63139720814414" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="340" y="180" font-size="10" text-anchor="middle" fill="#b91c1c"><tspan x="340" dy="0">kickback direction:</tspan><tspan x="340" dy="12.5">stand out of it</tspan></text>
<text x="120" y="175" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="120" dy="0">wheel rpm rating ≥ grinder rpm;</tspan><tspan x="120" dy="12.5">Type 1 cut-off wheel = closed guard;</tspan><tspan x="120" dy="12.5">no lock-on trigger for cutting</tspan></text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Sparks go down and away from you, gas bottles and rags.</text>
</svg>