<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>First aid priorities</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="200" fill="#ffffff"/>
<rect x="12" y="50" width="90" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="57" y="77.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="57" dy="0">1 Scene safe:</tspan><tspan x="57" dy="11.875">isolate, lockout</tspan></text>
<rect x="108" y="50" width="90" height="60" fill="#fee2e2" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="153" y="77.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="153" dy="0">2 Call 911 /</tspan><tspan x="153" dy="11.875">site number</tspan></text>
<rect x="204" y="50" width="90" height="60" fill="#fee2e2" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="249" y="77.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="249" dy="0">3 Bleeding: press,</tspan><tspan x="249" dy="11.875">tourniquet</tspan></text>
<rect x="300" y="50" width="90" height="60" fill="#fee2e2" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="345" y="77.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="345" dy="0">4 Not breathing</tspan><tspan x="345" dy="11.875">CPR + AED</tspan></text>
<rect x="396" y="50" width="90" height="60" fill="#dcfce7" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="441" y="77.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="441" dy="0">5 Treat, warm,</tspan><tspan x="441" dy="11.875">monitor, record</tspan></text>
<line x1="102" y1="80" x2="108" y2="80" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="198" y1="80" x2="204" y2="80" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="294" y1="80" x2="300" y2="80" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="390" y1="80" x2="396" y2="80" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="250" y="140" font-size="9.5" text-anchor="middle" fill="#5b6577">tourniquet: 2-3 in above the wound, not on a joint, tight until it stops; note the time</text>
<text x="250" y="158" font-size="10" text-anchor="middle" fill="#5b6577">eyes: flush 15 min; burns: cool water 20 min; injection injury and electric shock: hospital</text>
<text x="250" y="192" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Amputated part: moist gauze, sealed bag, on ice, never in water.</text>
</svg>