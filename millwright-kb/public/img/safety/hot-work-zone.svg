<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Hot work zone</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="260" fill="#ffffff"/>
<circle cx="220" cy="130" r="105" fill="#fff4d6" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="220" cy="130" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<line x1="220" y1="130" x2="325" y2="130" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="272.5" y="126" font-size="11" text-anchor="middle" fill="#1a2233">35 ft</text>
<rect x="150" y="60" width="30" height="20" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="148" y1="58" x2="182" y2="82" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="165" y="52" font-size="9" text-anchor="middle" fill="#5b6577">combustibles out</text>
<rect x="260" y="180" width="40" height="14" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="280" y="210" font-size="9" text-anchor="middle" fill="#5b6577">floor opening covered</text>
<circle cx="330" cy="200" r="8" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="330" y1="208" x2="330" y2="235" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<rect x="342" y="212" width="10" height="20" fill="#b91c1c" stroke="#1a2233" stroke-width="1.5"/>
<text x="340" y="250" font-size="9.5" text-anchor="middle" fill="#5b6577">fire watch + extinguisher, 30-60 min after</text>
<rect x="50" y="60" width="12" height="140" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="70" y="215" font-size="9" text-anchor="middle" fill="#5b6577">wall: check the far side</text>
<rect x="380" y="40" width="100" height="200" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="430" y="140" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="430" dy="0">welding blankets</tspan><tspan x="430" dy="11.875">on what cannot</tspan><tspan x="430" dy="11.875">be moved</tspan></text>
</svg>