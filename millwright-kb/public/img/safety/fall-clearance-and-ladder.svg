<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Fall clearance and ladder</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Fall clearance</text>
<rect x="40" y="40" width="200" height="12" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="70" cy="46" r="5" fill="#f59e0b" stroke="#1a2233" stroke-width="1.5"/>
<line x1="70" y1="52" x2="70" y2="100" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<line x1="90" y1="52" x2="90" y2="100" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="98" y="80" font-size="10" text-anchor="start" fill="#1a2233">6 ft lanyard</text>
<line x1="70" y1="100" x2="70" y2="128" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
<line x1="90" y1="100" x2="90" y2="128" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="98" y="118" font-size="10" text-anchor="start" fill="#b91c1c">3.5 ft deceleration</text>
<line x1="70" y1="128" x2="70" y2="136" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
<line x1="90" y1="128" x2="90" y2="136" stroke="#b45309" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="98" y="136" font-size="10" text-anchor="start" fill="#b45309">1 ft stretch</text>
<line x1="70" y1="136" x2="70" y2="176" stroke="#0b5fa5" stroke-width="4" stroke-linecap="round"/>
<line x1="90" y1="136" x2="90" y2="176" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="98" y="160" font-size="10" text-anchor="start" fill="#0b5fa5">5 ft to feet</text>
<line x1="70" y1="176" x2="70" y2="200" stroke="#166534" stroke-width="4" stroke-linecap="round"/>
<line x1="90" y1="176" x2="90" y2="200" stroke="#166534" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="98" y="192" font-size="10" text-anchor="start" fill="#166534">3 ft safety</text>
<line x1="40" y1="200" x2="240" y2="200" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<text x="130" y="222" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">18.5 ft anchor to obstruction</text>
<text x="130" y="240" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">anchor at the feet adds up to 6 ft more;</tspan><tspan x="130" dy="11.875">use an overhead anchor or an SRL</tspan></text>
<text x="380" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Ladder angle 4:1</text>
<rect x="430" y="40" width="12" height="200" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="310" y1="240" x2="430" y2="40" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
<line x1="322" y1="246" x2="442" y2="46" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
<line x1="313" y1="240" x2="325" y2="246" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
<line x1="330.1" y1="211.4" x2="342.1" y2="217.4" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
<line x1="347.2" y1="182.8" x2="359.2" y2="188.8" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
<line x1="364.3" y1="154.2" x2="376.3" y2="160.2" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
<line x1="381.4" y1="125.6" x2="393.4" y2="131.6" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
<line x1="398.5" y1="97" x2="410.5" y2="103" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
<line x1="415.6" y1="68.39999999999998" x2="427.6" y2="74.39999999999998" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
<line x1="310" y1="262" x2="430" y2="262" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="370" y="258" font-size="10" text-anchor="middle" fill="#1a2233">1 out</text>
<line x1="470" y1="40" x2="470" y2="240" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="476" y="144" font-size="10" text-anchor="start" fill="#1a2233">4 up</text>
<text x="380" y="288" font-size="9.5" text-anchor="middle" fill="#5b6577">3 ft above the landing; tie off the top</text>
</svg>