<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>FRL unit</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="200" fill="#ffffff"/>
<line x1="20" y1="90" x2="480" y2="90" stroke="#0b5fa5" stroke-width="6" stroke-linecap="round"/>
<rect x="90" y="60" width="60" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="98" y="90" width="44" height="50" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/>

<text x="120" y="32" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">Filter</text>
<text x="120" y="158" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="120" dy="0">bowl drain daily</tspan><tspan x="120" dy="12.5">5-40 µm element</tspan></text>
<rect x="220" y="60" width="60" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="228" y="90" width="44" height="50" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<circle cx="250" cy="52" r="10" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="250" y="32" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">Regulator</text>
<text x="250" y="158" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="250" dy="0">set with air flowing</tspan><tspan x="250" dy="12.5">90 psi typical</tspan></text>
<rect x="350" y="60" width="60" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="358" y="90" width="44" height="50" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/>

<text x="380" y="32" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">Lubricator</text>
<text x="380" y="158" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="380" dy="0">oil: ISO VG 32</tspan><tspan x="380" dy="12.5">1 drop/min per 20 cfm</tspan></text>
<text x="30" y="82" font-size="10" text-anchor="start" fill="#1a2233">air in</text>
<text x="470" y="82" font-size="10" text-anchor="end" fill="#1a2233">to tool</text>
<text x="250" y="192" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Lubricator only where the tool wants oil: never for paint or instruments.</text>
</svg>