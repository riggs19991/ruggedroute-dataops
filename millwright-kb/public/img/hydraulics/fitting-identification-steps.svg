<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 306" width="500" height="306" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Fitting identification steps</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="306" fill="#ffffff"/>
<rect x="20" y="20" width="130" height="34" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="85" y="34.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="85" dy="0">1 measure OD (male)</tspan><tspan x="85" dy="11.875">or ID (female)</tspan></text>
<line x1="150" y1="37" x2="178" y2="37" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="180" y="20" width="130" height="34" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="245" y="40.325" font-size="9.5" text-anchor="middle" fill="#1a2233">2 pitch: tpi or mm</text>
<line x1="310" y1="37" x2="338" y2="37" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="340" y="20" width="140" height="34" fill="#fff4d6" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="410" y="40.325" font-size="9.5" text-anchor="middle" fill="#1a2233">3 tapered or parallel?</text>
<line x1="410" y1="54" x2="410" y2="76" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="420" y="68" font-size="9" text-anchor="start" fill="#b91c1c">tapered</text>
<rect x="340" y="78" width="140" height="34" fill="#fee2e2" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="410" y="92.3875" font-size="9.5" text-anchor="middle" fill="#1a2233"><tspan x="410" dy="0">pipe thread:</tspan><tspan x="410" dy="11.875">NPT 60° · BSPT 55°</tspan></text>
<line x1="340" y1="37" x2="250" y2="37" stroke="#1a2233" stroke-width="0" stroke-linecap="round"/>
<line x1="245" y1="54" x2="245" y2="76" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="252" y="68" font-size="9" text-anchor="start" fill="#166534">parallel</text>
<rect x="180" y="78" width="130" height="34" fill="#fff4d6" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="245" y="98.325" font-size="9.5" text-anchor="middle" fill="#1a2233">4 look at the seat</text>
<text x="20" y="145" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">cone / flare</text>
<line x1="150" y1="141" x2="176" y2="141" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="180" y="128" width="300" height="26" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
<text x="190" y="138" font-size="8.4" text-anchor="start" fill="#1a2233">cone angle (5): 37° JIC · 45° SAE</text>
<text x="190" y="149" font-size="8.4" text-anchor="start" fill="#1a2233">30° JIS, Komatsu · 24° DIN · 60° BSP</text>
<text x="20" y="177" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">flat face + O-ring</text>
<line x1="150" y1="173" x2="176" y2="173" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="180" y="160" width="300" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
<text x="190" y="176" font-size="8.8" text-anchor="start" fill="#1a2233">ORFS</text>
<text x="20" y="209" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">O-ring at the shoulder</text>
<line x1="150" y1="205" x2="176" y2="205" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="180" y="192" width="300" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
<text x="190" y="208" font-size="8.8" text-anchor="start" fill="#1a2233">ORB (SAE) · ISO 6149 · BSPP washer</text>
<text x="20" y="241" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">4-bolt flange head</text>
<line x1="150" y1="237" x2="176" y2="237" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="180" y="224" width="300" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
<text x="190" y="240" font-size="8.8" text-anchor="start" fill="#1a2233">Code 61 / Code 62 (bolt spacing)</text>
<text x="20" y="273" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">bite ring / captive ring</text>
<line x1="150" y1="269" x2="176" y2="269" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="180" y="256" width="300" height="26" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
<text x="190" y="272" font-size="8.8" text-anchor="start" fill="#1a2233">DIN 24° L or S (tube OD)</text>
<text x="250" y="298" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Then identify the port the same way: a fitting and its mate are two jobs.</text>
</svg>