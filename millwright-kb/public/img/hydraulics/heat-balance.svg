<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Heat balance</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<text x="20" y="30" font-size="11" text-anchor="start" font-weight="700" fill="#1a2233">Input 50 hp</text>
<rect x="20" y="40" width="440" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="20" y="40" width="308" height="30" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
<text x="174" y="60" font-size="10.5" text-anchor="middle" font-weight="600" fill="#166534">useful work 35 hp</text>
<rect x="328" y="40" width="35" height="30" fill="#fff4d6" stroke="#b45309" stroke-width="1.5"/>
<rect x="363" y="40" width="44" height="30" fill="#fff4d6" stroke="#b45309" stroke-width="1.5"/>
<rect x="407" y="40" width="53" height="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="345" y="86" font-size="8.5" text-anchor="middle" fill="#1a2233">pump</text>
<text x="345" y="96" font-size="8.5" text-anchor="middle" fill="#1a2233">4 hp</text>
<text x="385" y="86" font-size="8.5" text-anchor="middle" fill="#1a2233">valves</text>
<text x="385" y="96" font-size="8.5" text-anchor="middle" fill="#1a2233">5 hp</text>
<text x="433" y="86" font-size="8.5" text-anchor="middle" fill="#b91c1c">relief</text>
<text x="433" y="96" font-size="8.5" text-anchor="middle" fill="#b91c1c">6 hp</text>
<line x1="328" y1="110" x2="460" y2="110" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="394" y="124" font-size="9.5" text-anchor="middle" font-weight="600" fill="#b91c1c">heat 15 hp = 38,000 BTU/h</text>
<text x="20" y="150" font-size="10" text-anchor="start" fill="#1a2233">heat (BTU/h) = (input hp − work hp) × 2,545</text>
<text x="20" y="166" font-size="9.5" text-anchor="start" fill="#1a2233">hp lost across a drop = gpm × psi ÷ 1714   (10 gpm over a relief at 2,000 psi = 11.7 hp)</text>
<text x="20" y="182" font-size="9.5" text-anchor="start" fill="#1a2233">bare tank sheds ≈ 0.001 hp per ft² per °F above ambient: a 100 gal tank ≈ 1-1.5 hp</text>
<text x="20" y="198" font-size="9.5" text-anchor="start" fill="#1a2233">target tank 110-130°F; every +18°F above 140°F halves the oil life</text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">A cooler bought to fix a dumping relief cools the symptom forever.</text>
</svg>