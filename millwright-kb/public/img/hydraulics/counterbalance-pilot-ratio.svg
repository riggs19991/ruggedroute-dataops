<line x1="69" y1="207" x2="91" y2="185" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M94,196 l6,0 l0,-18 l-3,0 m3,0 l3,0" fill="none" stroke="#1a2233" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M66,196 l-6,0 l0,-5 l-3,0 l6,-3 l-6,-3 l3,0" fill="none" stroke="#1a2233" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>

<circle cx="120" cy="196" r="4" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<path d="M114,202 L120,194.8 L126,202" fill="none" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80" y1="210" x2="80" y2="236" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round"/>
<path d="M120,182 L120,170 L80,170" fill="none" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M120,210 L120,236 L80,236" fill="none" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="100" y1="60" x2="160" y2="60" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round"/>
<line x1="160" y1="60" x2="160" y2="236" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round"/>
<line x1="160" y1="150" x2="112" y2="150" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="112" y1="150" x2="112" y2="186" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="166" y="146" font-size="8.4" text-anchor="start" fill="#b91c1c">ext. pilot from</text>
<text x="166" y="157" font-size="8.4" text-anchor="start" fill="#b91c1c">the raise line</text>
<rect x="60" y="236" width="100" height="20" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="110" y="250" font-size="9.5" text-anchor="middle" fill="#1a2233">DCV</text>
<text x="250" y="40" font-size="10.5" text-anchor="start" font-weight="700" fill="#1a2233">Setting</text>
<text x="250" y="56" font-size="9.5" text-anchor="start" fill="#1a2233">load pressure 1,200 psi (gauge, DCV centred)</text>
<text x="250" y="70" font-size="10" text-anchor="start" font-weight="600" fill="#1a2233">set ≈ 1.3 × 1,200 = 1,560 psi</text>
<text x="250" y="90" font-size="9.5" text-anchor="start" fill="#1a2233">pilot needed ≈ (setting − load) ÷ ratio</text>
<rect x="240" y="104" width="254" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="246" y="118.96000000000001" font-size="8.6" text-anchor="start" font-weight="600" fill="#1a2233">ratio</text>
<text x="286" y="118.96000000000001" font-size="8.6" text-anchor="start" font-weight="600" fill="#1a2233">character</text>
<text x="382" y="118.96000000000001" font-size="8.6" text-anchor="start" font-weight="600" fill="#1a2233">use</text>
<rect x="240" y="126" width="254" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="246" y="140.96" font-size="8.6" text-anchor="start" fill="#1a2233">3:1</text>
<text x="286" y="140.96" font-size="8.6" text-anchor="start" fill="#1a2233">most stable, hot</text>
<text x="382" y="140.96" font-size="8.6" text-anchor="start" fill="#1a2233">motors, springy booms</text>
<rect x="240" y="148" width="254" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="246" y="162.96" font-size="8.6" text-anchor="start" fill="#1a2233">4.5:1</text>
<text x="286" y="162.96" font-size="8.6" text-anchor="start" fill="#1a2233">compromise</text>
<text x="382" y="162.96" font-size="8.6" text-anchor="start" fill="#1a2233">most cylinders</text>
<rect x="240" y="170" width="254" height="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="246" y="184.96" font-size="8.6" text-anchor="start" fill="#1a2233">10:1</text>
<text x="286" y="184.96" font-size="8.6" text-anchor="start" fill="#1a2233">efficient, twitchy</text>
<text x="382" y="184.96" font-size="8.6" text-anchor="start" fill="#1a2233">rigid loads, short lines</text>
<text x="250" y="208" font-size="9.2" text-anchor="start" fill="#5b6577">shudder: ratio too high, air, a meter-out</text>
<text x="250" y="220" font-size="9.2" text-anchor="start" fill="#5b6577">between DCV and this valve, back-pressure</text>
<text x="250" y="274" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">A safety device: never removed or re-rated without the designer.</text>
</svg>