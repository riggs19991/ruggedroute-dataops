<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 252" width="500" height="252" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Case drain flow test</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="252" fill="#ffffff"/>
<rect x="60" y="90" width="90" height="70" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<text x="105" y="118" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">piston</text>
<text x="105" y="132" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">pump</text>
<line x1="150" y1="110" x2="250" y2="110" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="250" cy="80" r="10" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="247" y1="83" x2="254" y2="76" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>

<text x="268" y="84" font-size="9" text-anchor="start" fill="#1a2233">3,000 psi</text>
<line x1="250" y1="110" x2="250" y2="90" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<rect x="250" y="100" width="60" height="20" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="280" y="114" font-size="9" text-anchor="middle" fill="#1a2233">load</text>
<line x1="310" y1="110" x2="340" y2="110" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/>
<path d="M328,110 L328,122 L352,122 L352,110" fill="none" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="105" y1="90" x2="105" y2="50" stroke="#0b5fa5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="105" y1="50" x2="400" y2="50" stroke="#0b5fa5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="400" y1="50" x2="400" y2="150" stroke="#0b5fa5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="200" y="44" font-size="9.5" text-anchor="start" fill="#0b5fa5">case drain from the TOP port, no restriction</text>
<rect x="370" y="150" width="60" height="60" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<line x1="372" y1="165" x2="380" y2="165" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round"/>
<line x1="372" y1="180" x2="380" y2="180" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round"/>
<line x1="372" y1="195" x2="380" y2="195" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round"/>
<text x="400" y="185" font-size="10" text-anchor="middle" font-weight="600" fill="#1a2233">1 min</text>
<text x="400" y="224" font-size="9" text-anchor="middle" fill="#5b6577">measure or flow meter</text>
<line x1="60" y1="130" x2="30" y2="130" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/>
<line x1="30" y1="130" x2="30" y2="160" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/>
<path d="M18,160 L18,172 L42,172 L42,160" fill="none" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="20" y="124" font-size="9" text-anchor="start" fill="#1a2233">in</text>
<text x="60" y="182" font-size="9.5" text-anchor="start" fill="#5b6577">rated 20 gpm: new 0.2-0.6 gpm to case</text>
<text x="60" y="196" font-size="9.5" text-anchor="start" fill="#b91c1c">worn: over 2-3 gpm (10-15%)</text>
<text x="60" y="210" font-size="9.5" text-anchor="start" fill="#5b6577">ηv = (rated − drain) ÷ rated</text>
<text x="250" y="244" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Cold oil halves the leakage: test hot. A hot case is a leaking pump.</text>
</svg>