<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 242" width="500" height="242" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Cylinder bypass test</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="242" fill="#ffffff"/>
<rect x="80" y="70" width="220" height="50" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<rect x="268" y="70" width="6" height="50" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="274" y1="95" x2="360" y2="95" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<rect x="360" y="80" width="14" height="30" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="367" y="128" font-size="9" text-anchor="middle" fill="#1a2233">stop</text>
<rect x="80" y="70" width="188" height="50" fill="#dbeafe" stroke="none" stroke-width="1.5"/>
<rect x="80" y="70" width="220" height="50" fill="none" stroke="#1a2233" stroke-width="1.5"/>
<text x="174" y="99" font-size="9.5" text-anchor="middle" fill="#0b5fa5">cap end at working pressure</text>
<line x1="100" y1="120" x2="100" y2="160" stroke="#0b5fa5" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="150" cy="140" r="10" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="147" y1="143" x2="154" y2="136" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>

<text x="166" y="144" font-size="9" text-anchor="start" fill="#1a2233">3,000 psi</text>
<line x1="100" y1="140" x2="140" y2="140" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<rect x="70" y="160" width="60" height="22" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="100" y="175" font-size="9" text-anchor="middle" fill="#1a2233">DCV</text>
<line x1="290" y1="70" x2="290" y2="40" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<rect x="284" y="30" width="12" height="10" fill="#b91c1c" stroke="#1a2233" stroke-width="1.5"/>
<text x="310" y="40" font-size="9" text-anchor="start" fill="#1a2233">rod-end line off,</text>
<text x="310" y="52" font-size="9" text-anchor="start" fill="#1a2233">line capped</text>
<line x1="290" y1="120" x2="290" y2="150" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round"/>
<circle cx="290" cy="158" r="2" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<circle cx="290" cy="168" r="2" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<circle cx="290" cy="178" r="2" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<rect x="270" y="184" width="40" height="30" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="290" y="203" font-size="9" text-anchor="middle" font-weight="600" fill="#1a2233">1 min</text>
<text x="330" y="175" font-size="9.5" text-anchor="start" fill="#166534">drops: seals ok</text>
<text x="330" y="189" font-size="9.5" text-anchor="start" fill="#b91c1c">stream: piston seals</text>
<text x="330" y="203" font-size="9.5" text-anchor="start" fill="#b91c1c">or a scored bore</text>
<text x="20" y="40" font-size="9" text-anchor="start" fill="#5b6577">lockout first · hot oil · rod cannot move</text>
<text x="250" y="234" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Repeat retracted with the ports swapped; test hot: cold seals pass.</text>
