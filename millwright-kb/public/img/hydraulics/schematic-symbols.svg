<text x="420" y="170" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="420" dy="0">solid line: pressure</tspan><tspan x="420" dy="12.5">dashed: pilot / drain</tspan></text>
<text x="250" y="252" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Read a schematic from the pump outward; arrows show flow direction.</text>
