<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Troubleshooting decision tree</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<rect x="170" y="12" width="160" height="28" fill="#fff4d6" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="250" y="29.5" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">symptom at which step?</text>
<line x1="250" y1="40" x2="250" y2="56" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="150" y="58" width="200" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="250" y="75.5" font-size="10" text-anchor="middle" fill="#1a2233">gauge at the actuator port</text>
<line x1="250" y1="86" x2="70" y2="108" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="70" y="104" font-size="8.5" text-anchor="middle" fill="#5b6577">low</text>
<line x1="250" y1="86" x2="250" y2="108" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="250" y="96" font-size="8.5" text-anchor="middle" fill="#5b6577">ok but slow</text>
<line x1="250" y1="86" x2="430" y2="108" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="430" y="104" font-size="8.5" text-anchor="middle" fill="#5b6577">ok but drifts / hot</text>
<rect x="10" y="110" width="120" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="70" y="127.325" font-size="9.5" text-anchor="middle" fill="#1a2233">gauge at the pump</text>
<rect x="190" y="110" width="120" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="250" y="127.325" font-size="9.5" text-anchor="middle" fill="#1a2233">flow test: pump (1)</text>
<rect x="370" y="110" width="120" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="430" y="127.325" font-size="9.5" text-anchor="middle" fill="#1a2233">heat map (12)</text>
<line x1="40" y1="138" x2="40" y2="160" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="48" y="154" font-size="8.5" text-anchor="start" fill="#5b6577">low</text>
<line x1="100" y1="138" x2="100" y2="160" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="106" y="154" font-size="8.5" text-anchor="start" fill="#5b6577">ok</text>
<rect x="4" y="162" width="68" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="38" y="174.35" font-size="8.5" text-anchor="middle" fill="#1a2233"><tspan x="38" dy="0">relief (2)</tspan><tspan x="38" dy="10.625">compensator</tspan><tspan x="38" dy="10.625">pump (1)</tspan></text>
<rect x="76" y="162" width="60" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="106" y="174.35" font-size="8.5" text-anchor="middle" fill="#1a2233"><tspan x="106" dy="0">restriction</tspan><tspan x="106" dy="10.625">or leak</tspan><tspan x="106" dy="10.625">between</tspan></text>
<line x1="220" y1="138" x2="220" y2="160" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="226" y="154" font-size="8.5" text-anchor="start" fill="#5b6577">pump ok</text>
<line x1="290" y1="138" x2="290" y2="160" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="296" y="154" font-size="8.5" text-anchor="start" fill="#5b6577">low</text>
<rect x="160" y="162" width="110" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="215" y="174.35" font-size="8.5" text-anchor="middle" fill="#1a2233"><tspan x="215" dy="0">cylinder bypass (3)</tspan><tspan x="215" dy="10.625">motor drain (5)</tspan><tspan x="215" dy="10.625">flow control, POC</tspan></text>
<rect x="276" y="162" width="74" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="313" y="174.35" font-size="8.5" text-anchor="middle" fill="#1a2233"><tspan x="313" dy="0">worn pump</tspan><tspan x="313" dy="10.625">suction (9)</tspan><tspan x="313" dy="10.625">rpm, oil</tspan></text>
<line x1="400" y1="138" x2="400" y2="160" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="406" y="154" font-size="8.5" text-anchor="start" fill="#5b6577">hot part</text>
<line x1="460" y1="138" x2="460" y2="160" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="466" y="154" font-size="8.5" text-anchor="start" fill="#5b6577">drift</text>
<rect x="360" y="162" width="72" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="396" y="174.62" font-size="8.2" text-anchor="middle" fill="#1a2233"><tspan x="396" dy="0">relief dumping</tspan><tspan x="396" dy="10.25">check leaking</tspan><tspan x="396" dy="10.25">cylinder bypass</tspan></text>
<rect x="436" y="162" width="60" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="466" y="174.35" font-size="8.5" text-anchor="middle" fill="#1a2233"><tspan x="466" dy="0">decay test</tspan><tspan x="466" dy="10.625">(6), then</tspan><tspan x="466" dy="10.625">bypass (3)</tspan></text>
<rect x="60" y="222" width="380" height="26" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="250" y="238.15" font-size="9" text-anchor="middle" fill="#1a2233">shifts on override only = electrical · shifts on neither = pilot pressure or stuck spool</text>
<rect x="60" y="254" width="380" height="26" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="250" y="270.15" font-size="9" text-anchor="middle" fill="#1a2233">erratic = air first · intermittent = log coil voltage and pressure through the fault</text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Numbers = the tests in the article; change one thing, retest.</text>
</svg>