<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>ISO 4406 codes</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="230" fill="#ffffff"/>
<text x="250" y="22" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">ISO 4406 cleanliness code: three numbers = counts at 4, 6 and 14 µm</text>
<rect x="20" y="36" width="480" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="52.32" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">ISO code</text>
<text x="104" y="52.32" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">Particles/mL &gt;4 µm / &gt;6 µm / &gt;14 µm</text>
<text x="340" y="52.32" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">Typical target</text>
<rect x="20" y="60" width="480" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="76.32" font-size="9.5" text-anchor="start" fill="#1a2233">22/20/17</text>
<text x="104" y="76.32" font-size="9.5" text-anchor="start" fill="#1a2233">20,000-40,000 / 5,000-10,000 / 640-1,300</text>
<text x="340" y="76.32" font-size="9.5" text-anchor="start" fill="#1a2233">new oil from the drum (dirty!)</text>
<rect x="20" y="84" width="480" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="100.32" font-size="9.5" text-anchor="start" fill="#1a2233">20/18/15</text>
<text x="104" y="100.32" font-size="9.5" text-anchor="start" fill="#1a2233">5,000-10,000 / 1,300-2,500 / 160-320</text>
<text x="340" y="100.32" font-size="9.5" text-anchor="start" fill="#1a2233">gear pumps, low pressure</text>
<rect x="20" y="108" width="480" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="124.32" font-size="9.5" text-anchor="start" fill="#1a2233">18/16/13</text>
<text x="104" y="124.32" font-size="9.5" text-anchor="start" fill="#1a2233">1,300-2,500 / 320-640 / 40-80</text>
<text x="340" y="124.32" font-size="9.5" text-anchor="start" fill="#1a2233">general hydraulics, piston</text>
<rect x="20" y="132" width="480" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="148.32" font-size="9.5" text-anchor="start" fill="#1a2233">16/14/11</text>
<text x="104" y="148.32" font-size="9.5" text-anchor="start" fill="#1a2233">320-640 / 80-160 / 10-20</text>
<text x="340" y="148.32" font-size="9.5" text-anchor="start" fill="#1a2233">servo and proportional valves</text>
<rect x="20" y="156" width="480" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="172.32" font-size="9.5" text-anchor="start" fill="#1a2233">14/12/9</text>
<text x="104" y="172.32" font-size="9.5" text-anchor="start" fill="#1a2233">80-160 / 20-40 / 2.5-5</text>
<text x="340" y="172.32" font-size="9.5" text-anchor="start" fill="#1a2233">high-pressure servo systems</text>
<text x="250" y="222" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Filter new oil going in; sample from a live line at mid-level, running.</text>
</svg>