<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>DIN bite ring assembly</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<path d="M40,70 L150,70 L150,92 L176,104 L176,136 L150,148 L150,170 L40,170 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="90" y="124" font-size="10" text-anchor="middle" font-weight="600" fill="#1a2233">body</text>
<text x="163" y="88" font-size="9" text-anchor="start" fill="#0b5fa5">24°</text>
<rect x="176" y="96" width="140" height="48" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="246" y="124" font-size="10" text-anchor="middle" font-weight="600" fill="#1a2233">nut</text>
<rect x="150" y="108" width="180" height="24" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<rect x="150" y="108" width="180" height="24" fill="none" stroke="#1a2233" stroke-width="1.5"/>
<text x="300" y="124" font-size="9.5" text-anchor="middle" fill="#1a2233">tube</text>
<line x1="150" y1="108" x2="150" y2="132" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
<text x="150" y="158" font-size="8.5" text-anchor="middle" fill="#b91c1c">bottomed</text>
<text x="150" y="168" font-size="8.5" text-anchor="middle" fill="#b91c1c">in the cone</text>
<path d="M164,104 L184,100 L184,140 L164,136 Z" fill="#d4a017" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="190" y="92" font-size="8.5" text-anchor="start" fill="#b45309">ring</text>
<line x1="168" y1="108" x2="160" y2="112" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<text x="206" y="156" font-size="8.5" text-anchor="start" fill="#b45309">cutting edge toward the body</text>
<text x="330" y="40" font-size="10.5" text-anchor="start" font-weight="700" fill="#1a2233">Assembly</text>
<circle cx="339" cy="54" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="339" y="58" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="354" y="58" font-size="8.4" text-anchor="start" fill="#1a2233">cut square, deburr, mark depth</text>
<circle cx="339" cy="67" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="339" y="71" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="354" y="71" font-size="8.4" text-anchor="start" fill="#1a2233">nut, then ring (edge forward)</text>
<circle cx="339" cy="80" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="339" y="84" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="354" y="84" font-size="8.4" text-anchor="start" fill="#1a2233">tube bottomed; hold it there</text>
<circle cx="339" cy="93" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="339" y="97" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="354" y="97" font-size="8.4" text-anchor="start" fill="#1a2233"><tspan x="354" dy="0">pre-assemble 1¼-1½ turns past</tspan><tspan x="354" dy="10.5">resistance (collar 80%+)</tspan></text>
<circle cx="339" cy="116.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="339" y="120.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text><text x="354" y="120.5" font-size="8.4" text-anchor="start" fill="#1a2233">final: hand-tight + 1/4-1/2 turn</text>
<circle cx="339" cy="129.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="339" y="133.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text><text x="354" y="133.5" font-size="8.4" text-anchor="start" fill="#1a2233">re-assembly: 1/4 turn only</text>
<text x="40" y="200" font-size="9.5" text-anchor="start" font-weight="700" fill="#1a2233">Same thread, two cones:</text>
<text x="40" y="214" font-size="9" text-anchor="start" fill="#5b6577">M14: 8L or 6S · M16: 10L or 8S · M18: 12L or 10S</text>
<text x="40" y="226" font-size="9" text-anchor="start" fill="#5b6577">M22: 15L or 14S · M30: 22L or 20S · M36: 28L or 25S</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Identify by tube OD and the L or S stamping on the nut.</text>
</svg>