<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Fluid classes</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<rect x="180" y="14" width="140" height="28" fill="#fff4d6" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="250" y="31.85" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">Hydraulic fluids</text>
<line x1="250" y1="42" x2="70" y2="64" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<rect x="15" y="64" width="110" height="24" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="70" y="79.5" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">Mineral</text>
<text x="70" y="106" font-size="8.6" text-anchor="middle" fill="#1a2233">HL: R&amp;O, no AW</text>
<text x="70" y="121" font-size="8.6" text-anchor="middle" fill="#1a2233">HM / HLP: AW (zinc)</text>
<text x="70" y="136" font-size="8.6" text-anchor="middle" fill="#1a2233">HV / HVLP: + VI improver</text>
<text x="70" y="151" font-size="8.6" text-anchor="middle" fill="#1a2233">HLPD: + detergent</text>
<text x="70" y="166" font-size="8.6" text-anchor="middle" fill="#1a2233">zinc-free HM: ashless</text>
<line x1="250" y1="42" x2="190" y2="64" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<rect x="135" y="64" width="110" height="24" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="190" y="79.5" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">Fire-resistant</text>
<text x="190" y="106" font-size="8.6" text-anchor="middle" fill="#1a2233">HFAE/S: 95% water</text>
<text x="190" y="121" font-size="8.6" text-anchor="middle" fill="#1a2233">HFB: invert emulsion</text>
<text x="190" y="136" font-size="8.6" text-anchor="middle" fill="#1a2233">HFC: water-glycol</text>
<text x="190" y="151" font-size="8.6" text-anchor="middle" fill="#1a2233">HFDR: phosphate ester</text>
<text x="190" y="166" font-size="8.6" text-anchor="middle" fill="#1a2233">HFDU: polyol ester</text>
<line x1="250" y1="42" x2="310" y2="64" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<rect x="255" y="64" width="110" height="24" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="310" y="79.5" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">Biodegradable</text>
<text x="310" y="106" font-size="8.6" text-anchor="middle" fill="#1a2233">HETG: vegetable</text>
<text x="310" y="121" font-size="8.6" text-anchor="middle" fill="#1a2233">HEES: synthetic ester</text>
<text x="310" y="136" font-size="8.6" text-anchor="middle" fill="#1a2233">HEPG: PAG (no mixing)</text>
<text x="310" y="151" font-size="8.6" text-anchor="middle" fill="#1a2233">HEPR: PAO</text>
<line x1="250" y1="42" x2="430" y2="64" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<rect x="375" y="64" width="110" height="24" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="430" y="79.5" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">Machine-specific</text>
<text x="430" y="106" font-size="8.6" text-anchor="middle" fill="#1a2233">UTTO / tractor fluid</text>
<text x="430" y="121" font-size="8.6" text-anchor="middle" fill="#1a2233">engine oil, HYDO, TO-4</text>
<text x="430" y="136" font-size="8.6" text-anchor="middle" fill="#1a2233">ATF (Dexron)</text>
<text x="430" y="151" font-size="8.6" text-anchor="middle" fill="#1a2233">aviation 5606 / 83282</text>
<text x="430" y="166" font-size="8.6" text-anchor="middle" fill="#1a2233">food grade H1</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Grade = viscosity; class = chemistry; approvals = the pump.</text>
</svg>