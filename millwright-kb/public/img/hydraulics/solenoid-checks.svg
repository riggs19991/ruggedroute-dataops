<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 246" width="500" height="246" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Solenoid checks</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="246" fill="#ffffff"/>
<rect x="40" y="80" width="60" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="70" y="106" font-size="10" text-anchor="middle" fill="#1a2233">valve</text>
<text x="70" y="120" font-size="10" text-anchor="middle" fill="#1a2233">body</text>
<rect x="100" y="96" width="130" height="28" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="140" y="84" width="70" height="52" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" rx="3" opacity="0.9"/>
<line x1="146" y1="88" x2="146" y2="132" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>
<line x1="159" y1="88" x2="159" y2="132" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>
<line x1="172" y1="88" x2="172" y2="132" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>
<line x1="185" y1="88" x2="185" y2="132" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>
<line x1="198" y1="88" x2="198" y2="132" stroke="#b45309" stroke-width="1" stroke-linecap="round"/>
<rect x="110" y="104" width="26" height="12" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="100" y1="110" x2="110" y2="110" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<rect x="226" y="100" width="18" height="20" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="2"/>
<line x1="244" y1="110" x2="258" y2="110" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<text x="262" y="114" font-size="9" text-anchor="start" fill="#1a2233">override pin</text>
<rect x="150" y="56" width="40" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="170" y="74" font-size="9" text-anchor="middle" fill="#1a2233">plug</text>
<line x1="190" y1="70" x2="250" y2="70" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="254" y="74" font-size="9" text-anchor="start" fill="#1a2233">to PLC</text>
<circle cx="210" cy="56" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="210" y="60" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="123" cy="148" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="123" y="152" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="250" cy="128" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="250" y="132" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="106" cy="74" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="106" y="78" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="49" cy="172" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="49" y="176" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="64" y="176" font-size="9.2" text-anchor="start" fill="#1a2233">voltage at the pins, coil connected, output on: ±10% of rated</text>
<circle cx="49" cy="186" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="49" y="190" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="64" y="190" font-size="9.2" text-anchor="start" fill="#1a2233">coil Ω with plug off: 24 V DC 30 W ≈ 19 Ω; open = burned, low = shorted</text>
<circle cx="49" cy="200" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="49" y="204" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="64" y="204" font-size="9.2" text-anchor="start" fill="#1a2233">override pin shifts the spool by hand: moves = electrical fault</text>
<circle cx="49" cy="214" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="49" y="218" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="64" y="218" font-size="9.2" text-anchor="start" fill="#1a2233">tube nut hand-tight + 1/4 turn; gasket in the plug</text>
<text x="340" y="100" font-size="9.5" text-anchor="start" fill="#b91c1c">AC: inrush stays high if</text>
<text x="340" y="112" font-size="9.5" text-anchor="start" fill="#b91c1c">the spool does not stroke</text>
<text x="340" y="124" font-size="9.5" text-anchor="start" fill="#b91c1c">→ coil burns in minutes</text>
<text x="340" y="144" font-size="9.5" text-anchor="start" fill="#0b5fa5">DC: runs warm, half-shifts</text>
<text x="250" y="238" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">A lit LED proves power at the plug, not that the spool moved.</text>
</svg>