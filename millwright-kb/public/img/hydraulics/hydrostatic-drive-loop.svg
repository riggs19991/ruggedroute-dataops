<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 302" width="500" height="302" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Hydrostatic drive loop</title>
<defs>
