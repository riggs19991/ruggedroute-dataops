<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Pilot-operated DCV</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<rect x="120" y="40" width="120" height="34" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="180" y="61" font-size="10" text-anchor="middle" font-weight="600" fill="#1a2233">pilot valve (D03)</text>
<rect x="100" y="46" width="20" height="22" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<rect x="240" y="46" width="20" height="22" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<rect x="120" y="78" width="120" height="26" fill="#fff4d6" stroke="#b45309" stroke-width="1.5"/>
<text x="180" y="95" font-size="9" text-anchor="middle" fill="#1a2233">pilot choke plate (optional)</text>
<rect x="80" y="108" width="200" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="96" y="128" width="168" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="112" y="128" width="16" height="20" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="152" y="128" width="16" height="20" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="192" y="128" width="16" height="20" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="232" y="128" width="16" height="20" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="180" y="162" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1a2233">main stage (D05-D10)</text>
<line x1="100" y1="168" x2="100" y2="190" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="100" y="202" font-size="9.5" text-anchor="middle" fill="#1a2233">A</text>
<line x1="140" y1="168" x2="140" y2="190" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="140" y="202" font-size="9.5" text-anchor="middle" fill="#1a2233">P</text>
<line x1="180" y1="168" x2="180" y2="190" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="180" y="202" font-size="9.5" text-anchor="middle" fill="#1a2233">T</text>
<line x1="220" y1="168" x2="220" y2="190" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="220" y="202" font-size="9.5" text-anchor="middle" fill="#1a2233">B</text>
<line x1="300" y1="118" x2="280" y2="118" stroke="#1a2233" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="304" y="121" font-size="9.5" text-anchor="start" fill="#1a2233">X pilot supply</text>
<text x="304" y="133" font-size="9" text-anchor="start" fill="#5b6577">50-150 psi min.</text>
<line x1="300" y1="150" x2="280" y2="150" stroke="#1a2233" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="304" y="153" font-size="9.5" text-anchor="start" fill="#1a2233">Y pilot drain</text>
<text x="304" y="165" font-size="9" text-anchor="start" fill="#5b6577">external if T &gt; 100-150 psi</text>
<text x="12" y="121" font-size="8.5" text-anchor="start" fill="#5b6577">plug selects</text>
<text x="12" y="133" font-size="8.5" text-anchor="start" fill="#5b6577">internal or</text>
<text x="12" y="145" font-size="8.5" text-anchor="start" fill="#5b6577">external pilot</text>
<text x="250" y="222" font-size="9.2" text-anchor="middle" fill="#5b6577">open or tandem centre: P is near zero at rest → external pilot or a 75 psi check in T</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Will not shift: LED, override, then a gauge at X, then back-pressure at Y.</text>
</svg>