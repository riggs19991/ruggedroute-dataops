<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Hydraulic fitting types</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<text x="60" y="44" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">JIC 37°</text>
<path d="M40,60 L80,60 L80,100 L68,112 L52,112 L40,100 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="40" y1="100" x2="52" y2="112" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
<line x1="80" y1="100" x2="68" y2="112" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
<text x="60" y="135" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="60" dy="0">cone seat,</tspan><tspan x="60" dy="11.25">no sealant</tspan></text>
<text x="155" y="44" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">ORFS</text>
<rect x="135" y="60" width="40" height="50" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="139" y="108" width="32" height="6" fill="#333" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="155" y="135" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="155" dy="0">O-ring on a</tspan><tspan x="155" dy="11.25">flat face</tspan></text>
<text x="250" y="44" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">ORB (SAE)</text>
<rect x="236" y="60" width="28" height="40" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="228" y="100" width="44" height="8" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="230" y="96" width="40" height="4" fill="#333" stroke="#1a2233" stroke-width="1.5"/>
<text x="250" y="135" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="250" dy="0">straight thread,</tspan><tspan x="250" dy="11.25">O-ring at boss</tspan></text>
<text x="345" y="44" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">NPT</text>
<path d="M329,60 L361,60 L357,112 L333,112 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="330" y1="66" x2="360" y2="66" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="330.7" y1="76" x2="359.3" y2="76" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="331.4" y1="86" x2="358.6" y2="86" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="332.1" y1="96" x2="357.9" y2="96" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="332.8" y1="106" x2="357.2" y2="106" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<text x="345" y="135" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="345" dy="0">tapered thread,</tspan><tspan x="345" dy="11.25">sealant, 2-3 turns</tspan></text>
<text x="440" y="44" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a2233">BSPP</text>
<rect x="426" y="60" width="28" height="46" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="426" y1="68" x2="454" y2="68" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="426" y1="78" x2="454" y2="78" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="426" y1="88" x2="454" y2="88" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<line x1="426" y1="98" x2="454" y2="98" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
<rect x="420" y="106" width="40" height="6" fill="#333" stroke="#1a2233" stroke-width="1.5"/>
<text x="440" y="135" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="440" dy="0">55° straight,</tspan><tspan x="440" dy="11.25">bonded washer</tspan></text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Never mix JIC and 45° flare, NPT and BSPT: they thread on and leak.</text>
<text x="250" y="195" font-size="10" text-anchor="middle" fill="#5b6577">Bend radius: hose min. per the layline; no twist (follow the layline); clamp long runs</text>
</svg>