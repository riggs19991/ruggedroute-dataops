<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Logic valve cross-section</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="310" fill="#ffffff"/>
<rect x="150" y="60" width="140" height="190" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="180" y="90" width="80" height="160" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<rect x="150" y="40" width="140" height="22" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="220" y="55" font-size="9.5" text-anchor="middle" fill="#fff">cover: pilot circuit, X port</text>
<path d="M192,100 L248,100 L248,190 L232,222 L208,222 L192,190 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="220" y="150" font-size="10" text-anchor="middle" font-weight="600" fill="#1a2233">poppet</text>
<path d="M206,72 l4,-6 l4,6" fill="none" stroke="#1a2233" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M216,72 l4,-6 l4,6" fill="none" stroke="#1a2233" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M226,72 l4,-6 l4,6" fill="none" stroke="#1a2233" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="262" y="72" font-size="8.5" text-anchor="start" fill="#5b6577">spring</text>
<rect x="180" y="222" width="80" height="28" fill="#dbeafe" stroke="none" stroke-width="1.5"/>
<rect x="180" y="190" width="12" height="32" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
<rect x="248" y="190" width="12" height="32" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
<line x1="220" y1="250" x2="220" y2="280" stroke="#0b5fa5" stroke-width="2.5" stroke-linecap="round"/>
<text x="220" y="292" font-size="9.5" text-anchor="middle" fill="#0b5fa5">A (nose, axial)</text>
<line x1="290" y1="205" x2="330" y2="205" stroke="#0b5fa5" stroke-width="2.5" stroke-linecap="round"/>
<text x="334" y="209" font-size="9.5" text-anchor="start" fill="#0b5fa5">B (side, radial)</text>
<line x1="220" y1="40" x2="220" y2="20" stroke="#1a2233" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="228" y="24" font-size="9.5" text-anchor="start" fill="#1a2233">X (spring chamber)</text>
<line x1="192" y1="236" x2="248" y2="236" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="220" y="232" font-size="9" text-anchor="middle" fill="#b91c1c">A_A</text>
<line x1="260" y1="196" x2="290" y2="196" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="275" y="192" font-size="9" text-anchor="middle" fill="#b91c1c">A_B</text>
<line x1="192" y1="92" x2="248" y2="92" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="220" y="88" font-size="9" text-anchor="middle" fill="#b91c1c">A_X = A_A + A_B</text>
<text x="20" y="120" font-size="10" text-anchor="start" font-weight="700" fill="#1a2233">opens when</text>
<text x="20" y="136" font-size="10" text-anchor="start" fill="#1a2233">pA·A_A + pB·A_B</text>
<text x="20" y="150" font-size="10" text-anchor="start" fill="#1a2233">&gt; pX·A_X + spring</text>
<text x="20" y="176" font-size="9.5" text-anchor="start" fill="#1a2233">X to tank: open</text>
<text x="20" y="190" font-size="9.5" text-anchor="start" fill="#1a2233">X to max(A,B):</text>
<text x="20" y="202" font-size="9.5" text-anchor="start" fill="#1a2233">closed, leak-free</text>
<text x="20" y="216" font-size="9.5" text-anchor="start" fill="#1a2233">X via a pilot relief:</text>
<text x="20" y="228" font-size="9.5" text-anchor="start" fill="#1a2233">big relief valve</text>
<text x="340" y="120" font-size="9.5" text-anchor="start" font-weight="700" fill="#1a2233">area ratio A_A : A_X</text>
<text x="340" y="136" font-size="9" text-anchor="start" fill="#1a2233">1:1   no annulus, pressure duty</text>
<text x="340" y="150" font-size="9" text-anchor="start" fill="#1a2233">1:1.1  directional, check</text>
<text x="340" y="164" font-size="9" text-anchor="start" fill="#1a2233">1:1.5, 1:2  check B→A,</text>
<text x="340" y="176" font-size="9" text-anchor="start" fill="#1a2233">throttle</text>
<text x="250" y="302" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Drift = a leaking pilot or seat; will not open = X never vented.</text>
</svg>