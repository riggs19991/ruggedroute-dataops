<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 314" width="500" height="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Stack valve order</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="314" fill="#ffffff"/>
<rect x="60" y="262" width="220" height="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="170" y="277" font-size="9.5" text-anchor="middle" fill="#1a2233">subplate / bar manifold</text>
<circle cx="48" cy="273" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="48" y="277" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<text x="288" y="277" font-size="9" text-anchor="start" fill="#5b6577">P T A B</text>
<rect x="80" y="228" width="180" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="170" y="246" font-size="9.5" text-anchor="middle" fill="#1a2233">pressure reducing (P)</text>
<circle cx="68" cy="242" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="68" y="246" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<text x="268" y="246" font-size="9" text-anchor="start" fill="#5b6577">P · drain to T</text>
<rect x="80" y="194" width="180" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="170" y="212" font-size="9.5" text-anchor="middle" fill="#1a2233">load check (P)</text>
<circle cx="68" cy="208" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="68" y="212" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<text x="268" y="212" font-size="9" text-anchor="start" fill="#5b6577">P</text>
<rect x="80" y="160" width="180" height="28" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="170" y="178" font-size="9.5" text-anchor="middle" fill="#1a2233">pilot-operated check (A, B)</text>
<circle cx="68" cy="174" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="68" y="178" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<text x="268" y="178" font-size="9" text-anchor="start" fill="#5b6577">A B · holds the load</text>
<rect x="80" y="126" width="180" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="170" y="144" font-size="9.5" text-anchor="middle" fill="#1a2233">flow control meter-out (A, B)</text>
<circle cx="68" cy="140" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="68" y="144" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<text x="268" y="144" font-size="9" text-anchor="start" fill="#5b6577">A B · speed</text>
<rect x="80" y="92" width="180" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="170" y="110" font-size="9.5" text-anchor="middle" fill="#1a2233">gauge / pressure switch plate</text>
<circle cx="68" cy="106" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="68" y="110" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text>
<text x="268" y="110" font-size="9" text-anchor="start" fill="#5b6577">P or A/B</text>
<rect x="80" y="58" width="180" height="28" fill="#fff4d6" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<text x="170" y="76" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1a2233">directional valve (D03)</text>
<circle cx="68" cy="72" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="68" y="76" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">7</text>
<text x="268" y="76" font-size="9" text-anchor="start" fill="#5b6577">on top</text>
<line x1="95" y1="44" x2="95" y2="292" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3" stroke-linecap="round"/>
<line x1="245" y1="44" x2="245" y2="292" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3" stroke-linecap="round"/>
<text x="170" y="36" font-size="9" text-anchor="middle" fill="#b45309">tie rods (4)</text>
<text x="372" y="60" font-size="9.2" text-anchor="start" font-weight="700" fill="#1a2233">From the manifold up:</text>
<text x="372" y="76" font-size="8.6" text-anchor="start" fill="#5b6577">each module sees only what</text>
<text x="372" y="88" font-size="8.6" text-anchor="start" fill="#5b6577">the ones below pass up</text>
<text x="372" y="112" font-size="8.6" text-anchor="start" fill="#5b6577">POC under the flow control:</text>
<text x="372" y="124" font-size="8.6" text-anchor="start" fill="#5b6577">full pilot, smooth lowering</text>
<text x="372" y="148" font-size="8.6" text-anchor="start" fill="#5b6577">Reducing valve lowest:</text>
<text x="372" y="160" font-size="8.6" text-anchor="start" fill="#5b6577">everything above sees it</text>
<text x="372" y="184" font-size="8.6" text-anchor="start" fill="#5b6577">Torque D03 M5: 6-7 ft-lb</text>
<text x="372" y="196" font-size="8.6" text-anchor="start" fill="#5b6577">D05 M6: 11-13 ft-lb</text>
<text x="372" y="208" font-size="8.6" text-anchor="start" fill="#5b6577">cross pattern, two stages</text>
<text x="372" y="232" font-size="8.6" text-anchor="start" fill="#5b6577">new O-rings on every face</text>
<text x="372" y="244" font-size="8.6" text-anchor="start" fill="#5b6577">read the A/B stamping</text>
<text x="250" y="306" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Uneven torque bows the stack and the spool on top sticks.</text>
</svg>