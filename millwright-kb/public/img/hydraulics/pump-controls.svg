<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Pump controls</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<circle cx="80" cy="120" r="34" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<path d="M80,86 L86,97 L74,97 Z" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="42" y1="158" x2="118" y2="82" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="80" y1="154" x2="80" y2="190" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<path d="M68,190 L68,202 L92,202 L92,190" fill="none" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80" y1="86" x2="80" y2="40" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<line x1="80" y1="40" x2="180" y2="40" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="186" y="44" font-size="10" text-anchor="start" fill="#1a2233">P out</text>
<rect x="122" y="96" width="44" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="144" y="108" font-size="9" text-anchor="middle" fill="#1a2233">control</text>
<text x="144" y="120" font-size="9" text-anchor="middle" fill="#1a2233">spool</text>
<line x1="144" y1="96" x2="144" y2="40" stroke="#1a2233" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<rect x="122" y="136" width="44" height="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="144" y="150" font-size="9" text-anchor="middle" fill="#1a2233">stroker</text>
<line x1="114" y1="147" x2="122" y2="147" stroke="#1a2233" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="114" y1="147" x2="114" y2="128" stroke="#1a2233" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="166" y1="111" x2="200" y2="111" stroke="#1a2233" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="203" y="114" font-size="9" text-anchor="start" fill="#1a2233">LS in</text>
<text x="84" y="222" font-size="9.5" text-anchor="middle" fill="#5b6577">swashplate = displacement</text>
<rect x="232" y="34" width="260" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="238" y="50.32" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">Control</text>
<text x="318" y="50.32" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">Holds</text>
<text x="402" y="50.32" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">Set to</text>
<rect x="232" y="58" width="260" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="238" y="74.32" font-size="9.5" text-anchor="start" fill="#1a2233">Compensator</text>
<text x="318" y="74.32" font-size="9.5" text-anchor="start" fill="#1a2233">max. pressure</text>
<text x="402" y="74.32" font-size="9.5" text-anchor="start" fill="#1a2233">relief −200 psi</text>
<rect x="232" y="82" width="260" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="238" y="98.32" font-size="9.5" text-anchor="start" fill="#1a2233">Load sense</text>
<text x="318" y="98.32" font-size="9.5" text-anchor="start" fill="#1a2233">load + margin</text>
<text x="402" y="98.32" font-size="9.5" text-anchor="start" fill="#1a2233">200-350 psi</text>
<rect x="232" y="106" width="260" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="238" y="122.32" font-size="9.5" text-anchor="start" fill="#1a2233">Torque limiter</text>
<text x="318" y="122.32" font-size="9.5" text-anchor="start" fill="#1a2233">p × Q ≤ hp</text>
<text x="402" y="122.32" font-size="9.5" text-anchor="start" fill="#1a2233">maker curve</text>
<rect x="232" y="130" width="260" height="24" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="238" y="146.32" font-size="9.5" text-anchor="start" fill="#1a2233">Remote comp.</text>
<text x="318" y="146.32" font-size="9.5" text-anchor="start" fill="#1a2233">remote relief</text>
<text x="402" y="146.32" font-size="9.5" text-anchor="start" fill="#1a2233">below local</text>
<text x="232" y="172" font-size="9.5" text-anchor="start" fill="#5b6577">Order: relief → compensator → LS margin → branches</text>
<text x="232" y="188" font-size="9.5" text-anchor="start" fill="#5b6577">Compensator above the relief = full flow</text>
<text x="232" y="202" font-size="9.5" text-anchor="start" fill="#5b6577">over the relief and a boiling tank</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Lock both screws and write both values on the pump.</text>
</svg>