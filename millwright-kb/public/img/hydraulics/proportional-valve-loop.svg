<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Proportional valve loop</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="200" fill="#ffffff"/>
<rect x="20" y="40" width="80" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="60" y="57.525" font-size="9" text-anchor="middle" fill="#1a2233"><tspan x="60" dy="0">command</tspan><tspan x="60" dy="11.25">±10 V, 4-20 mA</tspan></text>
<line x1="100" y1="60" x2="128" y2="60" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="130" y="30" width="120" height="60" fill="#fff4d6" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="190" y="51.9" font-size="9" text-anchor="middle" fill="#1a2233"><tspan x="190" dy="0">amplifier / OBE</tspan><tspan x="190" dy="11.25">ramp · deadband</tspan><tspan x="190" dy="11.25">gain · Imin · dither</tspan></text>
<line x1="250" y1="60" x2="278" y2="60" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="264" y="52" font-size="8" text-anchor="middle" fill="#5b6577">PWM</text>
<text x="264" y="76" font-size="8" text-anchor="middle" fill="#5b6577">current</text>
<rect x="280" y="40" width="80" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="320" y="57.525" font-size="9" text-anchor="middle" fill="#1a2233"><tspan x="320" dy="0">proportional</tspan><tspan x="320" dy="11.25">solenoid</tspan></text>
<line x1="360" y1="60" x2="388" y2="60" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="390" y="40" width="90" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="435" y="57.525" font-size="9" text-anchor="middle" fill="#1a2233"><tspan x="435" dy="0">spool</tspan><tspan x="435" dy="11.25">(flow ∝ position)</tspan></text>
<rect x="390" y="100" width="90" height="24" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="435" y="116" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1a2233">LVDT</text>
<line x1="435" y1="80" x2="435" y2="100" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round"/>
<path d="M390,112 L190,112 L190,90" fill="none" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="290" y="126" font-size="9" text-anchor="middle" fill="#0b5fa5">position feedback (closed loop: hysteresis &lt; 1%)</text>
<text x="250" y="156" font-size="9" text-anchor="middle" fill="#5b6577">check: command at the card → current at the test point → feedback follows → pilot pressure at X</text>
<text x="250" y="172" font-size="9" text-anchor="middle" fill="#5b6577">dither to zero = sticking · gain too high = buzzing · no enable = dead valve</text>
<text x="250" y="192" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Swap a card-driven valve and the settings go with the card, not the valve.</text>
</svg>