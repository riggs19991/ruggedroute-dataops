<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Propane versus acetylene</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="280" fill="#ffffff"/>
<text x="130" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Acetylene, one-piece tip</text>
<rect x="40" y="50" width="60" height="28" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<circle cx="100" cy="56" r="1.5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="100" cy="62" r="1.5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="100" cy="68" r="1.5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="100" cy="74" r="1.5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<path d="M100,64 C130,40 150,88 100,64" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M100,64 C118,52 128,76 100,64" fill="#bfdbfe" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="130" y="100" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">short sharp inner cone,</tspan><tspan x="130" dy="12.5">fast preheat, 5,600°F</tspan></text>
<text x="370" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Propane, two-piece tip</text>
<rect x="280" y="50" width="60" height="28" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="3"/>
<rect x="332" y="52" width="8" height="24" fill="#b87333" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="340" cy="56" r="1.5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="340" cy="62" r="1.5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="340" cy="68" r="1.5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="340" cy="74" r="1.5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<path d="M340,64 C400,30 430,98 340,64" fill="#fff4d6" stroke="#b45309" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M340,64 C365,50 380,78 340,64" fill="#fde68a" stroke="#b45309" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="380" y="100" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="380" dy="0">longer, softer cone with recessed</tspan><tspan x="380" dy="12.5">skirt; slower preheat, 5,100°F</tspan></text>
<rect x="40" y="125" width="420" height="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="138.6" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233"></text>
<text x="166" y="138.6" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">acetylene</text>
<text x="306" y="138.6" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">propane / propylene</text>
<rect x="40" y="145" width="420" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="158.6" font-size="10.5" text-anchor="start" fill="#1a2233">tip</text>
<text x="166" y="158.6" font-size="10.5" text-anchor="start" fill="#1a2233">1-101 (one piece)</text>
<text x="306" y="158.6" font-size="10.5" text-anchor="start" fill="#1a2233">GPN / GPP (two piece)</text>
<rect x="40" y="165" width="420" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="178.6" font-size="10.5" text-anchor="start" fill="#1a2233">fuel psi, 1/2 in</text>
<text x="166" y="178.6" font-size="10.5" text-anchor="start" fill="#1a2233">3 to 5</text>
<text x="306" y="178.6" font-size="10.5" text-anchor="start" fill="#1a2233">2 to 8 (propane)</text>
<rect x="40" y="185" width="420" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="198.6" font-size="10.5" text-anchor="start" fill="#1a2233">oxygen psi, 1/2 in</text>
<text x="166" y="198.6" font-size="10.5" text-anchor="start" fill="#1a2233">30 to 35</text>
<text x="306" y="198.6" font-size="10.5" text-anchor="start" fill="#1a2233">35 to 45</text>
<rect x="40" y="205" width="420" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="218.6" font-size="10.5" text-anchor="start" fill="#1a2233">oxygen used</text>
<text x="166" y="218.6" font-size="10.5" text-anchor="start" fill="#1a2233">x 1</text>
<text x="306" y="218.6" font-size="10.5" text-anchor="start" fill="#1a2233">about x 1.5</text>
<rect x="40" y="225" width="420" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="238.6" font-size="10.5" text-anchor="start" fill="#1a2233">preheat time</text>
<text x="166" y="238.6" font-size="10.5" text-anchor="start" fill="#1a2233">fast</text>
<text x="306" y="238.6" font-size="10.5" text-anchor="start" fill="#1a2233">slower; hold longer</text>
<text x="250" y="272" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Same torch, different tip and pressures; grade T hose for propane.</text>
</svg>