<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Oxy-fuel flame types</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<rect x="30" y="40" width="40" height="20" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<path d="M70,42 L120,47 L120,53 L70,58 Z" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M70,45 L160,48 L160,52 L70,55 Z" fill="none" stroke="#9bd" stroke-width="1.5" stroke-dasharray="2 2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M70,38 L300,50 L70,62 Z" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="42" font-size="11" text-anchor="start" font-weight="600" fill="#1a2233">Carburising (excess C2H2)</text>
<text x="318" y="58" font-size="9.5" text-anchor="start" fill="#5b6577"><tspan x="318" dy="0">feather past the cone;</tspan><tspan x="318" dy="11.875">hardfacing, bronze</tspan></text>
<rect x="30" y="108" width="40" height="20" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<path d="M70,110 L120,115 L120,121 L70,126 Z" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M70,106 L300,118 L70,130 Z" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="110" font-size="11" text-anchor="start" font-weight="600" fill="#1a2233">Neutral (1:1)</text>
<text x="318" y="126" font-size="9.5" text-anchor="start" fill="#5b6577"><tspan x="318" dy="0">sharp cone, no feather;</tspan><tspan x="318" dy="11.875">cut, weld, heat</tspan></text>
<rect x="30" y="176" width="40" height="20" fill="#b87333" stroke="#b45309" stroke-width="1.5"/>
<path d="M70,180 L102,184 L102,188 L70,192 Z" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M70,176 L240,186 L70,196 Z" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="318" y="178" font-size="11" text-anchor="start" font-weight="600" fill="#1a2233">Oxidising (excess O2)</text>
<text x="318" y="194" font-size="9.5" text-anchor="start" fill="#5b6577"><tspan x="318" dy="0">short hissing cone;</tspan><tspan x="318" dy="11.875">brass only, burns steel</tspan></text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Set neutral by adding oxygen until the feather just disappears into the cone.</text>
</svg>