<circle cx="39" cy="244" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="39" y="248" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="54" y="248" font-size="10.5" text-anchor="start" fill="#1a2233">chain or strap at 2/3 height, upright, caps on when not in use</text>
<circle cx="39" cy="262" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="39" y="266" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="54" y="266" font-size="10.5" text-anchor="start" fill="#1a2233">empties marked and kept separate; away from heat, oil, grease and exits</text>
