<rect x="101" y="70" width="12" height="10" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="385" y="70" width="12" height="10" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="413" y="70" width="12" height="10" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="441" y="70" width="12" height="10" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="250" y="165" font-size="10.5" text-anchor="middle" fill="#5b6577"><tspan x="250" dy="0">chain or strap at 2/3 height, caps on when not connected,</tspan><tspan x="250" dy="13.125">empties marked and separate, away from heat, oil and exits</tspan></text>
