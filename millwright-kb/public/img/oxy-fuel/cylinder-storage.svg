<rect x="436" y="80" width="22" height="110" fill="#8b1a1a" stroke="#1a2233" stroke-width="1.5" rx="5"/>
<text x="414" y="210" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">acetylene / propane</text>
<line x1="130" y1="100" x2="375" y2="100" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="252.5" y="96" font-size="12" text-anchor="middle" fill="#1a2233">20 ft (6.1 m) minimum</text>
<rect x="240" y="60" width="12" height="130" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="246" y="50" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="246" dy="0">or a 5 ft wall,</tspan><tspan x="246" dy="12.5">1/2-hour fire rating</tspan></text>
<line x1="30" y1="120" x2="120" y2="120" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<line x1="370" y1="120" x2="465" y2="120" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
