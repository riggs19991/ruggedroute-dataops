<text x="250" y="56" font-size="12" text-anchor="middle" fill="#1a2233">20 ft (6.1 m) minimum</text>
<rect x="244" y="70" width="12" height="130" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="250" y="216" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="250" dy="0">or a 5 ft wall with</tspan><tspan x="250" dy="12.5">a 1/2-hour fire rating</tspan></text>
