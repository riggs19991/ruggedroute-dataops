<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 272" width="500" height="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Oxy-fuel welding and braze welding technique</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="272" fill="#ffffff"/>
<rect x="40" y="150" width="420" height="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="250" y1="150" x2="250" y2="172" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
<g transform="translate(300 110) rotate(-45)"><rect x="0" y="-6" width="110" height="12" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="-16" y="-4" width="16" height="8" fill="#b87333" stroke="#1a2233" stroke-width="1.5"/></g>
<g transform="translate(190 122) rotate(-135)"><rect x="0" y="-2" width="110" height="4" fill="#b45309" stroke="#1a2233" stroke-width="1.5"/></g>
<path d="M240,150 C250,132 270,132 280,150 Z" fill="#f8b878" stroke="#b45309" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M284,150 C288,140 296,142 300,150" fill="#bfdbfe" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M303.7989898732233,130.20101012677668 A28,28 0 0 1 312,150" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="320.9551813004515" y="138.6926627053964" font-size="11" text-anchor="middle" fill="#0b5fa5">45°</text>
<path d="M162,150 A28,28 0 0 1 170.20101012677668,130.20101012677668" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="153.04481869954853" y="138.69266270539643" font-size="11" text-anchor="middle" fill="#0b5fa5">45°</text>
<line x1="200" y1="190" x2="280" y2="190" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="240" y="206" font-size="10" text-anchor="middle" fill="#0b5fa5">travel (forehand: rod leads)</text>
<text x="430" y="90" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="430" dy="0">inner cone 1/16 to 1/8 in</tspan><tspan x="430" dy="12.5">from the puddle</tspan></text>
<text x="80" y="200" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="80" dy="0">dip the rod in the front</tspan><tspan x="80" dy="12.5">of the puddle, do not</tspan><tspan x="80" dy="12.5">melt it in the flame</tspan></text>
<rect x="330" y="196" width="150" height="48" fill="#fff4d6" stroke="#b45309" stroke-width="1.5" rx="6"/><text x="405" y="211" font-size="10" text-anchor="middle" fill="#1a2233"><tspan x="405" dy="0">Braze welding:</tspan><tspan x="405" dy="12.5">heat to dull red, tin with</tspan><tspan x="405" dy="12.5">bronze, then build</tspan></text>
<text x="250" y="264" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Neutral flame for steel; slightly oxidizing for braze welding.</text>
</svg>