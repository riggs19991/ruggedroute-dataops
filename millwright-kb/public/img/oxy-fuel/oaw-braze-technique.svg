<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Oxy-fuel welding and braze welding technique</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="280" fill="#ffffff"/>
<rect x="40" y="160" width="200" height="18" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="260" y="160" width="200" height="18" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="240" y="160" width="20" height="18" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<path d="M236,160 C246,142 262,142 272,160 Z" fill="#f8b878" stroke="#b45309" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(296 134) rotate(135)"><rect x="-170" y="-9" width="120" height="18" fill="#64748b" stroke="#1a2233" stroke-width="1.5" rx="5"/>
<rect x="-50" y="-6" width="50" height="12" fill="#d4a017" stroke="#b45309" stroke-width="1.5" rx="2"/>
<rect x="-64" y="-9" width="14" height="18" fill="#b87333" stroke="#b45309" stroke-width="1.5" rx="2"/>
<rect x="-6" y="-4" width="6" height="8" fill="#8a5a1a" stroke="none" stroke-width="1.5"/>
<path d="M0,-4.62 C24.989999999999995,-5.082000000000001 57.12,-2.31 71.39999999999999,0 C57.12,2.31 24.989999999999995,5.082000000000001 0,4.62Z" fill="rgba(120,175,255,0.34)" stroke="rgba(160,200,255,0.7)" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M0,-2.52 C5.88,-1.7639999999999998 9.996,-0.63 11.76,0 C9.996,0.63 5.88,1.7639999999999998 0,2.52Z" fill="#eaf6ff" stroke="#8ec5ff" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/></g>
<g transform="translate(232 150) rotate(-135)"><rect x="0" y="-2.5" width="130" height="5" fill="#b87333" stroke="#b45309" stroke-width="1.5"/></g>
<path d="M289.2132034355964,138.78679656440357 A30,30 0 0 1 298,160" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="306.80294036547406" y="147.92729584066623" font-size="11" text-anchor="middle" fill="#0b5fa5">45°</text>
<path d="M202,160 A30,30 0 0 1 210.78679656440357,138.78679656440357" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="193.19705963452594" y="147.92729584066626" font-size="11" text-anchor="middle" fill="#0b5fa5">45°</text>
<line x1="200" y1="190" x2="280" y2="190" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="240" y="204" font-size="10" text-anchor="middle" fill="#0b5fa5">travel: forehand, rod leads the torch</text>
<text x="420" y="108" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="420" dy="0">inner cone 1/16 to 1/8 in</tspan><tspan x="420" dy="12.5">above the puddle, never in it</tspan></text>
<text x="96" y="222" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="96" dy="0">dip the rod in the leading</tspan><tspan x="96" dy="12.5">edge of the puddle; do not</tspan><tspan x="96" dy="12.5">melt it in the flame</tspan></text>
<rect x="330" y="214" width="150" height="48" fill="#fff4d6" stroke="#b45309" stroke-width="1.5" rx="6"/><text x="405" y="229" font-size="10" text-anchor="middle" fill="#1a2233"><tspan x="405" dy="0">Braze welding:</tspan><tspan x="405" dy="12.5">heat to dull red, tin with</tspan><tspan x="405" dy="12.5">bronze, then build</tspan></text>
<text x="250" y="272" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Neutral flame for steel; slightly oxidizing for braze welding.</text>
</svg>