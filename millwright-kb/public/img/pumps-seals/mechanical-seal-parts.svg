<text x="20" y="205" font-size="10" text-anchor="start" fill="#5b6577">1 rotary unit: springs, drive collar, set screws (mark the working length first)</text>
<text x="20" y="220" font-size="9.5" text-anchor="start" fill="#5b6577">2 carbon rotating face · 3 hard stationary face (SiC, ceramic) · 4 gland, flush port</text>
<text x="20" y="235" font-size="9.5" text-anchor="start" fill="#5b6577">5 O-rings: material matched to the fluid; faces never touched by hand</text>
<text x="250" y="252" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Vent the seal chamber and fill with liquid before the pump turns.</text>
