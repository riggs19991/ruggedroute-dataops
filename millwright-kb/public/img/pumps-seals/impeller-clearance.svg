<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Impeller clearance</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Open impeller</text>
<rect x="40" y="60" width="180" height="120" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="60" y="60" width="140" height="100" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="110" y="60" width="24" height="100" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="134" y="70" width="50" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="134" y="100" width="50" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="134" y="130" width="50" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="184" y1="60" x2="184" y2="160" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3 2" stroke-linecap="round"/>
<line x1="184" y1="165" x2="200" y2="165" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="192" y="161" font-size="10" text-anchor="middle" fill="#1a2233">clearance</text>
<text x="130" y="205" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">measure with a feeler at 3-4 places;</tspan><tspan x="130" dy="12.5">adjust at the bearing housing, then re-align</tspan></text>
<text x="370" y="22" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Enclosed impeller wear rings</text>
<rect x="280" y="60" width="180" height="120" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="300" y="70" width="140" height="100" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<circle cx="370" cy="120" r="45" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="370" cy="120" r="55" fill="none" stroke="#b45309" stroke-width="5"/>
<circle cx="370" cy="120" r="49" fill="none" stroke="#d4a017" stroke-width="5"/>
<text x="370" y="205" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="370" dy="0">diametral clearance ≈ 0.010 + 0.001 per inch of</tspan><tspan x="370" dy="11.875">ring dia.; replace at 2× new; casing ring and</tspan><tspan x="370" dy="11.875">impeller ring as a pair</tspan></text>
</svg>