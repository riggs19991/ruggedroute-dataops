<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Drawing numbers and callouts</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="260" fill="#ffffff"/>
<text x="250" y="22" font-size="18" text-anchor="middle" font-weight="700" fill="#1a2233">M-102-004 REV C</text>
<line x1="37" y1="62" x2="182" y2="34" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="40" y="66" font-size="7.5" text-anchor="start" fill="#5b6577"><tspan x="40" dy="0">M = mechanical</tspan><tspan x="40" dy="9.375">(P piping, E electrical,</tspan><tspan x="40" dy="9.375">S structural, C civil)</tspan></text>
<line x1="153" y1="106" x2="218" y2="34" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="150" y="110" font-size="7.5" text-anchor="end" fill="#5b6577">102 = area or unit</text>
<line x1="297" y1="62" x2="258" y2="34" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="300" y="66" font-size="7.5" text-anchor="start" fill="#5b6577">004 = sheet or sequence</text>
<line x1="377" y1="106" x2="305" y2="34" stroke="#5b6577" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="380" y="110" font-size="7.5" text-anchor="start" fill="#5b6577">REV C = third issued change</text>
<text x="90" y="150" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1a2233">Section cut</text>
<line x1="60" y1="165" x2="60" y2="215" stroke="#1a2233" stroke-width="2" stroke-dasharray="10 3 2 3" stroke-linecap="round"/>
<line x1="60" y1="165" x2="44" y2="165" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="60" y1="215" x2="44" y2="215" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<circle cx="78" cy="165" r="11" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="67" y1="165" x2="89" y2="165" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<text x="78" y="162" font-size="7" text-anchor="middle" font-weight="700" fill="#1a2233">A</text>
<text x="78" y="172" font-size="5.5" text-anchor="middle" fill="#1a2233">M-104</text>
<text x="100" y="190" font-size="7.5" text-anchor="start" fill="#5b6577"><tspan x="100" dy="0">look toward</tspan><tspan x="100" dy="9.375">the arrows; the</tspan><tspan x="100" dy="9.375">section is on M-104</tspan></text>
<text x="255" y="150" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1a2233">Detail bubble</text>
<circle cx="240" cy="190" r="20" fill="#ffffff" stroke="#1a2233" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="254" y1="176" x2="280" y2="166" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<circle cx="292" cy="162" r="11" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="281" y1="162" x2="303" y2="162" stroke="#1a2233" stroke-width="0.8" stroke-linecap="round"/>
<text x="292" y="159" font-size="7" text-anchor="middle" font-weight="700" fill="#1a2233">2</text>
<text x="292" y="169" font-size="5.5" text-anchor="middle" fill="#1a2233">M-105</text>
<text x="215" y="226" font-size="7.5" text-anchor="start" fill="#5b6577">top: detail number; bottom: the sheet it is drawn on</text>
<text x="420" y="150" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1a2233">Match line</text>
<line x1="380" y1="170" x2="380" y2="220" stroke="#1a2233" stroke-width="1.5" stroke-dasharray="14 4" stroke-linecap="round"/>
<text x="384" y="182" font-size="6.5" text-anchor="start" fill="#1a2233">MATCH LINE</text>
<text x="384" y="192" font-size="6.5" text-anchor="start" font-weight="700" fill="#1a2233">SEE P-103</text>
<text x="376" y="182" font-size="6.5" text-anchor="end" fill="#1a2233">CONT.</text>
<text x="376" y="192" font-size="6.5" text-anchor="end" font-weight="700" fill="#1a2233">FROM P-101</text>
<text x="250" y="252" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Every callout has two halves: what it is, and which sheet holds it.</text>
</svg>