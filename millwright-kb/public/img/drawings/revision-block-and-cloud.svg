<text x="115" y="199" font-size="6.5" text-anchor="middle" font-weight="700" fill="#5b6577">ISSUED FOR REVIEW</text>
<text x="115" y="222" font-size="7" text-anchor="middle" fill="#5b6577">do not build</text>
<rect x="190" y="182" width="120" height="26" fill="#ffffff" stroke="#166534" stroke-width="1.6" rx="3"/>
<text x="250" y="199" font-size="6.5" text-anchor="middle" font-weight="700" fill="#166534">ISSUED FOR CONSTRUCTION</text>
<text x="250" y="222" font-size="7" text-anchor="middle" fill="#5b6577">build to this</text>
