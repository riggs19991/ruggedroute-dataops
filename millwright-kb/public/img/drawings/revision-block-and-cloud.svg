<text x="188" y="80.24" font-size="7" text-anchor="start" fill="#1a2233">07/22/26</text>
<text x="234" y="80.24" font-size="7" text-anchor="start" fill="#1a2233">RJ</text>
<rect x="20" y="86" width="232" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="98.24" font-size="7" text-anchor="start" fill="#1a2233">C</text>
<text x="56" y="98.24" font-size="7" text-anchor="start" fill="#1a2233">BOLT PROJ. 4 TO 5 IN, ZONE C3</text>
<text x="188" y="98.24" font-size="7" text-anchor="start" fill="#1a2233">09/15/26</text>
<text x="234" y="98.24" font-size="7" text-anchor="start" fill="#1a2233">TL</text>
<text x="120" y="126" font-size="7.5" text-anchor="middle" fill="#5b6577">newest revision on top; the description says where to look</text>
