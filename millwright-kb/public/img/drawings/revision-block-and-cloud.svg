<text x="445" y="199" font-size="6.5" text-anchor="middle" font-weight="700" fill="#b91c1c">HOLD</text>
<text x="445" y="222" font-size="7" text-anchor="middle" fill="#5b6577">stop: question open</text>
<text x="250" y="252" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">A cloud marks what changed; the flag says which revision changed it.</text>
