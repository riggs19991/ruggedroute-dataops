<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Sequence chart</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="250" y="18" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Sequence chart: 1A+  2A+  2A-  1A-</text>
<text x="22" y="74" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">1A clamp</text>
<rect x="100" y="50" width="340" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="94" y="58" font-size="8" text-anchor="end" fill="#5b6577">1</text>
<text x="94" y="90" font-size="8" text-anchor="end" fill="#5b6577">0</text>
<line x1="185" y1="50" x2="185" y2="90" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="270" y1="50" x2="270" y2="90" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="355" y1="50" x2="355" y2="90" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="440" y1="50" x2="440" y2="90" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="22" y="144" font-size="9.5" text-anchor="start" font-weight="600" fill="#1a2233">2A press</text>
<rect x="100" y="120" width="340" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="94" y="128" font-size="8" text-anchor="end" fill="#5b6577">1</text>
<text x="94" y="160" font-size="8" text-anchor="end" fill="#5b6577">0</text>
<line x1="185" y1="120" x2="185" y2="160" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="270" y1="120" x2="270" y2="160" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="355" y1="120" x2="355" y2="160" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="440" y1="120" x2="440" y2="160" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<path d="M100,90 L185,50 L355,50 L440,90" fill="none" stroke="#0b5fa5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M100,160 L185,160 L270,120 L355,160 L440,160" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="100" y="178" font-size="9" text-anchor="middle" font-weight="700" fill="#1a2233">1</text>
<text x="185" y="178" font-size="9" text-anchor="middle" font-weight="700" fill="#1a2233">2</text>
<text x="270" y="178" font-size="9" text-anchor="middle" font-weight="700" fill="#1a2233">3</text>
<text x="355" y="178" font-size="9" text-anchor="middle" font-weight="700" fill="#1a2233">4</text>
<text x="440" y="178" font-size="9" text-anchor="middle" font-weight="700" fill="#1a2233">5 = 1</text>
<text x="270" y="192" font-size="9" text-anchor="middle" fill="#5b6577">step</text>
<text x="102" y="208" font-size="8.5" text-anchor="start" fill="#5b6577">Y1 (start)</text>
<text x="187" y="208" font-size="8.5" text-anchor="start" fill="#5b6577">1S2</text>
<text x="272" y="208" font-size="8.5" text-anchor="start" fill="#5b6577">2S2</text>
<text x="357" y="208" font-size="8.5" text-anchor="start" fill="#5b6577">2S1</text>
<text x="22" y="208" font-size="8.5" text-anchor="start" fill="#5b6577">signal:</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">A rising line is a rod going out; the signal under each step starts it.</text>
</svg>