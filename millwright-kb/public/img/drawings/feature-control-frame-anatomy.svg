<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Feature control frame anatomy</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<rect x="60" y="80" width="40" height="36" fill="#ffffff" stroke="#1a2233" stroke-width="1.4"/>
<circle cx="80" cy="98" r="7.92" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="67.328" y1="98" x2="92.672" y2="98" stroke="#1a2233" stroke-width="1.3" stroke-linecap="round"/>
<line x1="80" y1="85.328" x2="80" y2="110.672" stroke="#1a2233" stroke-width="1.3" stroke-linecap="round"/>
<rect x="100" y="80" width="110" height="36" fill="#ffffff" stroke="#1a2233" stroke-width="1.4"/>
<text x="155" y="102" font-size="15" text-anchor="middle" font-weight="600" fill="#1a2233">Ø .014 Ⓜ</text>
<rect x="210" y="80" width="40" height="36" fill="#ffffff" stroke="#1a2233" stroke-width="1.4"/>
<text x="230" y="102" font-size="15" text-anchor="middle" font-weight="600" fill="#1a2233">A</text>
<rect x="250" y="80" width="60" height="36" fill="#ffffff" stroke="#1a2233" stroke-width="1.4"/>
<text x="280" y="102" font-size="15" text-anchor="middle" font-weight="600" fill="#1a2233">B Ⓜ</text>
<rect x="310" y="80" width="40" height="36" fill="#ffffff" stroke="#1a2233" stroke-width="1.4"/>
<text x="330" y="102" font-size="15" text-anchor="middle" font-weight="600" fill="#1a2233">C</text>
<line x1="80" y1="146" x2="80" y2="116" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="80" y="150" font-size="8" text-anchor="middle" fill="#1a2233"><tspan x="80" dy="0">characteristic:</tspan><tspan x="80" dy="10">position</tspan></text>
<line x1="150" y1="168" x2="150" y2="116" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="150" y="172" font-size="8" text-anchor="middle" fill="#1a2233">Ø = cylindrical zone</text>
<line x1="220" y1="190" x2="200" y2="116" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="220" y="194" font-size="8" text-anchor="middle" fill="#1a2233">tolerance .014 at MMC</text>
<line x1="300" y1="146" x2="270" y2="116" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="300" y="150" font-size="8" text-anchor="middle" fill="#1a2233"><tspan x="300" dy="0">primary datum A</tspan><tspan x="300" dy="10">(3 points, plane)</tspan></text>
<line x1="360" y1="168" x2="320" y2="116" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="360" y="172" font-size="8" text-anchor="middle" fill="#1a2233"><tspan x="360" dy="0">secondary B at MMC</tspan><tspan x="360" dy="10">(2 points)</tspan></text>
<line x1="420" y1="190" x2="370" y2="116" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="420" y="194" font-size="8" text-anchor="middle" fill="#1a2233"><tspan x="420" dy="0">tertiary C</tspan><tspan x="420" dy="10">(1 point)</tspan></text>
<text x="60" y="62" font-size="9" text-anchor="start" fill="#5b6577">read it as a sentence:</text>
<text x="250" y="230" font-size="8.5" text-anchor="middle" fill="#5b6577"><tspan x="250" dy="0">the axis of this hole must lie in a Ø.014 cylinder (bigger if the hole</tspan><tspan x="250" dy="10.625">is bigger than MMC), located from A, then B, then C</tspan></text>
</svg>