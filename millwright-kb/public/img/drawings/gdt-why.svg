<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Square versus round tolerance zone</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="125" y="24" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">Plus-minus: square zone</text>
<text x="375" y="24" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">Position: round zone</text>
<rect x="75" y="70" width="100" height="100" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
<line x1="55" y1="120" x2="195" y2="120" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="12 3 2 3" stroke-linecap="round"/>
<line x1="125" y1="50" x2="125" y2="190" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="12 3 2 3" stroke-linecap="round"/>
<circle cx="125" cy="120" r="3" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="75" y1="170" x2="75" y2="194" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="175" y1="170" x2="175" y2="194" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="75" y1="190" x2="175" y2="190" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="125" y="186" font-size="8" text-anchor="middle" fill="#1a2233">±.005 = .010</text>
<line x1="175" y1="70" x2="197" y2="70" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="175" y1="170" x2="197" y2="170" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="193" y1="70" x2="193" y2="170" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="187" y="124" font-size="8" text-anchor="end" fill="#1a2233">.010</text>
<circle cx="375" cy="120" r="70" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
<line x1="295" y1="120" x2="455" y2="120" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="12 3 2 3" stroke-linecap="round"/>
<line x1="375" y1="40" x2="375" y2="200" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="12 3 2 3" stroke-linecap="round"/>
<circle cx="375" cy="120" r="3" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="305" y1="120" x2="305" y2="202" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="445" y1="120" x2="445" y2="202" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="305" y1="198" x2="445" y2="198" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="375" y="194" font-size="8" text-anchor="middle" fill="#1a2233">Ø.014</text>
<line x1="325" y1="70" x2="425" y2="170" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="3 2" stroke-linecap="round"/>
<text x="125" y="210" font-size="8" text-anchor="middle" fill="#5b6577"><tspan x="125" dy="0">the corners are as far off as .007</tspan><tspan x="125" dy="10">but a point .006 off on the axis fails</tspan></text>
<text x="375" y="226" font-size="8" text-anchor="middle" fill="#5b6577"><tspan x="375" dy="0">same corner distance, 57% more area, and the</tspan><tspan x="375" dy="10">zone grows with bonus at MMC</tspan></text>
</svg>