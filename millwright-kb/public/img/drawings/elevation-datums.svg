<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Elevation datums on a section</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="280" fill="#ffffff"/>
<text x="250" y="18" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Elevations read up from the plant datum</text>
<rect x="30" y="200" width="300" height="50" fill="url(#hatch)" stroke="none" stroke-width="1.5"/>
<line x1="30" y1="200" x2="330" y2="200" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<rect x="100" y="150" width="180" height="50" fill="url(#hatch)" stroke="#1a2233" stroke-width="1.5"/>
<line x1="100" y1="150" x2="280" y2="150" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<line x1="100" y1="150" x2="100" y2="200" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<line x1="280" y1="150" x2="280" y2="200" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<rect x="110" y="138" width="160" height="12" fill="#fff4d6" stroke="#1a2233" stroke-width="1"/>
<rect x="110" y="128" width="160" height="10" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="120" y="92" width="56" height="36" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="148" y="114" font-size="8.5" text-anchor="middle" fill="#1a2233">pump</text>
<rect x="196" y="88" width="64" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<text x="228" y="112" font-size="8.5" text-anchor="middle" fill="#1a2233">motor</text>
<line x1="112" y1="100" x2="268" y2="100" stroke="#5b6577" stroke-width="0.8" stroke-dasharray="12 3 2 3" stroke-linecap="round"/>
<text x="108" y="103" font-size="7" text-anchor="end" fill="#5b6577">C/L shaft</text>
<path d="M52,200 L64,200 L58,188 Z" fill="#1a2233" stroke="#1a2233" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="58" y="214" font-size="8" text-anchor="middle" font-weight="700" fill="#1a2233">BM-1</text>
<line x1="330" y1="200" x2="380" y2="200" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="380" y1="200" x2="380" y2="200" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="380" y1="200" x2="390" y2="200" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<path d="M390,200 l-6,-5 l0,10 z" fill="#1a2233" stroke="#1a2233" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="394" y="203.5" font-size="8.5" text-anchor="start" fill="#1a2233">FIN FLR EL 100'-0"</text>
<line x1="330" y1="150" x2="386" y2="150" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="386" y1="150" x2="386" y2="160" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="386" y1="160" x2="390" y2="160" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<path d="M390,160 l-6,-5 l0,10 z" fill="#1a2233" stroke="#1a2233" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="394" y="163.5" font-size="8.5" text-anchor="start" fill="#1a2233">T/CONC EL 101'-8"</text>
<line x1="330" y1="138" x2="378" y2="138" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="378" y1="138" x2="378" y2="140" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="378" y1="140" x2="390" y2="140" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<path d="M390,140 l-6,-5 l0,10 z" fill="#1a2233" stroke="#1a2233" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="394" y="143.5" font-size="8.5" text-anchor="start" fill="#1a2233">T/GROUT EL 101'-9 1/2"</text>
<line x1="330" y1="128" x2="370" y2="128" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="370" y1="128" x2="370" y2="120" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="370" y1="120" x2="390" y2="120" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<path d="M390,120 l-6,-5 l0,10 z" fill="#1a2233" stroke="#1a2233" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="394" y="123.5" font-size="8.5" text-anchor="start" fill="#1a2233">T/STEEL EL 101'-10 1/2"</text>
<line x1="330" y1="100" x2="380" y2="100" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="380" y1="100" x2="380" y2="100" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="380" y1="100" x2="390" y2="100" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<path d="M390,100 l-6,-5 l0,10 z" fill="#1a2233" stroke="#1a2233" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="394" y="103.5" font-size="8.5" text-anchor="start" fill="#1a2233">C/L SHAFT EL 103'-2"</text>
<line x1="60" y1="200" x2="36" y2="200" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="60" y1="100" x2="36" y2="100" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="40" y1="200" x2="40" y2="100" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="46" y="154" font-size="8.5" text-anchor="start" fill="#1a2233">3'-2"</text>
<text x="250" y="268" font-size="8.5" text-anchor="middle" fill="#5b6577">EL 100 is a convention, not a height above sea level; the benchmark carries it to the job</text>
</svg>