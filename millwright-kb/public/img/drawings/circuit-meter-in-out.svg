<text x="250" y="220" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="250" dy="0">back-pressure holds the load;</tspan><tspan x="250" dy="11.25">the usual choice</tspan></text>
<text x="420" y="220" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="420" dy="0">pump works at load pressure,</tspan><tspan x="420" dy="11.25">less heat; not for overrunning</tspan></text>
<text x="250" y="254" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Dashed box with a check = restrictor check: metered one way, free back.</text>
