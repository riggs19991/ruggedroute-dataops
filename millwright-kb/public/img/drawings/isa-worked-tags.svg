<text x="180" y="96" font-size="7.5" text-anchor="middle" fill="#5b6577"><tspan x="180" dy="0">temperature indicating</tspan><tspan x="180" dy="9.375">controller, on the DCS</tspan></text>
<text x="300" y="96" font-size="7.5" text-anchor="middle" fill="#5b6577"><tspan x="300" dy="0">flow switch low,</tspan><tspan x="300" dy="9.375">in the PLC</tspan></text>
<text x="420" y="96" font-size="7.5" text-anchor="middle" fill="#5b6577"><tspan x="420" dy="0">level alarm high-high,</tspan><tspan x="420" dy="9.375">on the DCS</tspan></text>
