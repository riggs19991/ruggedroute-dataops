<circle cx="360" cy="200" r="13" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="360" y="199" font-size="8.5" text-anchor="middle" font-weight="700" fill="#1a2233">PIT</text>
<text x="360" y="209" font-size="7.5" text-anchor="middle" fill="#1a2233">101</text>
<line x1="373" y1="200" x2="420" y2="200" stroke="#1a2233" stroke-width="1.1" stroke-dasharray="5 3" stroke-linecap="round"/>
<rect x="421" y="185" width="30" height="30" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="436" cy="200" r="13" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="423" y1="200" x2="449" y2="200" stroke="#1a2233" stroke-width="1.4" stroke-linecap="round"/>
<text x="436" y="197" font-size="8" text-anchor="middle" font-weight="700" fill="#1a2233">PIC</text>
<text x="436" y="209" font-size="7.5" text-anchor="middle" fill="#1a2233">101</text>
<text x="400" y="236" font-size="7.5" text-anchor="middle" fill="#5b6577"><tspan x="400" dy="0">same loop number 101:</tspan><tspan x="400" dy="9.375">transmitter feeds the controller</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Letters say what it does, shape says where it is, number ties the loop.</text>
</svg>