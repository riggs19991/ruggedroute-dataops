<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Structural connection callouts</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="280" fill="#ffffff"/>
<rect x="60" y="40" width="30" height="200" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<text x="75" y="270" font-size="7.5" text-anchor="middle" font-weight="700" fill="#1a2233">COL C-3</text>
<rect x="90" y="100" width="200" height="14" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="90" y="150" width="200" height="14" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="90" y="114" width="200" height="36" fill="#e2e8f0" stroke="#1a2233" stroke-width="1"/>
<text x="190" y="136" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">W12x26</text>
<rect x="90" y="106" width="12" height="54" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="96" cy="116" r="3" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="96" cy="130" r="3" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="96" cy="144" r="3" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="147" y1="28" x2="96" y2="130" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="150" y="32" font-size="8" text-anchor="start" fill="#1a2233"><tspan x="150" dy="0">3 - 3/4" Ø A325-N bolts</tspan><tspan x="150" dy="10">snug tight, double angle</tspan></text>
<line x1="247" y1="62" x2="190" y2="100" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="250" y="66" font-size="8" text-anchor="start" fill="#1a2233">W12x26: W shape, 12 in deep, 26 lb/ft</text>
<line x1="290" y1="100" x2="340" y2="100" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<text x="344" y="103" font-size="8" text-anchor="start" fill="#1a2233">TOS EL 112'-6"</text>
<line x1="290" y1="164" x2="340" y2="164" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<text x="344" y="167" font-size="8" text-anchor="start" fill="#1a2233">BOS EL 111'-6"</text>
<rect x="102" y="200" width="8" height="40" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<line x1="110" y1="210" x2="150" y2="196" stroke="#1a2233" stroke-width="0.9" stroke-linecap="round"/>
<line x1="150" y1="196" x2="190" y2="196" stroke="#1a2233" stroke-width="0.9" stroke-linecap="round"/>
<path d="M156,196 l0,-8 l10,8" fill="none" stroke="#1a2233" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="170" y="192" font-size="7" text-anchor="start" fill="#1a2233">1/4</text>
<text x="160" y="226" font-size="7.5" text-anchor="start" fill="#5b6577">fillet weld 1/4 in, arrow side</text>
<rect x="40" y="240" width="70" height="8" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="30" y="248" width="90" height="6" fill="#fff4d6" stroke="#1a2233" stroke-width="1"/>
<text x="140" y="246" font-size="7.5" text-anchor="start" fill="#1a2233">PL 1" x 14 x 14 base plate, 4 - 1" AB</text>
<text x="140" y="258" font-size="7.5" text-anchor="start" fill="#5b6577">grout 1 1/2" (see F-201)</text>
<text x="400" y="220" font-size="8" text-anchor="middle" fill="#5b6577"><tspan x="400" dy="0">bolted or welded is the</tspan><tspan x="400" dy="10">connection detail; the</tspan><tspan x="400" dy="10">millwright checks it was</tspan><tspan x="400" dy="10">done before loading it</tspan></text>
</svg>