<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>ISA tag decoder</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="250" y="40" font-size="26" text-anchor="middle" font-weight="700" fill="#1a2233">PIT - 101 A</text>
<line x1="27" y1="86" x2="196" y2="48" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="30" y="90" font-size="8" text-anchor="start" fill="#1a2233">P = pressure (measured variable)</text>
<line x1="87" y1="116" x2="212" y2="48" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="90" y="120" font-size="8" text-anchor="start" fill="#1a2233">I = indicating (it has a display)</text>
<line x1="247" y1="86" x2="228" y2="48" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="250" y="90" font-size="8" text-anchor="start" fill="#1a2233">T = transmitter (sends a signal)</text>
<line x1="287" y1="116" x2="280" y2="48" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="290" y="120" font-size="8" text-anchor="start" fill="#1a2233">101 = loop number shared by PIT, PIC, PCV</text>
<line x1="397" y1="66" x2="312" y2="48" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="400" y="70" font-size="8" text-anchor="start" fill="#1a2233">A = A/B suffix</text>
<rect x="40" y="140" width="270" height="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="149.52" font-size="7.5" text-anchor="start" font-weight="600" fill="#1a2233">tag</text>
<text x="116" y="149.52" font-size="7.5" text-anchor="start" font-weight="600" fill="#1a2233">reads as</text>
<rect x="40" y="154" width="270" height="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="163.52" font-size="7.5" text-anchor="start" fill="#1a2233">PIT-101</text>
<text x="116" y="163.52" font-size="7.5" text-anchor="start" fill="#1a2233">pressure indicating transmitter</text>
<rect x="40" y="168" width="270" height="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="177.52" font-size="7.5" text-anchor="start" fill="#1a2233">TIC-203</text>
<text x="116" y="177.52" font-size="7.5" text-anchor="start" fill="#1a2233">temperature indicating controller</text>
<rect x="40" y="182" width="270" height="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="191.52" font-size="7.5" text-anchor="start" fill="#1a2233">FSL-310</text>
<text x="116" y="191.52" font-size="7.5" text-anchor="start" fill="#1a2233">flow switch, low</text>
<rect x="40" y="196" width="270" height="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="205.52" font-size="7.5" text-anchor="start" fill="#1a2233">LAHH-405</text>
<text x="116" y="205.52" font-size="7.5" text-anchor="start" fill="#1a2233">level alarm, high-high</text>
<rect x="40" y="210" width="270" height="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="219.52" font-size="7.5" text-anchor="start" fill="#1a2233">ZSC-512</text>
<text x="116" y="219.52" font-size="7.5" text-anchor="start" fill="#1a2233">position switch, closed</text>
<rect x="40" y="224" width="270" height="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="46" y="233.52" font-size="7.5" text-anchor="start" fill="#1a2233">PSV-120</text>
<text x="116" y="233.52" font-size="7.5" text-anchor="start" fill="#1a2233">pressure safety valve</text>
<text x="360" y="160" font-size="8.5" text-anchor="start" fill="#5b6577"><tspan x="360" dy="0">read letters left to right:</tspan><tspan x="360" dy="10.625">what is measured,</tspan><tspan x="360" dy="10.625">any modifier,</tspan><tspan x="360" dy="10.625">then what it does</tspan></text>
</svg>