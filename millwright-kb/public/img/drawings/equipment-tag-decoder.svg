<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Equipment tag decoder</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="250" y="34" font-size="24" text-anchor="middle" font-weight="700" fill="#1a2233">P-101A</text>
<line x1="27" y1="70" x2="216" y2="40" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="30" y="74" font-size="8" text-anchor="start" fill="#1a2233">P = pump (equipment type)</text>
<line x1="250" y1="84" x2="250" y2="40" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="250" y="88" font-size="8" text-anchor="middle" fill="#1a2233">1 = area or unit, 01 = sequence</text>
<line x1="337" y1="70" x2="284" y2="40" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="340" y="74" font-size="8" text-anchor="start" fill="#1a2233">A = first of two (B is the spare)</text>
<rect x="30" y="100" width="170" height="15" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="110.2" font-size="7.5" text-anchor="start" font-weight="600" fill="#1a2233">letter</text>
<text x="86" y="110.2" font-size="7.5" text-anchor="start" font-weight="600" fill="#1a2233">equipment</text>
<rect x="30" y="115" width="170" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="125.2" font-size="7.5" text-anchor="start" fill="#1a2233">P</text>
<text x="86" y="125.2" font-size="7.5" text-anchor="start" fill="#1a2233">pump</text>
<rect x="30" y="130" width="170" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="140.2" font-size="7.5" text-anchor="start" fill="#1a2233">C / K</text>
<text x="86" y="140.2" font-size="7.5" text-anchor="start" fill="#1a2233">compressor</text>
<rect x="30" y="145" width="170" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="155.2" font-size="7.5" text-anchor="start" fill="#1a2233">B</text>
<text x="86" y="155.2" font-size="7.5" text-anchor="start" fill="#1a2233">blower / fan</text>
<rect x="30" y="160" width="170" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="170.2" font-size="7.5" text-anchor="start" fill="#1a2233">T / TK</text>
<text x="86" y="170.2" font-size="7.5" text-anchor="start" fill="#1a2233">tank</text>
<rect x="30" y="175" width="170" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="185.2" font-size="7.5" text-anchor="start" fill="#1a2233">V / D</text>
<text x="86" y="185.2" font-size="7.5" text-anchor="start" fill="#1a2233">vessel / drum</text>
<rect x="30" y="190" width="170" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="200.2" font-size="7.5" text-anchor="start" fill="#1a2233">E / HX</text>
<text x="86" y="200.2" font-size="7.5" text-anchor="start" fill="#1a2233">heat exchanger</text>
<rect x="260" y="100" width="210" height="15" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266" y="110.2" font-size="7.5" text-anchor="start" font-weight="600" fill="#1a2233">letter</text>
<text x="316" y="110.2" font-size="7.5" text-anchor="start" font-weight="600" fill="#1a2233">equipment</text>
<rect x="260" y="115" width="210" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266" y="125.2" font-size="7.5" text-anchor="start" fill="#1a2233">F</text>
<text x="316" y="125.2" font-size="7.5" text-anchor="start" fill="#1a2233">filter</text>
<rect x="260" y="130" width="210" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266" y="140.2" font-size="7.5" text-anchor="start" fill="#1a2233">A / M</text>
<text x="316" y="140.2" font-size="7.5" text-anchor="start" fill="#1a2233">agitator / mixer</text>
<rect x="260" y="145" width="210" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266" y="155.2" font-size="7.5" text-anchor="start" fill="#1a2233">CV</text>
<text x="316" y="155.2" font-size="7.5" text-anchor="start" fill="#1a2233">conveyor</text>
<rect x="260" y="160" width="210" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266" y="170.2" font-size="7.5" text-anchor="start" fill="#1a2233">GB / R</text>
<text x="316" y="170.2" font-size="7.5" text-anchor="start" fill="#1a2233">gearbox / reducer</text>
<rect x="260" y="175" width="210" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266" y="185.2" font-size="7.5" text-anchor="start" fill="#1a2233">M / MTR</text>
<text x="316" y="185.2" font-size="7.5" text-anchor="start" fill="#1a2233">motor</text>
<rect x="260" y="190" width="210" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="266" y="200.2" font-size="7.5" text-anchor="start" fill="#1a2233">H</text>
<text x="316" y="200.2" font-size="7.5" text-anchor="start" fill="#1a2233">hoist / heater (check legend)</text>
<text x="250" y="236" font-size="8.5" text-anchor="middle" fill="#5b6577">letters vary by owner: the legend sheet wins over this table</text>
</svg>