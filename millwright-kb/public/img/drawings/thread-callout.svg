<text x="250" y="252" font-size="8.5" text-anchor="middle" fill="#5b6577"><tspan x="250" dy="0">A = external (bolt), B = internal (nut); 2 is the everyday class, 3 is precision.</tspan><tspan x="250" dy="10.625">LH after the callout means left-hand: everything else is right-hand.</tspan></text>
