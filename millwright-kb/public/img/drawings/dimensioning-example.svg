<circle cx="29" cy="300" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="29" y="304" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="44" y="304" font-size="8" text-anchor="start" fill="#1a2233">a dimension in parentheses is reference only: do not inspect to it</text>
