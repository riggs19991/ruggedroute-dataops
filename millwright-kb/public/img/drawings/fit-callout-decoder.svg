<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Fit callout decoder</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="250" y="30" font-size="22" text-anchor="middle" font-weight="700" fill="#1a2233">Ø50 H7/g6</text>
<line x1="212" y1="36" x2="212" y2="54" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<text x="216" y="58" font-size="8" text-anchor="start" fill="#5b6577">Ø50 = basic size, mm</text>
<line x1="252" y1="36" x2="252" y2="68" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<text x="256" y="72" font-size="8" text-anchor="start" fill="#5b6577">H7 = hole: H (zero line), IT7 grade</text>
<line x1="292" y1="36" x2="292" y2="82" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<text x="296" y="86" font-size="8" text-anchor="start" fill="#5b6577">g6 = shaft: g (below zero), IT6</text>
<rect x="30" y="110" width="302" height="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="122.24" font-size="8" text-anchor="start" font-weight="600" fill="#1a2233">Feature</text>
<text x="106" y="122.24" font-size="8" text-anchor="start" font-weight="600" fill="#1a2233">Limits (mm)</text>
<text x="222" y="122.24" font-size="8" text-anchor="start" font-weight="600" fill="#1a2233">Limits (in)</text>
<rect x="30" y="128" width="302" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="140.24" font-size="8" text-anchor="start" fill="#1a2233">hole H7</text>
<text x="106" y="140.24" font-size="8" text-anchor="start" fill="#1a2233">50.000 to 50.025</text>
<text x="222" y="140.24" font-size="8" text-anchor="start" fill="#1a2233">1.9685 to 1.9695</text>
<rect x="30" y="146" width="302" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="158.24" font-size="8" text-anchor="start" fill="#1a2233">shaft g6</text>
<text x="106" y="158.24" font-size="8" text-anchor="start" fill="#1a2233">49.975 to 49.991</text>
<text x="222" y="158.24" font-size="8" text-anchor="start" fill="#1a2233">1.9675 to 1.9681</text>
<rect x="30" y="164" width="302" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="36" y="176.24" font-size="8" text-anchor="start" fill="#1a2233">clearance</text>
<text x="106" y="176.24" font-size="8" text-anchor="start" fill="#1a2233">0.009 to 0.050</text>
<text x="222" y="176.24" font-size="8" text-anchor="start" fill="#1a2233">.0004 to .0020</text>
<text x="400" y="120" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1a2233">Fit families</text>
<rect x="346" y="128" width="108" height="60" fill="#dcfce7" stroke="none" stroke-width="1.5"/>
<text x="400" y="143" font-size="8" text-anchor="middle" font-weight="700" fill="#166534">clearance</text>
<text x="400" y="156" font-size="7" text-anchor="middle" fill="#1a2233">H7/g6, H7/f7, H8/e8</text>
<text x="400" y="168" font-size="7" text-anchor="middle" fill="#5b6577">shaft always smaller</text>
<text x="400" y="180" font-size="7" text-anchor="middle" fill="#5b6577">slide, rotate, locate</text>
<rect x="346" y="192" width="108" height="42" fill="#fff4d6" stroke="none" stroke-width="1.5"/>
<text x="400" y="206" font-size="8" text-anchor="middle" font-weight="700" fill="#b45309">transition</text>
<text x="400" y="218" font-size="7" text-anchor="middle" fill="#1a2233">H7/k6, H7/n6</text>
<text x="400" y="229" font-size="7" text-anchor="middle" fill="#5b6577">bearing seats, light press</text>
<rect x="346" y="238" width="108" height="42" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<text x="400" y="252" font-size="8" text-anchor="middle" font-weight="700" fill="#b91c1c">interference</text>
<text x="400" y="264" font-size="7" text-anchor="middle" fill="#1a2233">H7/p6, H7/s6, H7/u6</text>
<text x="400" y="275" font-size="7" text-anchor="middle" fill="#5b6577">press or shrink fit</text>
<text x="30" y="210" font-size="8.5" text-anchor="start" fill="#5b6577"><tspan x="30" dy="0">capital letter = hole, lower case = shaft;</tspan><tspan x="30" dy="10.625">the number is the tolerance grade</tspan><tspan x="30" dy="10.625">(smaller number = tighter).</tspan><tspan x="30" dy="10.625">H hole with a lettered shaft is the</tspan><tspan x="30" dy="10.625">hole-basis system: bore stays, shaft moves.</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Read letter then number: where the zone sits, then how wide it is.</text>
</svg>