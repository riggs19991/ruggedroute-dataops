<text x="230" y="66" font-size="9" text-anchor="middle" fill="#1a2233">c/c 10'-0"</text>
<line x1="30" y1="120" x2="30" y2="164" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="90" y1="120" x2="90" y2="164" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
