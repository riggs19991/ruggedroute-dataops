<text x="386" y="220.2" font-size="7.5" text-anchor="start" fill="#1a2233">8'-5 3/4"</text>
<text x="20" y="200" font-size="8" text-anchor="start" fill="#5b6577"><tspan x="20" dy="0">take-out for a 6" LR 90° = 1.5 x NPS = 9"; the dimension</tspan><tspan x="20" dy="10">on the iso is always centreline to centreline</tspan></text>
