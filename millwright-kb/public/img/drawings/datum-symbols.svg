<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Datum symbols and the datum frame</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="110" y="22" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">Datum feature symbol</text>
<rect x="40" y="50" width="120" height="70" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<path d="M80,120 L88,132 L72,132 Z" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80" y1="132" x2="80" y2="146" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round"/>
<rect x="70" y="146" width="20" height="20" fill="#ffffff" stroke="#1a2233" stroke-width="1.4"/>
<text x="80" y="161" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">A</text>
<text x="96" y="158" font-size="7.5" text-anchor="start" fill="#5b6577">on the surface</text>
<text x="110" y="190" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">On a size feature (axis)</text>
<rect x="40" y="206" width="120" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="40" y1="206" x2="68" y2="206" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="40" y1="246" x2="68" y2="246" stroke="#5b6577" stroke-width="0.8" stroke-linecap="round"/>
<line x1="64" y1="206" x2="64" y2="246" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="70" y="230" font-size="8" text-anchor="start" fill="#1a2233">Ø2.000</text>
<path d="M16,226 L8,220 L8,232 Z" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="8" y1="226" x2="0" y2="226" stroke="#1a2233" stroke-width="0" stroke-linecap="round"/>
<rect x="12" y="250" width="20" height="20" fill="#ffffff" stroke="#1a2233" stroke-width="1.4"/>
<text x="22" y="265" font-size="11" text-anchor="middle" font-weight="700" fill="#1a2233">B</text>
<line x1="16" y1="232" x2="22" y2="250" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round"/>
<text x="60" y="266" font-size="7" text-anchor="start" fill="#5b6577">in line with the size dim = the axis is the datum</text>
<text x="300" y="22" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">Datum target</text>
<circle cx="300" cy="70" r="16" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="284" y1="70" x2="316" y2="70" stroke="#1a2233" stroke-width="1.2" stroke-linecap="round"/>
<text x="300" y="66" font-size="7" text-anchor="middle" fill="#1a2233">Ø.50</text>
<text x="300" y="80" font-size="8" text-anchor="middle" font-weight="700" fill="#1a2233">A1</text>
<line x1="300" y1="86" x2="300" y2="110" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<path d="M296,110 l8,0 l-4,-6 z" fill="#1a2233" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="128" font-size="7.5" text-anchor="middle" fill="#5b6577"><tspan x="300" dy="0">a specified point, line or area</tspan><tspan x="300" dy="9.375">for touching a cast surface</tspan></text>
<text x="410" y="22" font-size="10" text-anchor="middle" font-weight="700" fill="#1a2233">3-2-1 frame</text>
<path d="M360,120 L460,120 L480,100 L380,100 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360,50 L360,120 L380,100 L380,30 Z" fill="#e2e8f0" stroke="#1a2233" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360,50 L460,50 L460,120 L360,120 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
<text x="410" y="90" font-size="8" text-anchor="middle" font-weight="700" fill="#1a2233">A: 3 pts</text>
<text x="368" y="132" font-size="8" text-anchor="start" font-weight="700" fill="#1a2233">B: 2 pts</text>
<text x="388" y="40" font-size="8" text-anchor="start" font-weight="700" fill="#1a2233">C: 1 pt</text>
<text x="420" y="160" font-size="7.5" text-anchor="middle" fill="#5b6577"><tspan x="420" dy="0">three perpendicular planes</tspan><tspan x="420" dy="9.375">lock all six degrees of</tspan><tspan x="420" dy="9.375">freedom in the order A, B, C</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">The triangle points at what you rest the part on; the letter names it.</text>
</svg>