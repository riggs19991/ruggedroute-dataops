<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Surface finish symbol</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="290" fill="#ffffff"/>
<path d="M60,110 L74,146 L104,70" fill="none" stroke="#1a2233" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="84" y1="98" x2="120" y2="98" stroke="#1a2233" stroke-width="1.6" stroke-linecap="round"/>
<text x="94" y="108" font-size="12" text-anchor="start" font-weight="700" fill="#1a2233">63</text>
<text x="90" y="84" font-size="8" text-anchor="start" fill="#5b6577">a</text>
<text x="110" y="84" font-size="8" text-anchor="start" fill="#5b6577">b</text>
<text x="122" y="120" font-size="12" text-anchor="start" font-weight="700" fill="#1a2233">=</text>
<text x="68" y="130" font-size="9" text-anchor="start" font-weight="700" fill="#1a2233">.010</text>
<line x1="147" y1="56" x2="100" y2="104" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="150" y="60" font-size="7.5" text-anchor="start" fill="#1a2233">Ra 63 µin (1.6 µm) max</text>
<line x1="167" y1="80" x2="116" y2="96" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="170" y="84" font-size="7.5" text-anchor="start" fill="#1a2233"><tspan x="170" dy="0">bar over: method (a),</tspan><tspan x="170" dy="9.375">other requirements (b)</tspan></text>
<line x1="167" y1="118" x2="126" y2="118" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="170" y="122" font-size="7.5" text-anchor="start" fill="#1a2233"><tspan x="170" dy="0">lay: = parallel, ⊥ perpendicular,</tspan><tspan x="170" dy="9.375">X crossed, M multi, C circular</tspan></text>
<line x1="147" y1="156" x2="80" y2="128" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/><text x="150" y="160" font-size="7.5" text-anchor="start" fill="#1a2233">machining allowance .010 in</text>
<text x="60" y="190" font-size="9.5" text-anchor="start" font-weight="700" fill="#1a2233">Variants</text>
<path d="M40,214 L47,232 L62,194" fill="none" stroke="#1a2233" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="250" font-size="7" text-anchor="middle" fill="#5b6577">basic: any process</text>
<path d="M150,214 L157,232 L172,194" fill="none" stroke="#1a2233" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="157" y1="204" x2="172" y2="204" stroke="#1a2233" stroke-width="1.4" stroke-linecap="round"/>
<text x="162" y="250" font-size="7" text-anchor="middle" fill="#5b6577">bar: material must be removed</text>
<path d="M270,214 L277,232 L292,194" fill="none" stroke="#1a2233" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="279" cy="220" r="5" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="282" y="250" font-size="7" text-anchor="middle" fill="#5b6577">circle: no machining allowed</text>
<path d="M380,214 L387,232 L402,194" fill="none" stroke="#1a2233" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="374" cy="228" r="3" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="408" y="218" font-size="8" text-anchor="start" fill="#1a2233">125</text>
<text x="392" y="250" font-size="7" text-anchor="middle" fill="#5b6577">all surfaces this finish</text>
<rect x="300" y="60" width="190" height="15" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="306" y="70.2" font-size="7" text-anchor="start" font-weight="600" fill="#1a2233">Ra µin</text>
<text x="346" y="70.2" font-size="7" text-anchor="start" font-weight="600" fill="#1a2233">µm</text>
<text x="380" y="70.2" font-size="7" text-anchor="start" font-weight="600" fill="#1a2233">process</text>
<rect x="300" y="75" width="190" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="306" y="85.2" font-size="7" text-anchor="start" fill="#1a2233">500</text>
<text x="346" y="85.2" font-size="7" text-anchor="start" fill="#1a2233">12.5</text>
<text x="380" y="85.2" font-size="7" text-anchor="start" fill="#1a2233">flame cut, rough cast</text>
<rect x="300" y="90" width="190" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="306" y="100.2" font-size="7" text-anchor="start" fill="#1a2233">250</text>
<text x="346" y="100.2" font-size="7" text-anchor="start" fill="#1a2233">6.3</text>
<text x="380" y="100.2" font-size="7" text-anchor="start" fill="#1a2233">rough machining</text>
<rect x="300" y="105" width="190" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="306" y="115.2" font-size="7" text-anchor="start" fill="#1a2233">125</text>
<text x="346" y="115.2" font-size="7" text-anchor="start" fill="#1a2233">3.2</text>
<text x="380" y="115.2" font-size="7" text-anchor="start" fill="#1a2233">milling, drilling</text>
<rect x="300" y="120" width="190" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="306" y="130.2" font-size="7" text-anchor="start" fill="#1a2233">63</text>
<text x="346" y="130.2" font-size="7" text-anchor="start" fill="#1a2233">1.6</text>
<text x="380" y="130.2" font-size="7" text-anchor="start" fill="#1a2233">good turning, shaft OD</text>
<rect x="300" y="135" width="190" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="306" y="145.2" font-size="7" text-anchor="start" fill="#1a2233">32</text>
<text x="346" y="145.2" font-size="7" text-anchor="start" fill="#1a2233">0.8</text>
<text x="380" y="145.2" font-size="7" text-anchor="start" fill="#1a2233">fine turn, grind, seals</text>
<rect x="300" y="150" width="190" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="306" y="160.2" font-size="7" text-anchor="start" fill="#1a2233">16</text>
<text x="346" y="160.2" font-size="7" text-anchor="start" fill="#1a2233">0.4</text>
<text x="380" y="160.2" font-size="7" text-anchor="start" fill="#1a2233">grinding, bearing journals</text>
<rect x="300" y="165" width="190" height="15" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="306" y="175.2" font-size="7" text-anchor="start" fill="#1a2233">8</text>
<text x="346" y="175.2" font-size="7" text-anchor="start" fill="#1a2233">0.2</text>
<text x="380" y="175.2" font-size="7" text-anchor="start" fill="#1a2233">honing, lapping</text>
<text x="250" y="282" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Lower Ra number = smoother; 63 is a good turned finish, 16 a bearing journal.</text>
</svg>