<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Third-angle and first-angle projection</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="125" y="22" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">Third angle (US, Canada)</text>
<text x="375" y="22" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">First angle (ISO, Europe)</text>
<path d="M98,34 L118,39 L118,49 L98,54 Z" fill="none" stroke="#1a2233" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="118" y1="39" x2="118" y2="49" stroke="#1a2233" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="142" cy="44" r="9" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="142" cy="44" r="4" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<path d="M368,34 L348,39 L348,49 L368,54 Z" fill="none" stroke="#1a2233" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="348" y1="39" x2="348" y2="49" stroke="#1a2233" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="392" cy="44" r="9" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="392" cy="44" r="4" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="125" y="70" font-size="7.5" text-anchor="middle" fill="#5b6577">symbol: circles on the small-end side</text>
<text x="375" y="70" font-size="7.5" text-anchor="middle" fill="#5b6577">symbol: circles on the large-end side</text>
<path d="M80,150 l0,60 l60,0 l0,-24 l-36,0 l0,-36 z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="80" y="104" width="60" height="36" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="104" y1="104" x2="104" y2="140" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<rect x="156" y="150" width="36" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="156" y1="186" x2="192" y2="186" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="110" y="224" font-size="7" text-anchor="middle" fill="#5b6577">FRONT</text>
<text x="110" y="98" font-size="7" text-anchor="middle" fill="#5b6577">TOP</text>
<text x="174" y="224" font-size="7" text-anchor="middle" fill="#5b6577">RIGHT</text>
<path d="M330,150 l0,60 l60,0 l0,-24 l-36,0 l0,-36 z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="330" y="226" width="60" height="36" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="354" y1="226" x2="354" y2="262" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<rect x="280" y="150" width="36" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="280" y1="186" x2="316" y2="186" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="360" y="224" font-size="7" text-anchor="middle" fill="#5b6577">FRONT</text>
<text x="360" y="274" font-size="7" text-anchor="middle" fill="#5b6577">TOP</text>
<text x="298" y="224" font-size="7" text-anchor="middle" fill="#5b6577">RIGHT</text>
<text x="125" y="282" font-size="8.5" text-anchor="middle" fill="#5b6577">top view above, right view on the right</text>
<text x="375" y="282" font-size="8.5" text-anchor="middle" fill="#5b6577">top view below, right view on the left</text>
</svg>