<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Locking methods</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<text x="60" y="40" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">Nylon insert</text>
<path d="M80.78460969082653,112 L60,124 L39.21539030917347,112 L39.21539030917347,88 L59.99999999999999,76 L80.78460969082653,87.99999999999999 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="60" cy="100" r="9" fill="#0b5fa5" stroke="#1a2233" stroke-width="1.5"/>
<text x="155" y="40" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">Jam nut</text>
<rect x="133" y="96" width="44" height="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="133" y="82" width="44" height="12" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<text x="155" y="140" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="155" dy="0">thin nut first,</tspan><tspan x="155" dy="11.25">then the full nut</tspan></text>
<text x="250" y="40" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">Castle + cotter</text>
<rect x="228" y="90" width="44" height="24" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="232" y="78" width="8" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="246" y="78" width="8" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="260" y="78" width="8" height="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="220" y1="84" x2="280" y2="84" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
<text x="345" y="40" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">Safety wire</text>
<circle cx="327" cy="100" r="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="363" cy="100" r="12" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M319,92 C340,80 350,120 371,108" fill="none" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M311.96491806742546,94.5276777067893 A16,16 0 0 1 339.25671108990366,89.71539824501536" fill="none" stroke="#0b5fa5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="440" y="40" font-size="11" text-anchor="middle" font-weight="600" fill="#1a2233">Threadlocker</text>
<rect x="432" y="74" width="16" height="52" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="432" y="80" width="16" height="4" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<rect x="432" y="92" width="16" height="4" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<rect x="432" y="104" width="16" height="4" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<rect x="432" y="116" width="16" height="4" fill="#0b5fa5" stroke="none" stroke-width="1.5"/>
<text x="440" y="140" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="440" dy="0">242 blue: removable</tspan><tspan x="440" dy="11.25">271 red: heat to remove</tspan></text>
<text x="250" y="200" font-size="10" text-anchor="middle" fill="#5b6577">split lock washers do not lock hardened bolts; preload (correct torque) is the real lock</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Wire pulls toward tightening; nylon inserts are single-use in vibration.</text>
</svg>