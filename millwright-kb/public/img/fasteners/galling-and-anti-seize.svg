<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Galling and anti-seize</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="220" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Galling</text>
<rect x="40" y="60" width="180" height="40" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M55,100 L71,76 L87,100 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M87,100 L103,76 L119,100 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M119,100 L135,76 L151,100 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M151,100 L167,76 L183,100 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M183,100 L199,76 L215,100 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="100" width="180" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="103" cy="92" r="6" fill="#b91c1c" stroke="none" stroke-width="1.5"/>
<circle cx="135" cy="90" r="6" fill="#b91c1c" stroke="none" stroke-width="1.5"/>
<text x="130" y="150" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="130" dy="0">high spots weld and tear: the nut seizes</tspan><tspan x="130" dy="12.5">halfway; cannot go on or come off</tspan></text>
<text x="370" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Anti-seize and torque</text>
<rect x="280" y="40" width="210" height="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="286" y="53.6" font-size="10" text-anchor="start" font-weight="600" fill="#1a2233">Condition</text>
<text x="376" y="53.6" font-size="10" text-anchor="start" font-weight="600" fill="#1a2233">K</text>
<text x="436" y="53.6" font-size="10" text-anchor="start" font-weight="600" fill="#1a2233">Torque</text>
<rect x="280" y="60" width="210" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="286" y="73.6" font-size="10" text-anchor="start" fill="#1a2233">dry, plain</text>
<text x="376" y="73.6" font-size="10" text-anchor="start" fill="#1a2233">0.20</text>
<text x="436" y="73.6" font-size="10" text-anchor="start" fill="#1a2233">100%</text>
<rect x="280" y="80" width="210" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="286" y="93.6" font-size="10" text-anchor="start" fill="#1a2233">zinc plated</text>
<text x="376" y="93.6" font-size="10" text-anchor="start" fill="#1a2233">0.18</text>
<text x="436" y="93.6" font-size="10" text-anchor="start" fill="#1a2233">90%</text>
<rect x="280" y="100" width="210" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="286" y="113.6" font-size="10" text-anchor="start" fill="#1a2233">oiled</text>
<text x="376" y="113.6" font-size="10" text-anchor="start" fill="#1a2233">0.15</text>
<text x="436" y="113.6" font-size="10" text-anchor="start" fill="#1a2233">75%</text>
<rect x="280" y="120" width="210" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="286" y="133.6" font-size="10" text-anchor="start" fill="#1a2233">anti-seize</text>
<text x="376" y="133.6" font-size="10" text-anchor="start" fill="#1a2233">0.12-0.14</text>
<text x="436" y="133.6" font-size="10" text-anchor="start" fill="#1a2233">60-70%</text>
<text x="385" y="165" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="385" dy="0">same torque + anti-seize = 30-40% more</tspan><tspan x="385" dy="11.875">bolt stretch: yielded studs, cracked flanges</tspan></text>
<text x="250" y="212" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Slow, clean, lubricated, no impact gun: that is how stainless stays free.</text>
</svg>