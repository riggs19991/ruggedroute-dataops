<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Offset and angularity</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<text x="130" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Parallel offset</text>
<rect x="20" y="70" width="90" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="110" y="54" width="30" height="52" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(146,94) rotate(0)"><rect x="0" y="-26" width="30" height="52" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="30" y="-10" width="90" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/></g>
<line x1="20" y1="80" x2="140" y2="80" stroke="#0b5fa5" stroke-width="1" stroke-dasharray="6 4" stroke-linecap="round"/>
<g transform="translate(146,94) rotate(0)"><line x1="0" y1="0" x2="150" y2="0" stroke="#b91c1c" stroke-width="1" stroke-dasharray="6 4" stroke-linecap="round"/></g>
<text x="65" y="110" font-size="10" text-anchor="middle" fill="#5b6577">stationary</text>
<text x="220" y="110" font-size="10" text-anchor="middle" fill="#5b6577">movable</text>
<line x1="146" y1="80" x2="146" y2="94" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="156" y="108" font-size="10" text-anchor="start" fill="#b91c1c">offset</text>
<text x="370" y="22" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2233">Angular</text>
<rect x="260" y="70" width="90" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="350" y="54" width="30" height="52" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<g transform="translate(386,80) rotate(-6)"><rect x="0" y="-26" width="30" height="52" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="30" y="-10" width="90" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/></g>
<line x1="260" y1="80" x2="380" y2="80" stroke="#0b5fa5" stroke-width="1" stroke-dasharray="6 4" stroke-linecap="round"/>
<g transform="translate(386,80) rotate(-6)"><line x1="0" y1="0" x2="150" y2="0" stroke="#b91c1c" stroke-width="1" stroke-dasharray="6 4" stroke-linecap="round"/></g>
<text x="305" y="110" font-size="10" text-anchor="middle" fill="#5b6577">stationary</text>
<text x="460" y="110" font-size="10" text-anchor="middle" fill="#5b6577">movable</text>
<text x="470" y="62" font-size="10" text-anchor="end" fill="#b91c1c">angle</text>
<text x="250" y="150" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Two planes: side view (vertical) and top view (horizontal)</text>
<rect x="30" y="170" width="210" height="90" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="198.225" font-size="11" text-anchor="middle" fill="#1a2233"><tspan x="135" dy="0">Vertical plane</tspan><tspan x="135" dy="13.75">(side view)</tspan><tspan x="135" dy="13.75">corrected with shims</tspan><tspan x="135" dy="13.75">offset + angle</tspan></text>
<rect x="260" y="170" width="210" height="90" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="365" y="198.225" font-size="11" text-anchor="middle" fill="#1a2233"><tspan x="365" dy="0">Horizontal plane</tspan><tspan x="365" dy="13.75">(top view)</tspan><tspan x="365" dy="13.75">corrected with jack bolts</tspan><tspan x="365" dy="13.75">offset + angle</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Offset at the coupling centre; angle as gap difference across the face.</text>
</svg>