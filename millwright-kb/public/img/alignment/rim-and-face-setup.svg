<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 318" width="500" height="318" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Rim and face setup</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="318" fill="#ffffff"/>
<rect x="20" y="120" width="100" height="24" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="120" y="96" width="45" height="72" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="215" y="96" width="45" height="72" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="260" y="120" width="220" height="24" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="290" y="144" width="20" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="410" y="144" width="20" height="40" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<line x1="20" y1="184" x2="480" y2="184" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<text x="70" y="108" font-size="10" text-anchor="middle" fill="#5b6577">stationary</text>
<text x="370" y="108" font-size="10" text-anchor="middle" fill="#5b6577">movable</text>
<text x="300" y="200" font-size="9.5" text-anchor="middle" fill="#5b6577">front foot</text>
<text x="420" y="200" font-size="9.5" text-anchor="middle" fill="#5b6577">rear foot</text>
<rect x="130" y="82" width="26" height="14" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<path d="M143,82 L143,40 L240,40 L240,66" fill="none" stroke="#1a2233" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="240" cy="76" r="10" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="240" y1="86" x2="240" y2="96" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="258" y="72" font-size="10.5" text-anchor="start" font-weight="600" fill="#1a2233">rim</text>
<path d="M190,40 L190,66" fill="none" stroke="#1a2233" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="190" cy="76" r="10" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="190" y1="86" x2="190" y2="104" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="104" x2="213" y2="104" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="172" y="72" font-size="10.5" text-anchor="end" font-weight="600" fill="#1a2233">face</text>
<line x1="190" y1="222" x2="240" y2="222" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="215" y="218" font-size="11" text-anchor="middle" fill="#1a2233">A</text>
<line x1="240" y1="242" x2="300" y2="242" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="270" y="238" font-size="11" text-anchor="middle" fill="#1a2233">B</text>
<line x1="240" y1="262" x2="420" y2="262" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="330" y="258" font-size="11" text-anchor="middle" fill="#1a2233">C</text>
<text x="250" y="283" font-size="10" text-anchor="middle" fill="#5b6577">A: face to rim indicator · B: rim indicator to front foot · C: to rear foot</text>
<text x="250" y="310" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Turn both shafts together; zero at 12; read 3, 6, 9; check 3 + 9 = 6.</text>
</svg>