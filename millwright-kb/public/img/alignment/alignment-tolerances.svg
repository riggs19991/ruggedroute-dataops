<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Alignment tolerances</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="290" fill="#ffffff"/>
<rect x="70" y="30" width="400" height="170" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<line x1="70" y1="200" x2="470" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="204" font-size="11" text-anchor="end" fill="#5b6577">0</text>
<line x1="70" y1="157.5" x2="470" y2="157.5" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="161.5" font-size="11" text-anchor="end" fill="#5b6577">2</text>
<line x1="70" y1="115" x2="470" y2="115" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="119" font-size="11" text-anchor="end" fill="#5b6577">4</text>
<line x1="70" y1="72.5" x2="470" y2="72.5" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="76.5" font-size="11" text-anchor="end" fill="#5b6577">6</text>
<line x1="70" y1="30" x2="470" y2="30" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="64" y="34" font-size="11" text-anchor="end" fill="#5b6577">8</text>
<line x1="70" y1="30" x2="70" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="70" y="214" font-size="11" text-anchor="middle" fill="#5b6577">0</text>
<line x1="170" y1="30" x2="170" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="170" y="214" font-size="11" text-anchor="middle" fill="#5b6577">1000</text>
<line x1="250" y1="30" x2="250" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="250" y="214" font-size="11" text-anchor="middle" fill="#5b6577">1800</text>
<line x1="430" y1="30" x2="430" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="430" y="214" font-size="11" text-anchor="middle" fill="#5b6577">3600</text>
<text x="270" y="230" font-size="12" text-anchor="middle" fill="#5b6577">Shaft speed (rpm)</text>
<text x="36" y="115" font-size="12" text-anchor="middle" fill="#5b6577" transform="rotate(-90 36 115)">Offset (mils)</text>
<path d="M130,30 L160,72.5 L190,115 L250,136.25 L430,168.125 L470,172.375" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M130,93.75 L160,136.25 L190,146.875 L250,157.5 L430,178.75 L470,180.875" fill="none" stroke="#166534" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="220" y="117.5" font-size="11" text-anchor="start" font-weight="600" fill="#b45309">acceptable</text>
<text x="290" y="180" font-size="11" text-anchor="start" font-weight="600" fill="#166534">excellent</text>
<text x="250" y="250" font-size="10.5" text-anchor="middle" fill="#5b6577">angle: excellent 0.3-0.5 mil/in at 1,800 rpm; acceptable 0.7-1.0 mil/in</text>
<text x="250" y="282" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">1 mil = 0.001 in. Aim for excellent on anything over 1,800 rpm.</text>
</svg>