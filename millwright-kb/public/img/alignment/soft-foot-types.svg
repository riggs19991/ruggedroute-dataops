<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 270" width="500" height="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Soft foot types</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="270" fill="#ffffff"/>
<text x="60" y="24" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Parallel</text>
<rect x="10" y="150" width="110" height="14" fill="#b9c4d2" stroke="#1a2233" stroke-width="1.5"/>
<rect x="26" y="80" width="80" height="44" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="30" y="124" width="60" height="18" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="60" y1="68" x2="60" y2="138" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<rect x="52" y="60" width="16" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="96" y1="142" x2="96" y2="150" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="60" y="180" font-size="9.5" text-anchor="middle" fill="#b91c1c">even gap: shim it</text>
<text x="182" y="24" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Angular</text>
<rect x="132" y="150" width="110" height="14" fill="#b9c4d2" stroke="#1a2233" stroke-width="1.5"/>
<rect x="148" y="88" width="80" height="44" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<path d="M152,132 L212,132 L212,150 L152,141 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="182" y1="76" x2="182" y2="146" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<rect x="174" y="68" width="16" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<line x1="146" y1="141" x2="146" y2="150" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="182" y="180" font-size="9.5" text-anchor="middle" fill="#b91c1c">tapered gap: taper shim</text>
<text x="304" y="24" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Squishy</text>
<rect x="254" y="150" width="110" height="14" fill="#b9c4d2" stroke="#1a2233" stroke-width="1.5"/>
<rect x="270" y="78" width="80" height="44" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="274" y="122" width="60" height="18" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="304" y1="66" x2="304" y2="136" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<rect x="296" y="58" width="16" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<path d="M272,141 q10,-2.5 20,0 t20,0 t20,0" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M275,143.6 q10,-2.5 20,0 t20,0 t20,0" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M272,146.2 q10,-2.5 20,0 t20,0 t20,0" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M275,148.8 q10,-2.5 20,0 t20,0 t20,0" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="304" y="180" font-size="9.5" text-anchor="middle" fill="#b91c1c">bent or dirty shims</text>
<text x="426" y="24" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Induced</text>
<rect x="376" y="150" width="110" height="14" fill="#b9c4d2" stroke="#1a2233" stroke-width="1.5"/>
<rect x="392" y="88" width="80" height="44" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="396" y="132" width="60" height="18" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="426" y1="76" x2="426" y2="146" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<rect x="418" y="68" width="16" height="8" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<rect x="444" y="60" width="20" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<path d="M454,60 L454,46 L478,46" fill="none" stroke="#64748b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M454,60 L454,46 L478,46" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="478" y1="46" x2="492" y2="46" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="396" y1="144" x2="396" y2="150" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="426" y="180" font-size="9.5" text-anchor="middle" fill="#b91c1c">pipe pulls a foot up</text>
<text x="250" y="206" font-size="10" text-anchor="middle" fill="#5b6577">angular: taper shim or machine the foot · squishy: clean it, use fewer thicker shims</text>
<text x="250" y="222" font-size="10" text-anchor="middle" fill="#5b6577">induced: fix the pipe or base; the machine is being pulled, not resting</text>
<text x="250" y="240" font-size="10" text-anchor="middle" fill="#0b5fa5">check: indicator on the foot, loosen one bolt at a time; over 0.002 in lift = soft</text>
<text x="250" y="262" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Fix soft foot before any alignment reading, or it moves when torqued.</text>
</svg>