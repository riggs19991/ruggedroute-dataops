<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Soft foot types</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<text x="70" y="40" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Parallel</text>
<rect x="40" y="130" width="60" height="12" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="40" y="100" width="60" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="106" y1="120" x2="106" y2="130" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="112" y="128" font-size="9.5" text-anchor="start" fill="#b91c1c">gap</text>
<line x1="70" y1="60" x2="70" y2="100" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<text x="190" y="40" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Angular</text>
<rect x="160" y="130" width="60" height="12" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<path d="M160,100 L220,100 L220,130 L160,120 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="154" y1="120" x2="154" y2="130" stroke="#b91c1c" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="148" y="128" font-size="9.5" text-anchor="end" fill="#b91c1c">gap</text>
<line x1="190" y1="60" x2="190" y2="100" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<text x="310" y="40" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Squishy</text>
<rect x="280" y="130" width="60" height="12" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="280" y="100" width="60" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="282" y="120" width="50" height="1.5" fill="#64748b" stroke="none" stroke-width="1.5"/>
<rect x="286" y="122" width="50" height="1.5" fill="#64748b" stroke="none" stroke-width="1.5"/>
<rect x="282" y="124" width="50" height="1.5" fill="#64748b" stroke="none" stroke-width="1.5"/>
<rect x="286" y="126" width="50" height="1.5" fill="#64748b" stroke="none" stroke-width="1.5"/>
<rect x="282" y="128" width="50" height="1.5" fill="#64748b" stroke="none" stroke-width="1.5"/>
<line x1="310" y1="60" x2="310" y2="100" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>
<text x="430" y="40" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">Induced</text>
<rect x="400" y="130" width="60" height="12" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="400" y="100" width="60" height="20" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="460" y1="110" x2="500" y2="90" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="440" y="84" font-size="9" text-anchor="start" fill="#5b6577">pipe pull</text>
<line x1="430" y1="60" x2="430" y2="100" stroke="#1a2233" stroke-width="4" stroke-linecap="round"/>

Type
Fix
<text x="250" y="175" font-size="10" text-anchor="middle" fill="#5b6577">parallel: shim the gap · angular: taper shim · squishy: clean, fewer thicker shims</text>
<text x="250" y="192" font-size="10" text-anchor="middle" fill="#5b6577">induced: fix the pipe or base, the machine is being pulled, not resting</text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Check one bolt at a time with an indicator on the foot; over 0.002 in = soft.</text>
</svg>