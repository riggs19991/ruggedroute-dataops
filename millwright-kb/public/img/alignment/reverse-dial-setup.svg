<circle cx="175" cy="180" r="11" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="175" y1="169" x2="175" y2="164" stroke="#1a2233" stroke-width="1.5" stroke-linecap="round"/>
<text x="150" y="62" font-size="10" text-anchor="start" fill="#1a2233">indicator S reads M</text>
<text x="120" y="245" font-size="10" text-anchor="start" fill="#1a2233">indicator M reads S</text>
<rect x="300" y="40" width="180" height="100" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="300" y1="90" x2="480" y2="90" stroke="#5b6577" stroke-width="1" stroke-linecap="round"/>
<line x1="320" y1="90" x2="460" y2="62" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/>
