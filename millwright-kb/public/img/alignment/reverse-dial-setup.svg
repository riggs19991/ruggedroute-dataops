<line x1="320" y1="86" x2="320" y2="94" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<text x="320" y="106" font-size="9" text-anchor="middle" fill="#1a2233">S</text>
<line x1="360" y1="86" x2="360" y2="94" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<text x="360" y="106" font-size="9" text-anchor="middle" fill="#1a2233">M</text>
<line x1="400" y1="86" x2="400" y2="94" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<text x="400" y="106" font-size="9" text-anchor="middle" fill="#1a2233">front</text>
<line x1="440" y1="86" x2="440" y2="94" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<text x="440" y="106" font-size="9" text-anchor="middle" fill="#1a2233">rear</text>
<text x="390" y="156" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="390" dy="0">graph: plot the movable shaft line,</tspan><tspan x="390" dy="11.875">read the shim at each foot</tspan></text>
<text x="390" y="200" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="390" dy="0">no face reading, no axial float error,</tspan><tspan x="390" dy="12.5">fits tight couplings</tspan></text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Sag-correct both indicators; readings at 3-9 give horizontal, 12-6 vertical.</text>
