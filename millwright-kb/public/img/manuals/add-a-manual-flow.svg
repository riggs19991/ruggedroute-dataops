<rect width="500" height="170" fill="#ffffff"/>
<rect x="20" y="40" width="86" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="63" y="67.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="63" dy="0">Contribute</tspan><tspan x="63" dy="13.125">button</tspan></text>
<rect x="114" y="40" width="86" height="60" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="157" y="67.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="157" dy="0">Title, maker,</tspan><tspan x="157" dy="13.125">model, tags</tspan></text>
<rect x="208" y="40" width="86" height="60" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="251" y="67.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="251" dy="0">Attach PDF</tspan><tspan x="251" dy="13.125">(50 MB max)</tspan></text>
<rect x="302" y="40" width="86" height="60" fill="#fff4d6" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="345" y="67.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="345" dy="0">Submit for</tspan><tspan x="345" dy="13.125">review</tspan></text>
<rect x="396" y="40" width="86" height="60" fill="#dcfce7" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="439" y="67.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="439" dy="0">Teacher</tspan><tspan x="439" dy="13.125">publishes</tspan></text>
<line x1="106" y1="70" x2="114" y2="70" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="200" y1="70" x2="208" y2="70" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
