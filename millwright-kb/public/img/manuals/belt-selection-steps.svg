<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Belt selection steps</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="320" fill="#ffffff"/>
<rect x="20" y="24" width="230" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="41.675" font-size="10.5" text-anchor="middle" fill="#1a2233">1. design hp = motor hp × SF</text>
<text x="262" y="42" font-size="11" text-anchor="start" font-weight="700" fill="#0b5fa5">30 × 1.3 = 39</text>
<rect x="20" y="58" width="230" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="75.675" font-size="10.5" text-anchor="middle" fill="#1a2233">2. section chart (hp vs rpm)</text>
<text x="262" y="76" font-size="11" text-anchor="start" font-weight="700" fill="#0b5fa5">5V</text>
<rect x="20" y="92" width="230" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="109.675" font-size="10.5" text-anchor="middle" fill="#1a2233">3. sheave diameters, ratio</text>
<text x="262" y="110" font-size="11" text-anchor="start" font-weight="700" fill="#0b5fa5">7.1 and 14.0 in</text>
<rect x="20" y="126" width="230" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="143.675" font-size="10.5" text-anchor="middle" fill="#1a2233">4. belt length at centres</text>
<text x="262" y="144" font-size="11" text-anchor="start" font-weight="700" fill="#0b5fa5">36 in → 5V850</text>
<rect x="20" y="160" width="230" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="177.675" font-size="10.5" text-anchor="middle" fill="#1a2233">5. hp per belt + ratio add</text>
<text x="262" y="178" font-size="11" text-anchor="start" font-weight="700" fill="#0b5fa5">10.5 + 0.8 = 11.3</text>
<rect x="20" y="194" width="230" height="28" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="211.675" font-size="10.5" text-anchor="middle" fill="#1a2233">6. × arc × length factors</text>
<text x="262" y="212" font-size="11" text-anchor="start" font-weight="700" fill="#0b5fa5">× 0.97 × 0.98 = 10.7</text>
<rect x="20" y="228" width="230" height="28" fill="#dcfce7" stroke="#166534" stroke-width="1.5" rx="6"/><text x="135" y="245.675" font-size="10.5" text-anchor="middle" fill="#1a2233">7. belts = design ÷ per belt</text>
<text x="262" y="246" font-size="11" text-anchor="start" font-weight="700" fill="#0b5fa5">39 ÷ 10.7 → 4 belts</text>
<circle cx="400" cy="110" r="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="460" cy="110" r="40" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<line x1="392" y1="89" x2="445" y2="72" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/>
<line x1="392" y1="131" x2="445" y2="148" stroke="#1a2233" stroke-width="2.5" stroke-linecap="round"/>
<path d="M392.4755568468353,130.67323765728997 A22,22 0 0 1 392.4755568468353,89.32676234271003" fill="none" stroke="#1a2233" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M473.6808057330268,72.41229516856367 A40,40 0 0 1 473.6808057330268,147.58770483143633" fill="none" stroke="#1a2233" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M389.7393957002299,138.19077862357724 A30,30 0 0 1 389.7393957002299,81.80922137642276" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="362" y="182" font-size="9.5" text-anchor="start" fill="#b91c1c">arc &lt; 180° on small sheave</text>
<text x="420" y="198" font-size="9" text-anchor="middle" fill="#5b6577"><tspan x="420" dy="0">factor 0.99 at 170°,</tspan><tspan x="420" dy="11.25">0.95 at 150°, 0.89 at 130°</tspan></text>
<text x="400" y="282" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="400" dy="0">matched belt set,</tspan><tspan x="400" dy="11.875">same groove count sheaves</tspan></text>
<text x="250" y="312" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Round belt count up; one belt short overloads the whole set.</text>
</svg>