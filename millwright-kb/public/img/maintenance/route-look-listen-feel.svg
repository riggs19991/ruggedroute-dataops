<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Route: look, listen, feel</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="200" fill="#ffffff"/>
<rect x="20" y="40" width="86" height="34" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="63" y="61.025" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">LOOK</text>
<text x="63" y="92" font-size="8" text-anchor="middle" fill="#5b6577"><tspan x="63" dy="0">leaks, levels,</tspan><tspan x="63" dy="10">guards, dust</tspan></text>
<rect x="114" y="40" width="86" height="34" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="157" y="61.025" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">LISTEN</text>
<text x="157" y="92" font-size="8" text-anchor="middle" fill="#5b6577"><tspan x="157" dy="0">growl, whine,</tspan><tspan x="157" dy="10">knock, squeal</tspan></text>
<rect x="208" y="40" width="86" height="34" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="251" y="61.025" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">FEEL</text>
<text x="251" y="92" font-size="8" text-anchor="middle" fill="#5b6577"><tspan x="251" dy="0">vibration, heat</tspan><tspan x="251" dy="10">(outside guards)</tspan></text>
<rect x="302" y="40" width="86" height="34" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="345" y="61.025" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">MEASURE</text>
<text x="345" y="92" font-size="8" text-anchor="middle" fill="#5b6577"><tspan x="345" dy="0">temp, vibration,</tspan><tspan x="345" dy="10">amps, pressure</tspan></text>
<rect x="396" y="40" width="86" height="34" fill="#dcfce7" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="439" y="61.025" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1a2233">RECORD</text>
<text x="439" y="92" font-size="8" text-anchor="middle" fill="#5b6577"><tspan x="439" dy="0">a number, not OK;</tspan><tspan x="439" dy="10">compare to last</tspan></text>
<line x1="106" y1="57" x2="114" y2="57" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="200" y1="57" x2="208" y2="57" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="294" y1="57" x2="302" y2="57" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="388" y1="57" x2="396" y2="57" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="250" y="145" font-size="10" text-anchor="middle" fill="#5b6577">alert at baseline + 20°F or 2× baseline vibration; act at 180°F on a bearing housing</text>
<text x="250" y="192" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Paint the measuring points on the machine so every reading is comparable.</text>
</svg>