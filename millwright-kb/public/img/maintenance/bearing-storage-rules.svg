<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Bearing storage rules</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="220" fill="#ffffff"/>
<rect x="40" y="50" width="260" height="130" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<line x1="50" y1="90" x2="290" y2="90" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
<line x1="50" y1="130" x2="290" y2="130" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
<line x1="50" y1="170" x2="290" y2="170" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
<rect x="60" y="54" width="60" height="16" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="90" y="66" font-size="8.5" text-anchor="middle" fill="#1a2233">2023-04</text>
<rect x="130" y="54" width="60" height="16" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="160" y="66" font-size="8.5" text-anchor="middle" fill="#1a2233">2024-01</text>
<rect x="200" y="54" width="60" height="16" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="230" y="66" font-size="8.5" text-anchor="middle" fill="#1a2233">2024-09</text>
<rect x="60" y="94" width="60" height="16" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="90" y="106" font-size="8.5" text-anchor="middle" fill="#1a2233">wrapped</text>
<rect x="130" y="94" width="60" height="16" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="160" y="106" font-size="8.5" text-anchor="middle" fill="#1a2233">flat</text>
<rect x="200" y="94" width="60" height="16" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<text x="230" y="106" font-size="8.5" text-anchor="middle" fill="#1a2233">boxed</text>
<line x1="60" y1="150" x2="260" y2="150" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="160" y="165" font-size="9.5" text-anchor="middle" fill="#0b5fa5">first in, first out: date on the box</text>
<text x="400" y="60" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="400" dy="0">dry: under 60% RH</tspan><tspan x="400" dy="12.5">cool and steady</tspan><tspan x="400" dy="12.5">no vibration nearby</tspan><tspan x="400" dy="12.5">no solvents or dust</tspan></text>
<text x="400" y="150" font-size="10" text-anchor="middle" fill="#b91c1c"><tspan x="400" dy="0">never unwrap to look;</tspan><tspan x="400" dy="12.5">never wash the</tspan><tspan x="400" dy="12.5">factory preservative off</tspan></text>
<text x="250" y="212" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Shelf next to a running compressor = false brinelling before installation.</text>
</svg>