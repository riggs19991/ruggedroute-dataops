<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>MTBF timeline</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="200" fill="#ffffff"/>
<rect x="40" y="60" width="120" height="40" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="160" y="60" width="20" height="40" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="180" y="60" width="150" height="40" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="330" y="60" width="15" height="40" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="345" y="60" width="115" height="40" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/>
<text x="100" y="85" font-size="10" text-anchor="middle" fill="#1a2233">running</text>
<text x="255" y="85" font-size="10" text-anchor="middle" fill="#1a2233">running</text>
<text x="402" y="85" font-size="10" text-anchor="middle" fill="#1a2233">running</text>
<text x="170" y="52" font-size="9" text-anchor="middle" fill="#b91c1c">repair</text>
<text x="337" y="52" font-size="9" text-anchor="middle" fill="#b91c1c">repair</text>
<line x1="40" y1="120" x2="460" y2="120" stroke="#1a2233" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="250" y="116" font-size="10" text-anchor="middle" fill="#1a2233">one year: 6,000 h running, 4 failures, 32 h down</text>
<text x="250" y="155" font-size="10" text-anchor="middle" fill="#5b6577">MTBF = 6,000 ÷ 4 = 1,500 h · MTTR = 32 ÷ 4 = 8 h · availability = 1,500 ÷ 1,508 = 99.5%</text>
<text x="250" y="192" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">The trend and the comparison between twins matter more than the number.</text>
</svg>