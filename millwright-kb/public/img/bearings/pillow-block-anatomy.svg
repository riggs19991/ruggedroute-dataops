<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Pillow block anatomy</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="260" fill="#ffffff"/>
<path d="M60,190 L260,190 L260,160 L230,140 L230,100 L90,100 L90,140 L60,160 Z" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="190" width="240" height="14" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="160" cy="130" r="44" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="160" cy="130" r="22" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<rect x="40" y="118" width="240" height="24" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" opacity="0.6"/>
<rect x="224" y="108" width="16" height="44" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<line x1="232" y1="104" x2="232" y2="90" stroke="#1a2233" stroke-width="3" stroke-linecap="round"/>
<circle cx="232" cy="84" r="5" fill="#1a2233" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="90" cy="70" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="90" y="74" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="160" cy="130" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="160" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="232" cy="70" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="232" y="74" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="70" cy="200" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="70" y="204" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="309" cy="46" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="309" y="50" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="324" y="50" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="324" dy="0">housing (cast iron); base</tspan><tspan x="324" dy="13.125">flat and bolted</tspan></text>
<circle cx="309" cy="75.125" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="309" y="79.125" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="324" y="79.125" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="324" dy="0">insert: spherical OD self-</tspan><tspan x="324" dy="13.125">aligns 2°; wide inner ring</tspan></text>
<circle cx="309" cy="104.25" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="309" y="108.25" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="324" y="108.25" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="324" dy="0">set screws on the flat, both</tspan><tspan x="324" dy="13.125">torqued; or eccentric collar</tspan><tspan x="324" dy="13.125">turned with rotation</tspan></text>
<circle cx="309" cy="146.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="309" y="150.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="324" y="150.5" font-size="10.5" text-anchor="start" fill="#1a2233"><tspan x="324" dy="0">fixed end: screws tight;</tspan><tspan x="324" dy="13.125">floating end lets it grow</tspan></text>
<text x="250" y="252" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Shaft under 35 HRC, set-screw spot dimpled; housing 1/3 full of grease.</text>
