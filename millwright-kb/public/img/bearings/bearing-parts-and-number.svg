<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Bearing parts and number</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="300" fill="#ffffff"/>
<circle cx="130" cy="130" r="100" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="130" cy="130" r="80" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="130" cy="130" r="55" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="130" cy="130" r="38" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="197" cy="130" r="11" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="177.3761543394987" cy="177.37615433949867" r="11" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="130" cy="197" r="11" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="82.62384566050132" cy="177.3761543394987" r="11" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="63" cy="130" r="11" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="82.6238456605013" cy="82.62384566050132" r="11" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="130" cy="63" r="11" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="177.37615433949867" cy="82.6238456605013" r="11" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="130" cy="130" r="67" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="130" cy="38" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="130" y="42" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="130" cy="88" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="130" y="92" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="178" cy="82" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="178" y="86" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="130" cy="130" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="130" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="40" cy="130" r="9" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="40" y="134" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<circle cx="259" cy="36" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="259" y="40" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="274" y="40" font-size="11" text-anchor="start" fill="#1a2233">outer ring (housing fit)</text>
<circle cx="259" cy="53" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="259" y="57" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="274" y="57" font-size="11" text-anchor="start" fill="#1a2233">inner ring (shaft fit)</text>
<circle cx="259" cy="70" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="259" y="74" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="274" y="74" font-size="11" text-anchor="start" fill="#1a2233">balls or rollers</text>
<circle cx="259" cy="87" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="259" y="91" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="274" y="91" font-size="11" text-anchor="start" fill="#1a2233">bore = the last two digits × 5 mm</text>
<circle cx="259" cy="104" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="259" y="108" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text><text x="274" y="108" font-size="11" text-anchor="start" fill="#1a2233">cage (retainer), seals or shields</text>
<text x="250" y="160" font-size="24" text-anchor="start" font-weight="700" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">6 2 05 - 2RS C3</text>
<text x="245" y="185" font-size="10" text-anchor="start" fill="#5b6577"><tspan x="245" dy="0">6 = deep-groove ball · 2 = light series</tspan><tspan x="245" dy="12.5">05 = 25 mm bore (05 × 5)</tspan></text>
<text x="245" y="215" font-size="10" text-anchor="start" fill="#5b6577"><tspan x="245" dy="0">2RS = two rubber seals (ZZ = shields)</tspan><tspan x="245" dy="12.5">C3 = clearance larger than normal</tspan></text>
<text x="245" y="246" font-size="10" text-anchor="start" fill="#5b6577">bore codes 00, 01, 02, 03 = 10, 12, 15, 17 mm</text>
<text x="250" y="292" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Same number from any maker fits the same shaft and housing.</text>
</svg>