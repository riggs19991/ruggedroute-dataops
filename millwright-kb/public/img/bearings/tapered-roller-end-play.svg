<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Tapered roller end play</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="250" fill="#ffffff"/>
<rect x="40" y="100" width="300" height="50" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5"/>
<rect x="20" y="112" width="380" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M70,100 L110,100 L110,150 L70,150 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(90,125) rotate(-12)"><path d="M-16,-10 L16,-14 L16,14 L-16,10 Z" fill="#64748b" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<path d="M78,100 L114,100 L114,108 L78,112 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M310,100 L270,100 L270,150 L310,150 Z" fill="#ffffff" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(290,125) rotate(12)"><path d="M-16,-10 L16,-14 L16,14 L-16,10 Z" fill="#64748b" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<path d="M302,100 L266,100 L266,108 L302,112 Z" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="400" y1="125" x2="440" y2="125" stroke="#1a2233" stroke-width="2" stroke-linecap="round"/>
<circle cx="452" cy="125" r="12" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="452" y1="125" x2="458" y2="116" stroke="#1a2233" stroke-width="1" stroke-linecap="round"/>
<line x1="412" y1="100" x2="412" y2="150" stroke="#0b5fa5" stroke-width="1" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="412" y="168" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="412" dy="0">push, pull:</tspan><tspan x="412" dy="12.5">end play</tspan></text>
<text x="220" y="190" font-size="10" text-anchor="middle" fill="#5b6577">cups (outer races) pressed in the housing, cones (inner) on the shaft</text>
<text x="220" y="208" font-size="9.5" text-anchor="middle" fill="#5b6577">adjust by nut or shims: 0.001-0.005 in end play cold; preload only where specified</text>
<text x="250" y="242" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Rotate the shaft while seating; hot running end play is less than cold.</text>
</svg>