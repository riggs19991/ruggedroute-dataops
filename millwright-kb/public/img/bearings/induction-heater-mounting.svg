<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 285" width="500" height="285" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Induction heater mounting</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="285" fill="#ffffff"/>
<rect x="40" y="200" width="200" height="30" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="4"/>
<rect x="60" y="80" width="30" height="120" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<rect x="60" y="70" width="160" height="14" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="140" cy="140" r="44" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="140" cy="140" r="24" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<rect x="130" y="96" width="20" height="4" fill="#b91c1c" stroke="#1a2233" stroke-width="1.5"/>
<line x1="140" y1="96" x2="140" y2="60" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<text x="140" y="52" font-size="10" text-anchor="middle" fill="#5b6577">probe on the inner ring</text>
<rect x="250" y="90" width="220" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" rx="6"/><text x="360" y="107.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="360" dy="0">230°F (110°C) max; 175°F for</tspan><tspan x="360" dy="13.125">sealed and shielded bearings</tspan></text>
<rect x="280" y="160" width="180" height="26" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<rect x="280" y="150" width="14" height="46" fill="#64748b" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="330" cy="173" r="30" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="330" cy="173" r="14" fill="#ffffff" stroke="#1a2233" stroke-width="1.5"/>
<line x1="380" y1="173" x2="300" y2="173" stroke="#0b5fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="370" y="215" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="370" dy="0">push to the shoulder, hold against it</tspan><tspan x="370" dy="12.5">until it grips (it shrinks as it cools)</tspan></text>
<text x="40" y="262" font-size="10" text-anchor="start" fill="#5b6577">demagnetise after; never a torch on the bearing</text>
<text x="250" y="277" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Rule: bearing bore grows 0.001 in per inch per 100°F rise.</text>
</svg>