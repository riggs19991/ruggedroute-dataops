<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>VFD bearing currents</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="240" fill="#ffffff"/>
<rect x="30" y="80" width="90" height="80" fill="#dbeafe" stroke="#0b5fa5" stroke-width="1.5" rx="6"/>
<text x="75" y="124" font-size="14" text-anchor="middle" font-weight="700" fill="#0b5fa5">VFD</text>
<rect x="200" y="70" width="180" height="100" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="10"/>
<rect x="380" y="108" width="80" height="24" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="210" cy="120" r="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<circle cx="370" cy="120" r="22" fill="#cbd5e1" stroke="#1a2233" stroke-width="1.5"/>
<path d="M120,120 L200,120" fill="none" stroke="#1a2233" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M120,112 L200,112" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="160" y="78" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="160" dy="0">shielded VFD cable,</tspan><tspan x="160" dy="11.875">shield bonded both ends</tspan></text>
<rect x="388" y="100" width="8" height="40" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
<text x="400" y="176" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="400" dy="0">shaft grounding</tspan><tspan x="400" dy="11.875">ring (DE)</tspan></text>
<circle cx="210" cy="120" r="26" fill="none" stroke="#b91c1c" stroke-width="3"/>
<text x="210" y="182" font-size="9.5" text-anchor="middle" fill="#5b6577"><tspan x="210" dy="0">insulated bearing</tspan><tspan x="210" dy="11.875">(ODE)</tspan></text>
<line x1="300" y1="40" x2="306" y2="56" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="312" y1="40" x2="318" y2="56" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="324" y1="40" x2="330" y2="56" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<line x1="336" y1="40" x2="342" y2="56" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round"/>
<text x="320" y="32" font-size="9.5" text-anchor="middle" fill="#b91c1c">discharge → fluting</text>
<text x="250" y="232" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Fluting shows as a washboard pattern and a whine that rises with speed.</text>
</svg>