<text x="326" y="76.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">limited</text>
<text x="421" y="76.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">3 ft 6 in</text>
