<text x="326" y="98.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">restricted</text>
<text x="421" y="98.96000000000001" font-size="10.5" text-anchor="start" fill="#1a2233">1 ft 0 in</text>
