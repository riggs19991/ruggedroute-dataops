<text x="405" y="150" font-size="10" text-anchor="middle" fill="#5b6577"><tspan x="405" dy="0">unqualified: stay outside</tspan><tspan x="405" dy="12.5">the limited boundary</tspan><tspan x="405" dy="12.5">unless escorted</tspan></text>
