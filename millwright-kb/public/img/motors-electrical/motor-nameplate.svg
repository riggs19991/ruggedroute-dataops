<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>Motor nameplate</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="260" fill="#ffffff"/>
<rect x="40" y="30" width="300" height="200" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/>
<text x="190" y="52" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2233">INDUCTION MOTOR</text>
<text x="52" y="78" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">HP 25</text>
<text x="200" y="78" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">kW 18.6</text>
<text x="52" y="100" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">VOLTS 230/460</text>
<text x="200" y="100" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">AMPS 62/31</text>
<text x="52" y="122" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">RPM 1770</text>
<text x="200" y="122" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">HZ 60  PH 3</text>
<text x="52" y="144" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">FRAME 284T</text>
<text x="200" y="144" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">S.F. 1.15</text>
<text x="52" y="166" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">INSUL CLASS F</text>
<text x="200" y="166" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">AMB 40°C</text>
<text x="52" y="188" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">ENCL TEFC</text>
<text x="200" y="188" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">CODE G</text>
<text x="52" y="210" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">DUTY CONT</text>
<text x="200" y="210" font-size="11" text-anchor="start" fill="#1a2233" font-family="ui-monospace, Menlo, Consolas, monospace">NEMA DESIGN B</text>
<circle cx="118" cy="74" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="118" y="78" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="300" cy="96" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="300" y="100" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="124" cy="118" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="124" y="122" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="136" cy="140" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="136" y="144" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="278" cy="140" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="278" y="144" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<circle cx="152" cy="162" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="152" y="166" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text>
<circle cx="359" cy="36" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="359" y="40" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="374" y="40" font-size="10" text-anchor="start" fill="#1a2233">HP and kW</text>
<circle cx="359" cy="51" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="359" y="55" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="374" y="55" font-size="10" text-anchor="start" fill="#1a2233">FLA at each voltage</text>
<circle cx="359" cy="66" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="359" y="70" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="374" y="70" font-size="10" text-anchor="start" fill="#1a2233">rpm: 1770 = 4 pole</text>
<circle cx="359" cy="81" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="359" y="85" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="374" y="85" font-size="10" text-anchor="start" fill="#1a2233"><tspan x="374" dy="0">frame: shaft height</tspan><tspan x="374" dy="12.5">and foot spacing</tspan></text>
<circle cx="359" cy="108.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="359" y="112.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">5</text><text x="374" y="112.5" font-size="10" text-anchor="start" fill="#1a2233">service factor 1.15</text>
<circle cx="359" cy="123.5" r="8" fill="#0b5fa5" stroke="#ffffff" stroke-width="1.5"/><text x="359" y="127.5" font-size="11" text-anchor="middle" font-weight="700" fill="#fff">6</text><text x="374" y="127.5" font-size="10" text-anchor="start" fill="#1a2233">Class F: 155°C max</text>
<text x="250" y="252" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Replacement must match frame, voltage, rpm, enclosure and mounting.</text>
</svg>