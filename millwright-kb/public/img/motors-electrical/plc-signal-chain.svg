<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a2233">
<title>PLC signal chain</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#64748b" stroke-width="1.2"/></pattern>
<pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#0b5fa5" stroke-width="1.2"/></pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#64748b"/></pattern>
</defs>
<rect width="500" height="200" fill="#ffffff"/>
<rect x="20" y="60" width="70" height="60" fill="#fff4d6" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="55" y="87.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="55" dy="0">sensor</tspan><tspan x="55" dy="13.125">(prox, eye)</tspan></text>
<rect x="100" y="60" width="70" height="60" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="135" y="87.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="135" dy="0">input card</tspan><tspan x="135" dy="13.125">LED on?</tspan></text>
<rect x="180" y="60" width="70" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="215" y="87.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="215" dy="0">PLC</tspan><tspan x="215" dy="13.125">program</tspan></text>
<rect x="260" y="60" width="70" height="60" fill="#dbeafe" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="295" y="87.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="295" dy="0">output card</tspan><tspan x="295" dy="13.125">LED on?</tspan></text>
<rect x="340" y="60" width="70" height="60" fill="#f1f5f9" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="375" y="87.1125" font-size="10.5" text-anchor="middle" fill="#1a2233"><tspan x="375" dy="0">contactor</tspan><tspan x="375" dy="13.125">or VFD</tspan></text>
<rect x="420" y="60" width="70" height="60" fill="#dcfce7" stroke="#1a2233" stroke-width="1.5" rx="6"/><text x="455" y="93.675" font-size="10.5" text-anchor="middle" fill="#1a2233">motor</text>
<line x1="90" y1="90" x2="100" y2="90" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="170" y1="90" x2="180" y2="90" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="250" y1="90" x2="260" y2="90" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="330" y1="90" x2="340" y2="90" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="410" y1="90" x2="420" y2="90" stroke="#1a2233" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="250" y="150" font-size="9.5" text-anchor="middle" fill="#5b6577">check in order: target in range, sensor LED, input LED, output LED, contactor in, motor free</text>
<text x="250" y="192" font-size="12" text-anchor="middle" fill="#5b6577" font-style="italic">Never force an output or bypass a safety input: call the controls tech.</text>
</svg>