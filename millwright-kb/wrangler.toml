# Cloudflare Worker that serves the built site (dist/) as static assets with SPA routing.
# Deploy: npm run build && npx wrangler deploy   (CI does this in .github/workflows/millwright-kb.yml)
name = "millwright-kb"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
